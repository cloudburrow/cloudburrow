# CloudBurrow (#2139): Google's startup health checks dial Google's APIs
# (logging, monitoring, telemetry.googleapis.com), so the engine's run
# without -service is not made; each subagent's unit still validates and
# generates its configuration. The agent starts only behind its fence.
[Unit]
Requires=cloudburrow-ops-agent-fence.service cloudburrow-metadata-server.service
After=cloudburrow-ops-agent-fence.service cloudburrow-metadata-server.service
[Service]
Group=cloudburrow-opsagent
ExecCondition=+/usr/lib/cloudburrow/ops-agent condition main
ExecStartPre=
