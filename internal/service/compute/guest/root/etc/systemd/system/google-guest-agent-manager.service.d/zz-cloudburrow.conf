# Google's guest agent (#2179) runs in the group cloudburrow-guestagent,
# behind its egress fence (usr/lib/cloudburrow/guest-agent-fence), after
# the guest's firmware unit and the metadata server relay.
[Unit]
Requires=cloudburrow-guest-agent-fence.service
After=cloudburrow-guest-agent-fence.service cloudburrow-firmware.service cloudburrow-metadata-server.service

[Service]
Group=cloudburrow-guestagent
ExecCondition=/usr/lib/cloudburrow/guest-agent-fence condition
