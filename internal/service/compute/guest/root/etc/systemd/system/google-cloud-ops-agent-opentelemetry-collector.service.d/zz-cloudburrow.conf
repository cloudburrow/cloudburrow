# CloudBurrow (#2139): the subagent runs in the group cloudburrow-opsagent,
# whose packets the fence (cloudburrow-ops-agent-fence.service) lets reach
# only this instance's Cloud Logging and Cloud Monitoring; Google's config
# generator runs as packaged, then ops-agent localize points its output at
# those endpoints and the in-guest metadata relay, and refuses to start on
# anything else.
[Unit]
Requires=cloudburrow-ops-agent-fence.service cloudburrow-metadata-server.service
After=cloudburrow-ops-agent-fence.service cloudburrow-metadata-server.service
[Service]
Group=cloudburrow-opsagent
Environment=GCE_METADATA_HOST=127.0.0.1:8169 METADATA_SERVER=http://127.0.0.1:8169
UnsetEnvironment=HTTP_PROXY HTTPS_PROXY http_proxy https_proxy GOOGLE_APPLICATION_CREDENTIALS
PassEnvironment=GOOGLE_CLOUD_PROJECT
RestartSec=30
ExecCondition=+/usr/lib/cloudburrow/ops-agent condition otel
ExecStartPre=
ExecStartPre=/opt/google-cloud-ops-agent/libexec/google_cloud_ops_agent_engine -service=otel -in /etc/google-cloud-ops-agent/config.yaml -logs ${LOGS_DIRECTORY} -state ${STATE_DIRECTORY}
ExecStartPre=/usr/lib/cloudburrow/ops-agent localize otel
