# Google's guest agent in a CloudBurrow VM (#2179): only its HTTPS
# metadata server credentials job ([MDS], which the instance's or the
# project's disable-https-mds-setup metadata turns on, as on Compute
# Engine). CloudBurrow's own guest units do the rest (accounts and SSH
# keys, network, startup scripts); the agent writes no logs to Cloud
# Logging and talks to no Google service.
[Core]
cloud_logging_enabled = false
acs_client = false
on_demand_plugins = false

[Telemetry]
metric_collection_enabled = false

[accountManager]
disable = true

[addressManager]
disable = true

[Daemons]
accounts_daemon = false
clock_skew_daemon = false
network_daemon = false

[diagnostics]
enable = false

[IpForwarding]
ip_aliases = false
target_instance_ips = false

[InstanceSetup]
network_enabled = false
optimize_local_ssd = false
set_boto_config = false
set_host_keys = false
set_multiqueue = false

[MetadataScripts]
startup = false
shutdown = false

[NetworkInterfaces]
setup = false
ip_forwarding = false
manage_primary_nic = false
vlan_setup_enabled = false

[OSLogin]
cert_authentication = false

[Snapshots]
enabled = false

[Unstable]
set_hostname = false
set_fqdn = false

[MWLID]
enabled = false
