name: Release

# Kept separate from CI so that ordinary pull-request checks never run with
# publishing permissions. An untrusted PR cannot reach this workflow: it is
# triggered only by a tag push or a manual dispatch on a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Dry run: render the release notes for this tag (such as v0.2.0) from
          CHANGELOG.md, failing as a real release would if it has no section.
          Nothing is published either way.
        required: false
        default: ""

permissions:
  contents: read

env:
  # The local-AI runtime image (#602). Every release pushes it, tagged with
  # the release tag, and stamps its digest into the CLIs it builds.
  LOCAL_AI_IMAGE: ghcr.io/cloudburrow/litert-lm

jobs:
  verify:
    name: verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # A release must not ship something the checks would have rejected.
      - run: make check
      - run: go mod verify
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The notes are the tag's section of CHANGELOG.md. A tag without one
      # fails here, before anything is built or published, rather than
      # shipping notes that say nothing about what changed (#603).
      - name: Release notes from CHANGELOG.md
        env:
          DRY_RUN_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${DRY_RUN_TAG}" ]; then
            TAG="${DRY_RUN_TAG}"
          else
            echo "::notice::not a tag and no tag input; release notes not rendered"
            exit 0
          fi
          RELEASE_NOTES_LINK_BASE="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}" \
            sh scripts/release-notes.sh "${TAG}" > section.md
          { echo "## Release notes for ${TAG}"; echo; cat section.md; } >> "${GITHUB_STEP_SUMMARY}"

  # The local-AI runtime image, built from deploy/litert-lm on a native
  # runner per architecture: the Bazel build is ~6 minutes per arch on a fast
  # machine, and arm64 under QEMU would take hours. Each job pushes its image
  # by digest only; runtime-image-publish joins them under the release tag.
  # Only a tag builds it: a dry run has nothing to publish it for.
  runtime-image:
    name: runtime image ${{ matrix.platform }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # Pushed by digest, untagged: nothing is visible under the release tag
      # until both architectures have built. Buildx's own provenance is off
      # because the published index is attested by GitHub below, and an
      # extra attestation manifest per arch would appear in the index as an
      # unknown/unknown platform.
      - name: Build and push ${{ matrix.platform }} by digest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          df -h /
          docker buildx build deploy/litert-lm \
            --platform "${PLATFORM}" \
            --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --metadata-file metadata.json \
            --output "type=image,name=${LOCAL_AI_IMAGE},push-by-digest=true,name-canonical=true,push=true"
          df -h /
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          case "${digest}" in sha256:*) ;; *) echo "::error::no digest in the build metadata"; exit 1 ;; esac
          mkdir -p digests
          touch "digests/${digest#sha256:}"
          echo "${PLATFORM}: ${LOCAL_AI_IMAGE}@${digest}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-arch images into one index under the release tag, attests
  # it, and hands its digest to the CLI build. The only job holding package
  # write and signing rights together, and it runs nothing from the source
  # tree.
  runtime-image-publish:
    name: publish the runtime image
    needs: runtime-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Create the multi-arch index under the release tag
        id: index
        run: |
          set -eu
          set --
          for f in digests/*; do set -- "$@" "${LOCAL_AI_IMAGE}@sha256:$(basename "${f}")"; done
          [ "$#" -eq 2 ] || { echo "::error::expected two per-arch digests, got: $*"; exit 1; }
          docker buildx imagetools create \
            --tag "${LOCAL_AI_IMAGE}:${GITHUB_REF_NAME}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.description=LiteRT-LM runtime for CloudBurrow's local generation endpoint" \
            "$@"
          digest="$(docker buildx imagetools inspect "${LOCAL_AI_IMAGE}:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r .digest)"
          case "${digest}" in sha256:*) ;; *) echo "::error::could not read the index digest"; exit 1 ;; esac
          # The index must hold exactly the two platforms, and nothing else.
          platforms="$(docker buildx imagetools inspect "${LOCAL_AI_IMAGE}@${digest}" --raw \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')"
          [ "${platforms}" = "linux/amd64,linux/arm64" ] || { echo "::error::index platforms are ${platforms}"; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the runtime image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.LOCAL_AI_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Verify the attestation, and record the digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -eu
          gh attestation verify "oci://${LOCAL_AI_IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
          {
            echo "## Local AI runtime image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${LOCAL_AI_IMAGE}:${GITHUB_REF_NAME}\` |"
            echo "| Index digest | \`${DIGEST}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo
            echo "Stamped into this release's CLIs as the default \`--local-ai-image\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [verify, runtime-image-publish]
    # A tag needs the runtime image's digest to stamp; a dry run, which
    # builds no image, builds the CLIs with the dev default.
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (needs.runtime-image-publish.result == 'success' ||
       (needs.runtime-image-publish.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version is derived from tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LOCAL_AI_DIGEST: ${{ needs.runtime-image-publish.outputs.digest }}
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          # A release CLI defaults --local-ai-image to the runtime image this
          # run published, by digest; any other build keeps the unpublished
          # `make litert-lm` tag (#602).
          LOCAL_AI_LDFLAG=""
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            case "${LOCAL_AI_DIGEST}" in sha256:*) ;; *) echo "::error::no runtime image digest to stamp"; exit 1 ;; esac
            LOCAL_AI_LDFLAG="-X 'github.com/cloudburrow/cloudburrow/internal/config.releaseLocalAIImage=${LOCAL_AI_IMAGE}@${LOCAL_AI_DIGEST}'"
          fi
          # The Linux storage server every CLI embeds, whatever its own
          # platform: `up` builds the in-cluster image from it (#514).
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X 'github.com/cloudburrow/cloudburrow/internal/version.version=${VERSION}'" \
              -o "internal/storageimage/bin/cloudburrow-storage-linux-${arch}" ./cmd/cloudburrow-storage
          done
          mkdir -p dist
          NAME="cloudburrow_${VERSION}_${GOOS}_${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w \
              -X 'github.com/cloudburrow/cloudburrow/internal/version.version=${VERSION}' \
              -X 'github.com/cloudburrow/cloudburrow/internal/version.commit=$(git rev-parse --short HEAD)' \
              -X 'github.com/cloudburrow/cloudburrow/internal/version.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
              ${LOCAL_AI_LDFLAG}" \
            -o "dist/${NAME}/cloudburrow" ./cmd/cloudburrow

          # Ship the component inventory: a release should say exactly which
          # upstream versions it was built and tested against.
          cp LICENSE NOTICE dependencies.json "dist/${NAME}/"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudburrow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*
          retention-days: 7

  publish:
    name: publish release
    needs: [build, runtime-image-publish]
    # Only a tag publishes. A manual dispatch builds and uploads artifacts for
    # inspection but never creates a release, so the workflow can be exercised
    # without shipping anything.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job in the repository with write access, and it runs nothing
    # from the source tree beyond the already-built artifacts.
    permissions:
      contents: write
      # Attestations are signed with a short-lived certificate for this
      # workflow's OIDC identity: nothing long-lived to hold or leak.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One file listing every archive, so an installer verifies against a
      # single published list, and the formula is rendered from the same one.
      - name: Combined checksums
        run: (cd dist && sha256sum cloudburrow_*.tar.gz > checksums.txt && cat checksums.txt)

      # A checksum served next to the archive proves only that the two
      # agree. The attestation proves the archive was built by this workflow
      # from this repository: `gh attestation verify` checks it.
      - name: Attest the archives and the checksum list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/cloudburrow_*.tar.gz
            dist/checksums.txt

      - name: Render the Homebrew formula
        run: sh scripts/render-formula.sh "${GITHUB_REF_NAME}" dist/checksums.txt > dist/cloudburrow.rb

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_AI_DIGEST: ${{ needs.runtime-image-publish.outputs.digest }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Checked in verify already; run again so these notes are exactly
          # the section at this tag.
          RELEASE_NOTES_LINK_BASE="https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}" \
            sh scripts/release-notes.sh "${VERSION}" > section.md
          {
            echo "## CloudBurrow ${VERSION}"
            echo
            cat section.md
            echo
            echo "See [what actually works](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/docs/status.md)"
            echo "before installing — it is explicit about what does not."
            echo
            echo "### Component versions"
            echo
            echo "This build was tested against the versions in \`dependencies.json\`,"
            echo "included in every archive."
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "brew install cloudburrow/tap/cloudburrow"
            echo "# or, verifying the checksum and, when gh is present, the attestation:"
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VERSION}/scripts/install.sh | sh"
            echo '```'
            echo
            echo "### Local AI runtime image"
            echo
            echo "\`${LOCAL_AI_IMAGE}:${VERSION}\` (linux/amd64, linux/arm64), index digest"
            echo "\`${LOCAL_AI_DIGEST}\`. This release's CLI defaults \`--local-ai-image\` to"
            echo "exactly that digest and pulls it once, on the first \`up --local-ai-model\`."
            echo
            echo '```sh'
            echo "gh attestation verify oci://${LOCAL_AI_IMAGE}@${LOCAL_AI_DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "### Verify a download"
            echo
            echo '```sh'
            echo "sha256sum -c checksums.txt --ignore-missing"
            echo "gh attestation verify cloudburrow_${VERSION}_<os>_<arch>.tar.gz --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > notes.md

          gh release create "${VERSION}" \
            --title "CloudBurrow ${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            dist/*.tar.gz dist/*.sha256 dist/checksums.txt dist/cloudburrow.rb

  # Install what was just published, the way a user would, on both operating
  # systems. Every other release-path test runs against a stand-in; this is
  # the one that runs against the real release (#603).
  smoke:
    name: smoke-install the release (${{ matrix.os }})
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # gh attestation verify reads the release's attestations.
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer comes from the tag's raw URL, as the notes tell users
      # to fetch it, and must verify both the checksum and the attestation;
      # gh is on every hosted runner and reads the token from GH_TOKEN.
      - name: Install with install.sh, then run version and doctor
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/smoke-release.sh "${GITHUB_REF_NAME}"

      # Homebrew refuses a formula by path (`brew install ./cloudburrow.rb`:
      # "Homebrew requires formulae to be in a tap"; `brew audit [path]` is
      # disabled), so the attached formula goes into a throwaway local tap.
      - name: Homebrew formula - install, brew test, brew audit --strict
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          set -eu
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern cloudburrow.rb --dir dist
          brew tap-new --no-git cloudburrow-smoke/local
          cp dist/cloudburrow.rb "$(brew --repository cloudburrow-smoke/local)/Formula/cloudburrow.rb"
          brew install --formula cloudburrow-smoke/local/cloudburrow
          brew test cloudburrow-smoke/local/cloudburrow
          brew audit --strict --formula cloudburrow-smoke/local/cloudburrow

  tap:
    name: update the Homebrew tap
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The tap is another repository, so this needs a token that can push to
      # it and to nothing else. Without one the release is still complete;
      # the formula is attached to it for a maintainer to push by hand.
      - name: Push the formula to cloudburrow/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the tap was not updated. cloudburrow.rb is attached to the release."
            exit 0
          fi
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern cloudburrow.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cloudburrow/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp cloudburrow.rb tap/Formula/cloudburrow.rb
          cd tap
          git config user.name "cloudburrow-release"
          git config user.email "cloudburrow-release@users.noreply.github.com"
          git add Formula/cloudburrow.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "cloudburrow ${GITHUB_REF_NAME}"
          git push origin HEAD
