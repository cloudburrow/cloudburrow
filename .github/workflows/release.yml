name: Release

# Kept separate from CI so that ordinary pull-request checks never run with
# publishing permissions. An untrusted PR cannot reach this workflow: it is
# triggered only by a tag push or a manual dispatch on a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Dry run: render the release notes for this tag (such as v0.2.0) from
          CHANGELOG.md, failing as a real release would if it has no section.
          Nothing is published either way.
        required: false
        default: ""

permissions:
  contents: read

env:
  # The local-AI runtime image (#602). Every release pushes it, tagged with
  # the release tag, and stamps its digest into the CLIs it builds.
  LOCAL_AI_IMAGE: ghcr.io/cloudburrow/litert-lm

jobs:
  # Only a commit CI has passed is released (#596). This runs first, and every
  # other job waits on it, so an untested commit fails here before anything is
  # built, pushed to ghcr.io or published. It needs a successful ci-green check
  # run for this exact commit: a merged commit has one from its merge-queue run,
  # which tested this same SHA. When CI for the commit is still running it
  # waits, polling once a minute for up to 45 minutes; with no CI run, or none
  # that passed, it fails at once with the SHA in the error. A manual dispatch
  # is gated too, so a dry run exercises the same path.
  require-ci-green:
    name: require a green CI run for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a successful ci-green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/require-ci-green.sh "${GITHUB_SHA}"

  verify:
    name: verify before releasing
    needs: require-ci-green
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exact patch, so the compiler that builds a release is recorded:
          # dependencies.json toolchain.goRelease (#695).
          go-version: "1.27.1"

      # A release must not ship something the checks would have rejected.
      - run: make check
      - run: go mod verify
      - name: govulncheck
        run: |
          # Pinned: dependencies.json toolchain.govulncheck (#695).
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The notes are the tag's section of CHANGELOG.md. A tag without one
      # fails here, before anything is built or published, rather than
      # shipping notes that say nothing about what changed (#603).
      - name: Release notes from CHANGELOG.md
        env:
          DRY_RUN_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${DRY_RUN_TAG}" ]; then
            TAG="${DRY_RUN_TAG}"
          else
            echo "::notice::not a tag and no tag input; release notes not rendered"
            exit 0
          fi
          RELEASE_NOTES_LINK_BASE="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}" \
            sh scripts/release-notes.sh "${TAG}" > section.md
          { echo "## Release notes for ${TAG}"; echo; cat section.md; } >> "${GITHUB_STEP_SUMMARY}"

  # The local-AI runtime image, built from deploy/litert-lm on a native
  # runner per architecture: the Bazel build is ~6 minutes per arch on a fast
  # machine, and arm64 under QEMU would take hours. Each job pushes its image
  # by digest only; runtime-image-publish joins them under the release tag.
  # Only a tag builds it: a dry run has nothing to publish it for.
  runtime-image:
    name: runtime image ${{ matrix.platform }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # Pushed by digest, untagged: nothing is visible under the release tag
      # until both architectures have built. Buildx's own provenance is off
      # because the published index is attested by GitHub below, and an
      # extra attestation manifest per arch would appear in the index as an
      # unknown/unknown platform.
      - name: Build and push ${{ matrix.platform }} by digest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          df -h /
          docker buildx build deploy/litert-lm \
            --platform "${PLATFORM}" \
            --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --metadata-file metadata.json \
            --output "type=image,name=${LOCAL_AI_IMAGE},push-by-digest=true,name-canonical=true,push=true"
          df -h /
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          case "${digest}" in sha256:*) ;; *) echo "::error::no digest in the build metadata"; exit 1 ;; esac
          mkdir -p digests
          touch "digests/${digest#sha256:}"
          echo "${PLATFORM}: ${LOCAL_AI_IMAGE}@${digest}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-arch images into one index under the release tag, attests
  # it, and hands its digest to the CLI build. The only job holding package
  # write and signing rights together, and it runs nothing from the source
  # tree.
  runtime-image-publish:
    name: publish the runtime image
    needs: runtime-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Create the multi-arch index under the release tag
        id: index
        run: |
          set -eu
          set --
          for f in digests/*; do set -- "$@" "${LOCAL_AI_IMAGE}@sha256:$(basename "${f}")"; done
          [ "$#" -eq 2 ] || { echo "::error::expected two per-arch digests, got: $*"; exit 1; }
          docker buildx imagetools create \
            --tag "${LOCAL_AI_IMAGE}:${GITHUB_REF_NAME}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.description=LiteRT-LM runtime for CloudBurrow's local generation endpoint" \
            "$@"
          digest="$(docker buildx imagetools inspect "${LOCAL_AI_IMAGE}:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r .digest)"
          case "${digest}" in sha256:*) ;; *) echo "::error::could not read the index digest"; exit 1 ;; esac
          # The index must hold exactly the two platforms, and nothing else.
          platforms="$(docker buildx imagetools inspect "${LOCAL_AI_IMAGE}@${digest}" --raw \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')"
          [ "${platforms}" = "linux/amd64,linux/arm64" ] || { echo "::error::index platforms are ${platforms}"; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the runtime image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.LOCAL_AI_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Verify the attestation, and record the digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -eu
          gh attestation verify "oci://${LOCAL_AI_IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
          {
            echo "## Local AI runtime image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${LOCAL_AI_IMAGE}:${GITHUB_REF_NAME}\` |"
            echo "| Index digest | \`${DIGEST}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo
            echo "Stamped into this release's CLIs as the default \`--local-ai-image\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  # The patched BigQuery emulator every CLI embeds (#1061), built from the
  # modules third_party/bigquery-emulator pins and checks, from source, once
  # for the four build jobs (#1087): never from ci.yml's cache, so what a
  # release ships is built by this run, with the release's Go. The build
  # jobs check each file against the SHA-256 sums this job reports.
  bigquery-emulator:
    name: build the BigQuery emulator
    needs: require-ci-green
    runs-on: ubuntu-latest
    # Two ~200 MB Go builds, 8.5 minutes cold on ubuntu-latest.
    timeout-minutes: 40
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The release's Go: dependencies.json toolchain.goRelease (#695).
          go-version: "1.27.1"
          cache: false
      - name: Build the emulator
        run: go run ./tools/bqengine -out internal/bigqueryimage/bin -force
      - id: sums
        name: Stage the binaries and their SHA-256 sums
        run: |
          mkdir -p "$RUNNER_TEMP/bigquery-emulator"
          cp internal/bigqueryimage/bin/bigquery-emulator-* "$RUNNER_TEMP/bigquery-emulator/"
          cd "$RUNNER_TEMP/bigquery-emulator"
          sha256sum bigquery-emulator-* | tee SHA256SUMS
          echo "sums=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bigquery-emulator
          path: ${{ runner.temp }}/bigquery-emulator
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [verify, runtime-image-publish, bigquery-emulator]
    # A tag needs the runtime image's digest to stamp; a dry run, which
    # builds no image, builds the CLIs with the dev default.
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      needs.bigquery-emulator.result == 'success' &&
      (needs.runtime-image-publish.result == 'success' ||
       (needs.runtime-image-publish.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    # 20: the embedded BigQuery emulator is built once, by the job above (#1087).
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version is derived from tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exact patch, so the compiler that builds a release is recorded:
          # dependencies.json toolchain.goRelease (#695).
          go-version: "1.27.1"

      # The emulator the bigquery-emulator job built, each file checked
      # against the sums it reported (#1087).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bigquery-emulator
          path: ${{ runner.temp }}/bigquery-emulator
      - name: Check the emulator binaries and put them in place
        env:
          SUMS: ${{ needs.bigquery-emulator.outputs.sums }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/bigquery-emulator"
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS
          cp bigquery-emulator-* "$GITHUB_WORKSPACE/internal/bigqueryimage/bin/"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LOCAL_AI_DIGEST: ${{ needs.runtime-image-publish.outputs.digest }}
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          # A release CLI defaults --local-ai-image to the runtime image this
          # run published, by digest; any other build keeps the unpublished
          # `make litert-lm` tag (#602).
          LOCAL_AI_LDFLAG=""
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            case "${LOCAL_AI_DIGEST}" in sha256:*) ;; *) echo "::error::no runtime image digest to stamp"; exit 1 ;; esac
            LOCAL_AI_LDFLAG="-X 'github.com/cloudburrow/cloudburrow/internal/config.releaseLocalAIImage=${LOCAL_AI_IMAGE}@${LOCAL_AI_DIGEST}'"
          fi
          # The Linux storage server every CLI embeds, whatever its own
          # platform: `up` builds the in-cluster image from it (#514).
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X 'github.com/cloudburrow/cloudburrow/internal/version.version=${VERSION}'" \
              -o "internal/storageimage/bin/cloudburrow-storage-linux-${arch}" ./cmd/cloudburrow-storage
          done
          # The patched BigQuery emulator every CLI embeds (#1061), which
          # the bigquery-emulator job built from the modules
          # third_party/bigquery-emulator pins and checks: -prebuilt fails
          # unless it was built from the sources checked out here (#1087).
          go run ./tools/bqengine -out internal/bigqueryimage/bin -prebuilt
          mkdir -p dist
          NAME="cloudburrow_${VERSION}_${GOOS}_${GOARCH}"
          # CGO_ENABLED=0 for every target (#714): left to Go's default, the
          # native linux/amd64 build linked the runner's glibc while the cross
          # builds did not. docs/install.md#how-the-cli-is-linked says why.
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X 'github.com/cloudburrow/cloudburrow/internal/version.version=${VERSION}' \
              -X 'github.com/cloudburrow/cloudburrow/internal/version.commit=$(git rev-parse --short HEAD)' \
              -X 'github.com/cloudburrow/cloudburrow/internal/version.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
              ${LOCAL_AI_LDFLAG}" \
            -o "dist/${NAME}/cloudburrow" ./cmd/cloudburrow

          # Ship the component inventory: a release should say exactly which
          # upstream versions it was built and tested against.
          cp LICENSE NOTICE dependencies.json "dist/${NAME}/"
          # The embedded BigQuery emulator's licences and notices (#1061).
          gzip -dc internal/bigqueryimage/bin/bigquery-emulator-licenses.txt.gz > "dist/${NAME}/LICENSES-bigquery-emulator.txt"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      # The archive's binary, not the command line, is what ships: check the
      # setting it records.
      - name: Check the CLI is built with CGO_ENABLED=0
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          for bin in dist/cloudburrow_*_"${GOOS}_${GOARCH}"/cloudburrow; do
            [ -f "${bin}" ] || { echo "::error::no CLI binary for ${GOOS}/${GOARCH} in dist/"; exit 1; }
            got="$(go version -m "${bin}" | awk '$1 == "build" && $2 ~ /^CGO_ENABLED=/ { print $2 }')"
            if [ "${got}" != "CGO_ENABLED=0" ]; then
              echo "::error::${bin} records '${got:-no CGO_ENABLED}', want CGO_ENABLED=0 (docs/install.md#how-the-cli-is-linked)"
              exit 1
            fi
            echo "${bin}: ${got}"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudburrow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*
          retention-days: 7

  # Developer ID signing and notarization of the two darwin binaries (#605),
  # on a macOS runner because codesign and notarytool exist nowhere else. It
  # replaces the darwin artifacts in place, before publish computes
  # checksums.txt, the attestations and the formula, so all three cover the
  # signed archives. The Apple credentials are repository secrets the
  # maintainer adds; without them (a fork, or before they are added) the job
  # passes with a notice and the release ships the unsigned archives. A dry
  # run signs too, so signing can be checked without publishing anything.
  # It runs nothing from the source tree: only the already-built artifacts.
  sign-macos:
    name: sign and notarize darwin
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.secrets.outputs.present }}
    steps:
      # All six or none: a partial set is a misconfiguration, and shipping
      # unsigned archives because of one would pass silently.
      - name: Check for the signing secrets
        id: secrets
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          present=0
          missing=""
          for name in MACOS_SIGNING_CERT_P12_BASE64 MACOS_SIGNING_CERT_PASSWORD MACOS_SIGNING_IDENTITY \
                      APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [ -n "${!name:-}" ]; then present=$((present + 1)); else missing="${missing} ${name}"; fi
          done
          if [ "${present}" -eq 0 ]; then
            echo "::notice::The macOS signing secrets are not configured; the darwin archives are released unsigned and not notarized (docs/install.md#gatekeeper)."
            echo "present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ -n "${missing}" ]; then
            echo "::error::Some macOS signing secrets are set but these are missing:${missing}. Set all six or none."
            exit 1
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.secrets.outputs.present == 'true'
        with:
          pattern: cloudburrow-darwin-*
          path: dist
          merge-multiple: true

      # A throwaway keychain holding only the Developer ID certificate, with
      # a random password nobody knows; codesign is the only tool allowed to
      # use the key. The .p12 is deleted as soon as it is imported.
      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.secrets.outputs.present == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -eu
          keychain="${RUNNER_TEMP}/cloudburrow-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          p12="${RUNNER_TEMP}/cloudburrow-signing.p12"
          printf '%s' "${P12_BASE64}" | base64 --decode > "${p12}"
          security import "${p12}" -k "${keychain}" -f pkcs12 -P "${P12_PASSWORD}" -T /usr/bin/codesign
          rm -f "${p12}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}" > /dev/null
          # codesign finds the identity only in the search list.
          existing="$(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')"
          # shellcheck disable=SC2086 # one keychain path per line, none with spaces
          security list-keychains -d user -s "${keychain}" ${existing}
          security find-identity -v -p codesigning "${keychain}" | grep -F "\"${IDENTITY}\"" > /dev/null \
            || { echo "::error::MACOS_SIGNING_IDENTITY is not a valid code-signing identity in the imported certificate"; exit 1; }

      # Hardened runtime and a secure timestamp are both required for
      # notarization. --force replaces the ad-hoc signature Go's linker adds.
      - name: Sign both darwin binaries
        if: steps.secrets.outputs.present == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -eu
          keychain="${RUNNER_TEMP}/cloudburrow-signing.keychain-db"
          mkdir -p work
          set --
          for archive in dist/cloudburrow_*_darwin_*.tar.gz; do
            tar -xzf "${archive}" -C work
            set -- "$@" "${archive}"
          done
          [ "$#" -eq 2 ] || { echo "::error::expected two darwin archives, got: $*"; exit 1; }
          for bin in work/*/cloudburrow; do
            codesign --force --options runtime --timestamp --keychain "${keychain}" --sign "${IDENTITY}" "${bin}"
            codesign --verify --strict --verbose=2 "${bin}"
            details="$(codesign -dv --verbose=2 "${bin}" 2>&1)"
            echo "${details}"
            echo "${details}" | grep -q '^Authority=Developer ID Application: ' \
              || { echo "::error::${bin} is not signed by a Developer ID Application certificate"; exit 1; }
            echo "${details}" | grep -q '^Timestamp=' \
              || { echo "::error::${bin} has no secure timestamp"; exit 1; }
            echo "${details}" | grep -q 'flags=.*(runtime)' \
              || { echo "::error::${bin} is not signed with the hardened runtime"; exit 1; }
          done

      # notarytool takes a zip, not a tarball or a bare binary; one zip holds
      # both. A bare Mach-O cannot have its ticket stapled, so Gatekeeper
      # looks the ticket up online the first time the binary runs.
      - name: Notarize
        if: steps.secrets.outputs.present == 'true'
        env:
          KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          key="${RUNNER_TEMP}/cloudburrow-notary.p8"
          printf '%s' "${KEY_P8_BASE64}" | base64 --decode > "${key}"
          ditto -c -k --norsrc --noextattr --keepParent work "${RUNNER_TEMP}/cloudburrow-notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/cloudburrow-notarize.zip" \
            --key "${key}" --key-id "${KEY_ID}" --issuer "${ISSUER_ID}" \
            --wait --timeout 45m --output-format json > notary.json || true
          cat notary.json
          id="$(jq -r '.id // empty' notary.json)"
          status="$(jq -r '.status // empty' notary.json)"
          if [ "${status}" != "Accepted" ]; then
            if [ -n "${id}" ]; then
              xcrun notarytool log "${id}" --key "${key}" --key-id "${KEY_ID}" --issuer "${ISSUER_ID}" || true
            fi
            echo "::error::notarization ended with status '${status:-none}'"
            exit 1
          fi
          rm -f "${key}"
          # Gatekeeper's own verdict, which needs the ticket to have
          # propagated; the notary service's Accepted above is authoritative.
          for bin in work/*/cloudburrow; do
            ok=""
            for _ in 1 2 3 4 5 6; do
              verdict="$(spctl -a -t exec -vv "${bin}" 2>&1 || true)"
              echo "${verdict}"
              case "${verdict}" in *"source=Notarized Developer ID"*) ok=1; break ;; esac
              sleep 20
            done
            [ -n "${ok}" ] || echo "::warning::spctl did not yet report ${bin} as Notarized Developer ID"
          done

      # Same layout and names as the build job, so the per-archive .sha256,
      # checksums.txt, the attestations and the formula all describe these.
      - name: Re-package the signed archives
        if: steps.secrets.outputs.present == 'true'
        run: |
          set -eu
          for dir in work/*/; do
            name="$(basename "${dir}")"
            rm -f "dist/${name}.tar.gz" "dist/${name}.tar.gz.sha256"
            COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "dist/${name}.tar.gz" -C work "${name}"
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" && cat "${name}.tar.gz.sha256")
          done
          {
            echo "## macOS signing"
            echo
            echo "Both darwin binaries are signed with a Developer ID Application certificate"
            echo "(hardened runtime, secure timestamp) and notarized by Apple."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Same artifact names: publish downloads these in place of the unsigned.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.secrets.outputs.present == 'true'
        with:
          name: cloudburrow-darwin-arm64
          path: dist/*_darwin_arm64.tar.gz*
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.secrets.outputs.present == 'true'
        with:
          name: cloudburrow-darwin-amd64
          path: dist/*_darwin_amd64.tar.gz*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Delete the temporary keychain and key files
        if: always()
        run: |
          keychain="${RUNNER_TEMP}/cloudburrow-signing.keychain-db"
          if [ -f "${keychain}" ]; then
            security delete-keychain "${keychain}" || true
          fi
          rm -f "${RUNNER_TEMP}/cloudburrow-signing.p12" "${RUNNER_TEMP}/cloudburrow-notary.p8" \
            "${RUNNER_TEMP}/cloudburrow-notarize.zip"

  publish:
    name: publish release
    # After sign-macos, so the checksums, attestations and formula below are
    # computed over the signed darwin archives when signing is configured.
    needs: [require-ci-green, build, sign-macos, runtime-image-publish]
    # Only a tag publishes. A manual dispatch builds and uploads artifacts for
    # inspection but never creates a release, so the workflow can be exercised
    # without shipping anything.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One of the two jobs with write access to the repository (promote is the
    # other), and it runs nothing from the source tree beyond the
    # already-built artifacts.
    permissions:
      contents: write
      # Attestations are signed with a short-lived certificate for this
      # workflow's OIDC identity: nothing long-lived to hold or leak.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One file listing every archive, so an installer verifies against a
      # single published list, and the formula is rendered from the same one.
      - name: Combined checksums
        run: (cd dist && sha256sum cloudburrow_*.tar.gz > checksums.txt && cat checksums.txt)

      # A checksum served next to the archive proves only that the two
      # agree. The attestation proves the archive was built by this workflow
      # from this repository: `gh attestation verify` checks it.
      - name: Attest the archives and the checksum list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/cloudburrow_*.tar.gz
            dist/checksums.txt

      - name: Render the Homebrew formula
        run: sh scripts/render-formula.sh "${GITHUB_REF_NAME}" dist/checksums.txt > dist/cloudburrow.rb

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_AI_DIGEST: ${{ needs.runtime-image-publish.outputs.digest }}
          MACOS_SIGNED: ${{ needs.sign-macos.outputs.signed }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Checked in verify already; run again so these notes are exactly
          # the section at this tag.
          RELEASE_NOTES_LINK_BASE="https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}" \
            sh scripts/release-notes.sh "${VERSION}" > section.md
          {
            echo "## CloudBurrow ${VERSION}"
            echo
            cat section.md
            echo
            echo "See [what actually works](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/docs/status.md)"
            echo "before installing — it is explicit about what does not."
            echo
            echo "### Component versions"
            echo
            echo "This build was tested against the versions in \`dependencies.json\`,"
            echo "included in every archive."
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "brew install cloudburrow/tap/cloudburrow"
            echo "# or, verifying the checksum and, when gh is present, the attestation:"
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VERSION}/scripts/install.sh | sh"
            echo '```'
            echo
            echo "### Local AI runtime image"
            echo
            echo "\`${LOCAL_AI_IMAGE}:${VERSION}\` (linux/amd64, linux/arm64), index digest"
            echo "\`${LOCAL_AI_DIGEST}\`. This release's CLI defaults \`--local-ai-image\` to"
            echo "exactly that digest and pulls it once, on the first \`up --local-ai-model\`."
            echo
            echo '```sh'
            echo "gh attestation verify oci://${LOCAL_AI_IMAGE}@${LOCAL_AI_DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "### Verify a download"
            echo
            echo '```sh'
            echo "sha256sum -c checksums.txt --ignore-missing"
            echo "gh attestation verify cloudburrow_${VERSION}_<os>_<arch>.tar.gz --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "### macOS Gatekeeper"
            echo
            if [ "${MACOS_SIGNED}" = true ]; then
              echo "The darwin binaries are signed with a Developer ID certificate and notarized by Apple."
            else
              echo "The darwin binaries in this release are **not** signed or notarized."
            fi
            echo "See [Gatekeeper](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/docs/install.md#gatekeeper)"
            echo "for how to check, and what to do with an unsigned binary."
          } > notes.md

          # A prerelease, so it is not "latest" (what install.sh and the
          # action's `version: latest` install) until smoke has passed on
          # every OS and promote marks it (#680). Not a draft: a draft's
          # assets cannot be downloaded anonymously, and smoke installs them
          # the way a user would.
          gh release create "${VERSION}" \
            --title "CloudBurrow ${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            --prerelease \
            dist/*.tar.gz dist/*.sha256 dist/checksums.txt dist/cloudburrow.rb

  # Install what was just published, the way a user would, on one native
  # runner per published archive: the build matrix's four GOOS/GOARCH pairs
  # (#689). Every other release-path test runs against a stand-in; this is
  # the one that runs against the real release (#603). install.sh picks the
  # archive from uname, so each runner must be native to its platform, and
  # smoke-release.sh checks the installed binary reports that platform.
  # Homebrew is on every one of these images (on Linux under
  # /home/linuxbrew, not on PATH; linux/arm64 is Homebrew's Tier 2).
  # The release is still a prerelease here; its assets download from
  # /releases/download/<tag>/ like any other's, and install.sh is given
  # --version, so nothing resolves "latest".
  smoke:
    name: smoke-install the release (${{ matrix.platform }}, ${{ matrix.os }})
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64, brew: true }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, brew: true }
          - { os: macos-latest, platform: darwin/arm64, brew: true }
          - { os: macos-15-intel, platform: darwin/amd64, brew: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      # gh attestation verify reads the release's attestations.
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer comes from the tag's raw URL, as the notes tell users
      # to fetch it, and must verify both the checksum and the attestation;
      # gh is on every hosted runner and reads the token from GH_TOKEN.
      - name: Install with install.sh, then run version and doctor
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: sh scripts/smoke-release.sh "${GITHUB_REF_NAME}"

      # Homebrew refuses a formula by path (`brew install ./cloudburrow.rb`:
      # "Homebrew requires formulae to be in a tap"; `brew audit [path]` is
      # disabled), so the attached formula goes into a throwaway local tap.
      - name: Homebrew formula - install, brew test, brew audit --strict
        if: matrix.brew
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          set -eu
          if ! command -v brew >/dev/null 2>&1; then
            [ -x /home/linuxbrew/.linuxbrew/bin/brew ] || { echo "the matrix says ${{ matrix.os }} has Homebrew, but it has none" >&2; exit 1; }
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern cloudburrow.rb --dir dist
          brew tap-new --no-git cloudburrow-smoke/local
          cp dist/cloudburrow.rb "$(brew --repository cloudburrow-smoke/local)/Formula/cloudburrow.rb"
          brew install --formula cloudburrow-smoke/local/cloudburrow
          brew test cloudburrow-smoke/local/cloudburrow
          brew audit --strict --formula cloudburrow-smoke/local/cloudburrow

  # The setup-cloudburrow action at this tag, driving the CLI this run just
  # published, as a workflow pinned to the tag with `version: <tag>` would
  # (#679). The self-test is the same one pull requests run against `source`.
  action-selftest:
    name: self-test the action against the release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # The action verifies the release's build attestation with gh.
      attestations: read
      # The cleanup check reads this run's job logs.
      actions: read
    uses: ./.github/workflows/action-selftest.yml
    with:
      version: ${{ github.ref_name }}

  # Only once smoke has passed on every OS in its matrix does the release
  # stop being a prerelease and become "latest" (#680). Until then
  # install.sh without --version, and the action's default `version: latest`,
  # still get the previous release: GitHub's /releases/latest skips
  # prereleases. A failed smoke leaves the release a prerelease; docs/install.md
  # says what to do next.
  promote:
    name: mark the release latest
    needs: [publish, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mark the release a full release, and latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest

  # After smoke and promote, so `brew upgrade` never delivers a release that
  # failed its smoke test or is not yet latest (#680).
  tap:
    name: update the Homebrew tap
    needs: [publish, smoke, promote]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The tap is another repository, so this needs a token that can push to
      # it and to nothing else. Without one the release is still complete;
      # the formula is attached to it for a maintainer to push by hand.
      - name: Push the formula to cloudburrow/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the tap was not updated. cloudburrow.rb is attached to the release."
            exit 0
          fi
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern cloudburrow.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cloudburrow/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp cloudburrow.rb tap/Formula/cloudburrow.rb
          cd tap
          git config user.name "cloudburrow-release"
          git config user.email "cloudburrow-release@users.noreply.github.com"
          git add Formula/cloudburrow.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "cloudburrow ${GITHUB_REF_NAME}"
          git push origin HEAD
