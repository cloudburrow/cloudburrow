# `up --offline` with no egress (#604, #685): TestPrefetchThenUpOfflineWithNoEgress
# prefetches, cuts the kind node's outbound network, and requires `up
# --offline` for the default services plus Bigtable to reach ready with no
# image pulled. It downloads about 2 GiB and takes minutes, so it runs
# nightly and on demand, never on pull requests or merge groups, and cannot
# block a merge. A failure fails the run, and the step summary says which
# test did not pass.
name: Offline

on:
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # No job may reach Google Cloud.
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""

jobs:
  offline:
    name: prefetch, then up --offline with no egress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      # The test's `go build` embeds the Linux storage server (#514).
      - name: Build the embedded storage server
        run: make storage-binaries

      - name: Offline test
        env:
          CLOUDBURROW_TEST_OFFLINE: "1"
        run: |
          set +e
          go test -tags=integration -count=1 -timeout 50m -v \
            -run '^TestPrefetchThenUpOfflineWithNoEgress$' ./cmd/cloudburrow/ | tee offline.log
          rc=${PIPESTATUS[0]}
          set -e
          # go test exits 0 when a test skips, and this one skips without
          # CLOUDBURROW_TEST_OFFLINE, so it must have passed.
          result=$(grep -- '^--- [A-Z]*: TestPrefetchThenUpOfflineWithNoEgress (' offline.log || echo 'no result')
          {
            echo "## Offline"
            echo
            echo "\`$result\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ] || ! grep -q -- '^--- PASS: TestPrefetchThenUpOfflineWithNoEgress (' offline.log; then
            echo "TestPrefetchThenUpOfflineWithNoEgress did not pass: $result"; exit 1
          fi

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp offline.log diagnostics/ 2>/dev/null || true
          kind get clusters > diagnostics/clusters.txt 2>&1 || true
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          # Bounded on purpose: a multi-megabyte dump helps nobody.
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "diagnostics/$c" --name "$c" 2>&1 | tail -50 || true
          done
          find diagnostics -type f -size +1M -delete || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: offline-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Leave no clusters behind
        if: always()
        run: |
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done
