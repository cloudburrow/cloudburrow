name: CI

# Checks that run on every change. This workflow never publishes anything and
# never receives credentials: release permissions are kept in a separate
# workflow so an untrusted pull request cannot reach them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No job may reach Google Cloud. The compatibility harness also refuses these
  # at runtime, but keeping them unset means a mistake cannot cost money.
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""

jobs:
  # Decides whether a pull request touches code the slow suites cover.
  #
  # Those suites used to run on pull requests only when someone added the
  # run-integration label, and the label was only added when someone already
  # suspected a problem. So a change that broke official-SDK object reads merged
  # green and main stayed red for two days (#268). Detection is plain git, not a
  # third-party action: every action here is pinned by SHA, and adding one is a
  # supply-chain decision of its own.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        # The SHAs arrive through the environment, never interpolated into the
        # script, so nothing in a pull request's metadata can be executed.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(go\.(mod|sum)$|internal/|cmd/|test/|testdata/|Makefile$|\.github/workflows/ci\.yml$)'; then
            heavy=true
          else
            heavy=false
          fi
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported Go releases, so the minimum pinned in go.mod is
        # genuinely buildable rather than assumed.
        go: ["1.26", "1.27"]
        os: [ubuntu-latest]
        include:
          - go: "1.27"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: false

      # The same commands a developer runs locally. If these diverge, the
      # documented workflow is wrong.
      - run: make fmt-check
      - run: make vet
      - run: make test-race
      - run: make build

      - name: Verify the binary runs
        run: ./bin/cloudburrow version

  modules:
    name: modules and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # A dirty go.mod/go.sum after tidy means the committed dependency set is
      # not what the code actually needs.
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go mod verify
        run: go mod verify

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  integration:
    name: integration (cluster)
    runs-on: ubuntu-latest
    # Cluster tests are slow and need Docker. They run on main, and on a pull
    # request that touches code they cover (see the changes job) or is labelled
    # run-integration. A docs-only change still skips them.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=v1.36.4
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      - name: Cluster lifecycle tests
        run: go test -tags=integration -timeout 25m ./internal/cluster/...

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          kind get clusters > diagnostics/clusters.txt 2>&1 || true
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          # Bounded on purpose: a multi-megabyte dump helps nobody.
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "diagnostics/$c" --name "$c" 2>&1 | tail -50 || true
          done
          find diagnostics -type f -size +1M -delete || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Leave no clusters behind
        if: always()
        run: |
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done

  compat:
    name: official SDK compatibility
    runs-on: ubuntu-latest
    # Same rule as integration: the suite that caught #268 only after it merged.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      - name: Start an instance and run the compatibility suite
        run: |
          go build -o bin/cloudburrow ./cmd/cloudburrow
          ./bin/cloudburrow up --name ci --state-dir "$RUNNER_TEMP/cb" \
            --port-control 0 --port-storage 0 --port-pubsub 0 \
            --services storage,pubsub,spanner,tasks,secretmanager > up.log 2>&1 &
          echo $! > up.pid

          # Bounded wait: an external cluster's readiness cannot be hurried.
          for i in $(seq 1 600); do
            grep -q 'press Ctrl-C' up.log && break
            sleep 1
          done
          grep -q 'press Ctrl-C' up.log || { echo "instance never became ready"; cat up.log; exit 1; }

          export CLOUDBURROW_TEST_STORAGE=$(grep 'STORAGE_EMULATOR_HOST=' up.log | sed 's/.*=//')
          export CLOUDBURROW_TEST_PUBSUB=$(grep 'PUBSUB_EMULATOR_HOST=' up.log | sed 's/.*=//')
          # Spanner's address comes from `cloudburrow env`, not from up.log, so
          # the Spanner SDK tests run on nothing but what a developer would
          # export (#272). Taken from the same configuration `up` was given.
          CLOUDBURROW_TEST_SPANNER=$(./bin/cloudburrow env --name ci --state-dir "$RUNNER_TEMP/cb" \
            --services storage,pubsub,spanner,tasks,secretmanager --format json | jq -r '.SPANNER_EMULATOR_HOST // empty')
          [ -n "$CLOUDBURROW_TEST_SPANNER" ] || { echo "env did not export SPANNER_EMULATOR_HOST"; exit 1; }
          export CLOUDBURROW_TEST_SPANNER
          # Cloud Tasks and Secret Manager have no emulator variable, so their
          # addresses and the admin API's control port come from up's own
          # summary. Until this instance started them, their SDK tests skipped
          # in CI (#273).
          CLOUDBURROW_TEST_CONTROL=$(sed -n 's|^  control: *http://\([^ ]*\).*|\1|p' up.log)
          CLOUDBURROW_TEST_TASKS=$(awk '$1=="tasks" && $2=="host" {print $3; exit}' up.log)
          CLOUDBURROW_TEST_SECRETS=$(awk '$1=="secretmanager" && $2=="host" {print $3; exit}' up.log)
          for v in CLOUDBURROW_TEST_CONTROL CLOUDBURROW_TEST_TASKS CLOUDBURROW_TEST_SECRETS; do
            [ -n "${!v}" ] || { echo "$v could not be read from up.log"; cat up.log; exit 1; }
          done
          export CLOUDBURROW_TEST_CONTROL CLOUDBURROW_TEST_TASKS CLOUDBURROW_TEST_SECRETS

          # -v, so each test's PASS or SKIP is in the log. Without it go test
          # prints only a package-level "ok", and a skipped test is
          # indistinguishable from one that passed.
          set -o pipefail
          go test -tags=compat -timeout 15m -v ./test/compat/... | tee compat.log
          echo "== compat summary: $(grep -c -- '--- PASS' compat.log) passed, $(grep -c -- '--- SKIP' compat.log) skipped"
          grep -- '--- SKIP' compat.log || true

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          tail -200 up.log > diagnostics/up.log 2>&1 || true
          KC="$RUNNER_TEMP/cb/ci/kubeconfig"
          kubectl --kubeconfig "$KC" -n cloudburrow get pods -o wide > diagnostics/pods.txt 2>&1 || true
          kubectl --kubeconfig "$KC" -n cloudburrow logs -l app=storage --tail=100 > diagnostics/storage.log 2>&1 || true
          kubectl --kubeconfig "$KC" -n cloudburrow logs -l app=pubsub --tail=100 > diagnostics/pubsub.log 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: compat-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          kill "$(cat up.pid)" 2>/dev/null || true
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done

  # A red main has to be visible without someone going to look.
  #
  # Only on pushes to main, never for a pull request, and the only job with
  # issues: write — so an untrusted pull request can never obtain a token that
  # writes to the repository. One tracking issue is reused rather than one per
  # failure, so a broken main is a single thing to watch.
  report-main-failure:
    name: report main failure
    needs: [check, modules, integration, compat]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create main-broken --repo "$REPO" --color b60205 \
            --description "CI is failing on main" 2>/dev/null || true
          n=$(gh issue list --repo "$REPO" --label main-broken --state open --json number --jq '.[0].number // empty')
          body="CI failed on \`main\` at $SHA: $RUN_URL"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "CI is failing on main" --label main-broken \
              --body "$body

          Opened automatically by the CI workflow. It closes itself when main passes again."
          fi

  # And a green main closes that issue, so it never outlives the problem.
  report-main-recovered:
    name: report main recovered
    needs: [check, modules, integration, compat]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$REPO" --label main-broken --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "main is green again at $SHA: $RUN_URL"
          done
