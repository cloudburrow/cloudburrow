name: CI

# Checks that run on every change. This workflow never publishes anything and
# never receives credentials: release permissions are kept in a separate
# workflow so an untrusted pull request cannot reach them.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each batch of PRs as a merge group and runs this
  # workflow on it once; detect changes treats it as heavy, so the compat job
  # runs on every batch. `ci-green` below is the one check the queue requires.
  merge_group:
  workflow_dispatch:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No job may reach Google Cloud. The compatibility harness also refuses these
  # at runtime, but keeping them unset means a mistake cannot cost money.
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""

jobs:
  # Decides whether a pull request touches code the slow suites cover.
  #
  # Those suites used to run on pull requests only when someone added the
  # run-integration label, and the label was only added when someone already
  # suspected a problem. So a change that broke official-SDK object reads merged
  # green and main stayed red for two days (#268). Detection is plain git, not a
  # third-party action: every action here is pinned by SHA, and adding one is a
  # supply-chain decision of its own.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      emulator: ${{ steps.diff.outputs.emulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        # The SHAs arrive through the environment, never interpolated into the
        # script, so nothing in a pull request's metadata can be executed.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "emulator=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request, landing branches included, gets the fast jobs
          # only (#1144): the compatibility shards, the integration suite and
          # their coverage check took 20-27 minutes a landing. They run on
          # every push to main instead, where a failure is reported by
          # "report main failure" without holding up the next landing. The
          # run-integration label still runs them on any pull request.
          echo "pull request: fast jobs only"
          echo "heavy=false" >> "$GITHUB_OUTPUT"
          # The emulator patches' own tests (#1132) run on pushes to main
          # only, never on a pull request.
          echo "emulator=false" >> "$GITHUB_OUTPUT"

  # The patched BigQuery emulator the CLI embeds (#1061), built once per
  # run, for the check and compat jobs (#1087). It is two Go builds of
  # about 200 MB, linux/amd64 and linux/arm64, 8.5 minutes cold on
  # ubuntu-latest, and every check and compat job used to make them. They
  # are cached under a key of everything tools/bqengine reads (its
  # .inputs stamps hold the same hash) and the exact Go version, so a run
  # that changes none of it restores them and bqengine keeps them; a run
  # that changes one builds them from source, here only. The other jobs
  # download them, check each file against the SHA-256 sums this job
  # reports as outputs (so a changed artifact fails the check), and build
  # with BQENGINE_FLAGS=-prebuilt, which fails unless the binaries were
  # built from the sources checked out. Releases do not use this cache:
  # release.yml builds from source (docs/ci.md, "The embedded BigQuery
  # emulator").
  bigquery-emulator:
    name: build the BigQuery emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup-go cache: keyed on the root go.sum, which the emulator's
      # modules are not in, and its 3 GB build cache is not worth saving
      # when the binaries themselves are cached below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: false
          cache: false
      - id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: internal/bigqueryimage/bin/bigquery-emulator-*
          key: bigquery-emulator-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('tools/bqengine/*.go', 'third_party/bigquery-emulator/sources.json', 'third_party/bigquery-emulator/go.mod', 'third_party/bigquery-emulator/go.sum', 'third_party/bigquery-emulator/patches/**') }}
      # Nothing to do after a cache hit: bqengine keeps binaries whose
      # stamps match the sources and the go command.
      - name: Build the emulator (or keep the cached build)
        run: make bigquery-binaries
      - id: sums
        name: Stage the binaries and their SHA-256 sums
        run: |
          mkdir -p "$RUNNER_TEMP/bigquery-emulator"
          cp internal/bigqueryimage/bin/bigquery-emulator-* "$RUNNER_TEMP/bigquery-emulator/"
          cd "$RUNNER_TEMP/bigquery-emulator"
          sha256sum bigquery-emulator-* | tee SHA256SUMS
          echo "sums=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigquery-emulator
          path: ${{ runner.temp }}/bigquery-emulator
          retention-days: 1
          if-no-files-found: error
          # A re-run of this job replaces its own upload.
          overwrite: true

  # The regression tests the patches in third_party/bigquery-emulator/patches
  # carry, each failing without its patch (PROVENANCE.md), and the patched
  # modules' own suites, run in the copies tools/bqengine writes under
  # third_party/bigquery-emulator/build/ (#1132): `go test ./...` in the root
  # module does not reach them. On pushes to main only, never on a pull
  # request (ci-green passes it there as skipped). The Go build cache is
  # restored from the last run's, so a change to one patch recompiles what it touches and
  # not the 3 GB of the engine; go test's own cache then skips the packages
  # whose inputs are unchanged. The same commands as `make bigquery-patch-tests`.
  bigquery-emulator-patches:
    name: BigQuery emulator patch tests
    needs: changes
    if: needs.changes.outputs.emulator == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup-go cache: its key is the root go.sum, which the
      # emulator's modules are not in; the cache below is keyed on theirs.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: false
          cache: false
      - id: go
        run: |
          {
            echo "version=$(go env GOVERSION)"
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.gocache }}
            ${{ steps.go.outputs.gomodcache }}
          key: bigquery-emulator-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('tools/bqengine/*.go', 'third_party/bigquery-emulator/sources.json', 'third_party/bigquery-emulator/go.mod', 'third_party/bigquery-emulator/go.sum', 'third_party/bigquery-emulator/patches/**') }}
          restore-keys: |
            bigquery-emulator-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - name: Run the patched modules' tests
        run: make bigquery-patch-tests

  # Rebuilds third_party/tesseract-wasm/tesseract.wasm from its pinned
  # Tesseract, Leptonica and wasi-sdk releases and fails unless the result
  # matches the committed SHA-256 (#1733): the build is byte-identical on
  # macOS and Linux, arm64 and x86_64, so one hash. About two minutes; not in
  # ci-green, so not a required check.
  tesseract-wasm:
    name: rebuild tesseract.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild and compare
        run: WORK="$RUNNER_TEMP/tesseract-wasm" third_party/tesseract-wasm/build.sh --check

  # Rebuilds third_party/whisper-wasm/whisper.wasm from its pinned
  # whisper.cpp and wasi-sdk releases and fails unless the result matches the
  # committed SHA-256 (#1799). Not in ci-green, so not a required check.
  whisper-wasm:
    name: rebuild whisper.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild and compare
        run: WORK="$RUNNER_TEMP/whisper-wasm" third_party/whisper-wasm/build.sh --check

  # Rebuilds third_party/amr-wasm/amr.wasm from its pinned opencore-amr and
  # wasi-sdk releases and fails unless the result matches the committed
  # SHA-256 (#1799). Not in ci-green, so not a required check.
  amr-wasm:
    name: rebuild amr.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild and compare
        run: WORK="$RUNNER_TEMP/amr-wasm" third_party/amr-wasm/build.sh --check

  # Rebuilds third_party/rnnoise-wasm/rnnoise.wasm from its pinned RNNoise
  # and wasi-sdk releases and fails unless the result matches the committed
  # SHA-256 (#1799). Not in ci-green, so not a required check.
  rnnoise-wasm:
    name: rebuild rnnoise.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild and compare
        run: WORK="$RUNNER_TEMP/rnnoise-wasm" third_party/rnnoise-wasm/build.sh --check

  check:
    name: check (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    # 45 since make build compiled the embedded BigQuery emulator (#1061),
    # 8.5 minutes cold on ubuntu-latest, when the macOS job took 27.5 of 30;
    # it now downloads it (#1087). 60 since main's run 44588485912 (2026-11-19):
    # ubuntu go 1.27 reached minute 45 in make cross, four targets at about 4
    # minutes each after make test-race, and was cancelled before linux/arm64.
    # 75 since main's run 44891736706: macOS took 49 of its 60 minutes in
    # 44875166859, and WASM_TEST_TIMEOUT went from 10m to 20m when the
    # vertexai package outran 10m on a runner 18-27% slower (Makefile).
    timeout-minutes: 75
    # The emulator binaries, from the job above (#1087).
    needs: bigquery-emulator
    env:
      BQENGINE_FLAGS: -prebuilt
    strategy:
      fail-fast: false
      matrix:
        # Both supported Go releases, so the minimum pinned in go.mod is
        # genuinely buildable rather than assumed, and macOS.
        #
        # A merge group runs Linux on Go 1.27 only. Every PR in it already
        # passed the full matrix on its own head, and what a merge can newly
        # break (two PRs that conflict in behaviour) shows up on one platform.
        # The free plan runs 20 jobs at once and macOS 5; a queue building
        # several groups at the full matrix starved its own compat jobs of
        # runners, so each group took 25+ minutes to land. Pushes to main still
        # run everything, so a platform-only break is reported there.
        include: ${{ fromJSON((github.event_name == 'merge_group' || github.event_name == 'pull_request') && '[{"go":"1.27","os":"ubuntu-latest"}]' || '[{"go":"1.26","os":"ubuntu-latest"},{"go":"1.27","os":"ubuntu-latest"},{"go":"1.27","os":"macos-latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: false

      # The same commands a developer runs locally. If these diverge, the
      # documented workflow is wrong.
      - run: make fmt-check
      - run: make vet
      - run: make docs-check
      # ISO/IEC 14496-26's conformance streams and reference decodes (#1754),
      # which TestPSFullConformance and TestFullParametricStereoTrack check
      # the HE-AAC v2 decoder against. They are ISO's copyright and never
      # committed: internal/isoconformance reads them out of ISO's zips by
      # HTTP range requests into the user's cache directory, pinned by
      # SHA-256 and ISO's MD5, only with CLOUDBURROW_TEST_DOWNLOADS set.
      # Cached here under a key of the pins, so ISO's server is asked once;
      # make test-race then finds them cached and runs the tests (without
      # the variable, so nothing else downloads).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/cloudburrow-test/iso-14496-26-ed2
            ~/Library/Caches/cloudburrow-test/iso-14496-26-ed2
          key: iso-14496-26-ed2-${{ hashFiles('internal/isoconformance/isoconformance.go') }}
      - name: Fetch the ISO/IEC 14496-26 conformance files (test data, never committed)
        run: CLOUDBURROW_TEST_DOWNLOADS=1 go test -count=1 -run '^TestPSFullConformance$' ./third_party/aac-go/
      - run: make test-race
      # The emulator binaries the bigquery-emulator job built, each checked
      # against the sums it reported, for make build (#1087).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bigquery-emulator
          path: ${{ runner.temp }}/bigquery-emulator
      - name: Check the emulator binaries and put them in place
        shell: bash
        env:
          SUMS: ${{ needs.bigquery-emulator.outputs.sums }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bigquery-emulator"
          echo "$SUMS  SHA256SUMS" | shasum -a 256 -c -
          shasum -a 256 -c SHA256SUMS
          cp bigquery-emulator-* "$GITHUB_WORKSPACE/internal/bigqueryimage/bin/"
      - run: make build

      - name: Verify the binary runs
        run: ./bin/cloudburrow version

      # For the Python storage suite against the builtin server (#516).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux' && matrix.go == '1.27'
        with:
          python-version: "3.12"

      # The builtin Cloud Storage server (#485) through the official Go
      # client, with no cluster: `cloudburrow storage-server` alone.
      - name: Builtin Cloud Storage compat
        if: runner.os == 'Linux' && matrix.go == '1.27'
        run: |
          # Google's in-memory Pub/Sub fake, for the builtin server's
          # notifications (#506); test infrastructure, never shipped.
          go build -o bin/pubsubfake ./test/tools/pubsubfake
          ./bin/pubsubfake --listen 127.0.0.1:8095 > pubsubfake.log 2>&1 &
          # A throwaway signing key and certificate for the signed URL tests
          # (#509); generated here, never committed.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/sign-key.pem" -out "$RUNNER_TEMP/sign-cert.pem" -days 1 -subj "/CN=signer" 2>/dev/null
          # One origin beyond loopback is allowed, for the allowlist test (#677).
          ./bin/cloudburrow storage-server --listen 127.0.0.1:4443 --host storage.localhost --pubsub-emulator 127.0.0.1:8095 \
            --cors-allow-origin https://app.test:8443 \
            --signing-cert "signer@cloudburrow-ci.iam.gserviceaccount.com=$RUNNER_TEMP/sign-cert.pem" > storage-server.log 2>&1 &
          for _ in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:4443/storage/v1/b?project=p && break; sleep 0.2; done
          set -o pipefail
          CLOUDBURROW_TEST_STORAGE=http://127.0.0.1:4443 CLOUDBURROW_TEST_PUBSUB=127.0.0.1:8095 CLOUDBURROW_TEST_CORS_ORIGIN=https://app.test:8443 \
            CLOUDBURROW_TEST_SIGNING_KEY="$RUNNER_TEMP/sign-key.pem" CLOUDBURROW_TEST_SIGNING_EMAIL=signer@cloudburrow-ci.iam.gserviceaccount.com \
            go test -tags=compat -count=1 -v -run '^(TestStorage(BucketLifecycle|BucketsList|BucketPatchKeepsOmittedFields|BucketMetagenerationPreconditions|NonEmptyBucketDelete|ObjectRoundTrip|Checksums|GenerationPreconditions|ListWithPrefix|ResumableUploadAndRangedRead|Compose|Copy|VersioningKeepsNoncurrent|VersioningDeleteKeepsNoncurrent|VersioningDisableKeepsExisting|DoesNotExistWithOnlyNoncurrent|SoftDeleteAndRestore|RestoreNotSoftDeleted412|RestoreWithoutPolicy412|BucketDeleteIgnoresSoftDeleted|RetentionBlocksDelete|LockRetentionPolicy|HoldsBlockDelete|ObjectRetentionRequiresEnabledBucket|LifecycleConfigRoundTrip|LifecycleUnknownCondition400|CORSRoundTrip|XMLPreflightMatches|XMLPreflightMismatch200NoHeaders|JSONAlwaysAllowsCORS|CORSRefusesForeignOrigin|CORSLoopbackOriginWorks|CORSAllowlistedOriginWorks|BucketLabelsAndStorageClassRoundTrip|BucketFieldsNeverSilentlyDropped|BucketIAMRoundTrip|BucketIAMStaleEtag|BucketIAMConditions|ManagedFolderLifecycle|ManagedFolderIAM|BucketACL|ObjectACL|PredefinedACL|ACLUniformAccess|ACLMethods|HMACKeyLifecycle|HMACKeyLimit|XMLPutGetDelete|XMLListBucket|XMLResumable201And204|XMLErrorCodes|XMLHostStyle|XMLMultipartAbort204|XMLMultipartListParts|XMLMultipartPreconditionRefused|SignedURLV4HMAC|SignedURLV2RegisteredCert|XMLBucketPutAndServiceGet|XMLFormPostPolicyV4|BulkRestore|OperationsListFilter|GRPCBuckets|GRPCObjects|GRPCComposeDeletesSources|GRPCACLs)|TestBucketUpdateChangesMetadata|TestMultipartUploadStoresMetadataWithContent|TestObjectMetadataUpdate|TestResumableUploadCompletes|TestObjectCopyAndRewrite|TestObjectUploadDeliversANotification|TestNotificationFiltersAreHonoured|TestNotificationConfigsCRUDThroughTheSDK|TestUnconfiguredBucketStillUploads|TestNotificationArchiveOnVersionedOverwrite|TestNotificationDeleteAndMetadataUpdate|TestStorageObjectChangeChannels|TestStorageObjectChangeChannelSelection|TestStorageViewFullContext)$' ./test/compat/ | tee builtin-storage.log
          for t in TestStorageBucketLifecycle TestStorageBucketsList TestStorageBucketPatchKeepsOmittedFields TestStorageBucketMetagenerationPreconditions TestStorageNonEmptyBucketDelete TestStorageObjectRoundTrip TestStorageChecksums TestMultipartUploadStoresMetadataWithContent TestStorageGenerationPreconditions TestObjectMetadataUpdate TestStorageListWithPrefix TestStorageResumableUploadAndRangedRead TestResumableUploadCompletes TestStorageCompose TestStorageCopy TestObjectCopyAndRewrite TestStorageVersioningKeepsNoncurrent TestStorageVersioningDeleteKeepsNoncurrent TestStorageVersioningDisableKeepsExisting TestStorageDoesNotExistWithOnlyNoncurrent TestStorageSoftDeleteAndRestore TestStorageRestoreNotSoftDeleted412 TestStorageRestoreWithoutPolicy412 TestStorageBucketDeleteIgnoresSoftDeleted TestStorageRetentionBlocksDelete TestStorageLockRetentionPolicy TestStorageHoldsBlockDelete TestStorageObjectRetentionRequiresEnabledBucket TestStorageLifecycleConfigRoundTrip TestStorageLifecycleUnknownCondition400 TestStorageCORSRoundTrip TestStorageXMLPreflightMatches TestStorageXMLPreflightMismatch200NoHeaders TestStorageJSONAlwaysAllowsCORS TestStorageCORSRefusesForeignOrigin TestStorageCORSLoopbackOriginWorks TestStorageCORSAllowlistedOriginWorks TestStorageBucketLabelsAndStorageClassRoundTrip TestStorageBucketFieldsNeverSilentlyDropped TestBucketUpdateChangesMetadata TestStorageBucketIAMRoundTrip TestStorageBucketIAMStaleEtag TestStorageBucketIAMConditions TestStorageManagedFolderLifecycle TestStorageManagedFolderIAM TestStorageBucketACL TestStorageObjectACL TestStoragePredefinedACL TestStorageACLUniformAccess TestStorageACLMethods TestStorageHMACKeyLifecycle TestStorageHMACKeyLimit TestObjectUploadDeliversANotification TestNotificationFiltersAreHonoured TestNotificationConfigsCRUDThroughTheSDK TestUnconfiguredBucketStillUploads TestNotificationArchiveOnVersionedOverwrite TestNotificationDeleteAndMetadataUpdate TestStorageXMLPutGetDelete TestStorageXMLListBucket TestStorageXMLResumable201And204 TestStorageXMLErrorCodes TestStorageXMLHostStyle TestStorageXMLMultipartAbort204 TestStorageXMLMultipartListParts TestStorageXMLMultipartPreconditionRefused TestStorageSignedURLV4HMAC TestStorageSignedURLV2RegisteredCert TestStorageXMLBucketPutAndServiceGet TestStorageXMLFormPostPolicyV4 TestStorageBulkRestore TestStorageOperationsListFilter TestStorageObjectChangeChannels TestStorageObjectChangeChannelSelection TestStorageViewFullContext TestStorageGRPCBuckets TestStorageGRPCObjects TestStorageGRPCComposeDeletesSources TestStorageGRPCACLs; do
            grep -q -- "--- PASS: $t " builtin-storage.log || { echo "$t did not pass against the builtin server"; cat storage-server.log; exit 1; }
          done

          # The official Python client against the same server (#516). No
          # instance means no `cloudburrow env`: env.json stands in for it, in
          # its format, with a fixture service account made from the throwaway
          # key, so the suite's credentials guard holds as it does on an
          # instance.
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          t = sys.argv[1]
          sa = {"type": "service_account", "project_id": "cloudburrow-ci", "private_key_id": "fixture",
                "private_key": open(t + "/sign-key.pem").read(), "client_id": "1",
                "client_email": "signer@cloudburrow-ci.iam.gserviceaccount.com", "token_uri": "http://127.0.0.1:1/token"}
          json.dump(sa, open(t + "/fixture-sa.json", "w"))
          json.dump({"STORAGE_EMULATOR_HOST": "http://127.0.0.1:4443", "GOOGLE_CLOUD_PROJECT": "cloudburrow-ci",
                     "GOOGLE_APPLICATION_CREDENTIALS": t + "/fixture-sa.json"}, open(t + "/env.json", "w"))
          PY
          CLOUDBURROW_ENV_JSON="$RUNNER_TEMP/env.json" \
            CLOUDBURROW_TEST_SIGNING_KEY="$RUNNER_TEMP/sign-key.pem" CLOUDBURROW_TEST_SIGNING_EMAIL=signer@cloudburrow-ci.iam.gserviceaccount.com \
            make compat-python COMPAT_PY_TESTS=test/compat-python/test_storage.py | tee builtin-python.log
          for t in test_bucket_and_object_crud_with_a_resumable_upload test_resumable_upload_resumes_after_interruption test_media_link_uses_emulator_host test_if_generation_match_zero test_batch_deletes_and_patches test_transfer_manager_xml_multipart_upload test_generate_signed_url_v4; do
            grep -q "::$t PASSED" builtin-python.log || { echo "$t did not pass against the builtin server"; cat storage-server.log; exit 1; }
          done

          # Versioning across a restart of a persistent builtin server (#498):
          # the probe writes a noncurrent and a live version, the server is
          # stopped and started on the same --data-dir, and the probe reads
          # both back.
          persist() {
            ./bin/cloudburrow storage-server --listen 127.0.0.1:4444 --data-dir "$RUNNER_TEMP/gcs-data" --mode "${1:-persistent}" >> storage-persist.log 2>&1 &
            PERSIST=$!
            for _ in $(seq 1 50); do curl -s -o /dev/null 'http://127.0.0.1:4444/storage/v1/b?project=p' && break; sleep 0.2; done
          }
          probe() {
            CLOUDBURROW_TEST_STORAGE=http://127.0.0.1:4444 \
              CLOUDBURROW_TEST_STORAGE_VERSIONING_PROBE="$1:$RUNNER_TEMP/versioning-probe.json" \
              CLOUDBURROW_TEST_STORAGE_RESTART_PROBE="$2:$RUNNER_TEMP/restart-probe.json" \
              go test -tags=compat -count=1 -v -run '^(TestStorageVersioningPersistentMode|TestStorageAcrossRestart)$' ./test/compat/ | tee -a versioning-restart.log
          }
          persist; probe setup setup
          kill "$PERSIST"; wait "$PERSIST" || true
          persist; probe check present
          kill "$PERSIST"; wait "$PERSIST" || true
          # Ephemeral mode on the same directory starts with nothing (#512).
          persist ephemeral; probe "" absent
          kill "$PERSIST"
          grep -c -- '--- PASS: TestStorageVersioningPersistentMode' versioning-restart.log | grep -qx 2 ||
            { echo "the versioning restart probe did not pass before and after the restart"; cat storage-persist.log; exit 1; }
          grep -c -- '--- PASS: TestStorageAcrossRestart' versioning-restart.log | grep -qx 3 ||
            { echo "TestStorageAcrossRestart did not pass at setup, after a persistent restart and after an ephemeral one"; cat storage-persist.log; exit 1; }

      # The installer is run by people who have not read it, piped into sh.
      # shellcheck ships on the Ubuntu runners; the scripts' behaviour,
      # including refusing a corrupted download, is tested on both OSes by
      # test/install as part of test-race.
      # The generated API coverage must match the proto surface, the
      # registry and the compat tests' annotations (#288).
      - name: API coverage is current
        if: runner.os == 'Linux' && matrix.go == '1.27'
        run: go run ./tools/coverage -check

      - name: shellcheck the release scripts
        if: runner.os == 'Linux'
        run: |
          # scripts/compat-env.sh, compat-shards.sh, verify-local.sh, localai-models.sh,
          # oci-tools.sh and bigquery-engine-soak.sh are bash, and checked as bash below.
          find scripts -maxdepth 1 -name '*.sh' ! -name compat-env.sh ! -name compat-shards.sh ! -name verify-local.sh ! -name bigquery-engine-soak.sh ! -name endpoint-inventory.sh ! -name localai-models.sh ! -name oci-tools.sh -exec shellcheck -s sh {} +
          # Bash helpers the workflows source (#675), and the compat
          # environment generator (#711), checked as bash.
          shellcheck -s bash .github/scripts/*.sh scripts/compat-env.sh
          # The BigQuery engine soak that reproduces #989, the localai shard's model fetch (#1985) and
          # the iam shard's registry clients (#2111), as bash.
          shellcheck -s bash scripts/bigquery-engine-soak.sh scripts/localai-models.sh scripts/oci-tools.sh
          # The endpoint inventory of the pinned tools (#1975), as bash.
          shellcheck -s bash scripts/endpoint-inventory.sh
          # The compat job's shards and their local run (#705), as bash.
          shellcheck -x -s bash scripts/compat-shards.sh scripts/verify-local.sh

  # The four release targets, which make build (host only) does not compile;
  # release.yml is otherwise the first to build them (#713). Its own job, one
  # target a row, since PR #1987's check job reached its 60 minutes in make
  # cross after make test-race (2026-11-20), as main's run 44588485912 had at
  # 45: four targets one after another took about 16 minutes of it.
  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: bigquery-emulator
    strategy:
      fail-fast: false
      matrix:
        target: [darwin/amd64, darwin/arm64, linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: false
      # The emulator binaries the embedded image holds, checked as the check
      # job checks them (#1087).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bigquery-emulator
          path: ${{ runner.temp }}/bigquery-emulator
      - name: Check the emulator binaries and put them in place
        shell: bash
        env:
          SUMS: ${{ needs.bigquery-emulator.outputs.sums }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bigquery-emulator"
          echo "$SUMS  SHA256SUMS" | shasum -a 256 -c -
          shasum -a 256 -c SHA256SUMS
          cp bigquery-emulator-* "$GITHUB_WORKSPACE/internal/bigqueryimage/bin/"
      - name: Cross-compile ${{ matrix.target }}
        run: make cross CROSS_TARGETS=${{ matrix.target }}

  modules:
    name: modules and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # A dirty go.mod/go.sum after tidy means the committed dependency set is
      # not what the code actually needs. Every separate module is tidied too:
      # the fakekms oracle module replaces the root module, so a root bump must
      # re-tidy it (#1181), and the testdata fixtures (the acceptance worker,
      # the Functions Framework source, the SubmitBuild source of #1268) are built only by workflows a pull
      # request does not run. third_party is bqengine's and is left alone.
      - name: go mod tidy leaves no diff
        run: |
          MODULES=(. test/oracle/fakekms testdata/worker testdata/function testdata/sourcebuild)
          files=()
          for m in "${MODULES[@]}"; do
            (cd "$m" && go mod tidy && go mod verify)
            files+=("$m/go.mod" "$m/go.sum")
          done
          # A go.mod outside third_party that this list does not name fails
          # here, so a new module cannot escape the check.
          found=$(git ls-files '*go.mod' ':!:third_party/**' | xargs -n1 dirname | sort)
          listed=$(printf '%s\n' "${MODULES[@]}" | sort)
          [ "$found" = "$listed" ] || { echo "go modules not in MODULES:"; comm -23 <(echo "$found") <(echo "$listed"); exit 1; }
          git diff --exit-code -- "${files[@]}"

      - name: go mod verify
        run: go mod verify

      - name: govulncheck
        run: |
          # Pinned: dependencies.json toolchain.govulncheck (#695).
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  integration:
    name: integration (cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cluster tests are slow and need Docker. They run on main, and on a pull
    # request that touches code they cover (see the changes job) or is labelled
    # run-integration. A docs-only change still skips them.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=v1.36.4
          curl --retry 5 --retry-all-errors -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
          version: v0.33.0

      - name: Cluster lifecycle tests
        run: go test -tags=integration -timeout 25m ./internal/cluster/...

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          kind get clusters > diagnostics/clusters.txt 2>&1 || true
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          # Bounded on purpose: a multi-megabyte dump helps nobody.
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "diagnostics/$c" --name "$c" 2>&1 | tail -50 || true
          done
          find diagnostics -type f -size +1M -delete || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: integration-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Leave no clusters behind
        if: always()
        run: |
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done

  # The compatibility suite runs as seven shards and an acceptance shard,
  # each an instance with only its services and only their CLOUDBURROW_TEST_*
  # variables exported (#565). What each shard starts and runs is in
  # scripts/compat-shards.sh, sourced here and by scripts/verify-local.sh,
  # which runs this flow on a developer's machine (#705). Wall time is the
  # slowest shard, not the sum: one instance with all sixteen services was
  # 25 minutes, 18 of them the suite. The acceptance shard (#596) needs
  # Knative, which only run has, and run is already the slowest shard; on an
  # instance of their own they add a runner, not wall time.
  # The instance-level tests (console, metadata, credentials, admin) run in
  # every shard, since every shard has them; compat-coverage below checks
  # that each test ran in at least one.
  compat:
    name: official SDK compatibility (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Well above its usual run; a wedged job fails here instead of at GitHub's 6-hour default (#715).
    # The localai shard (#1985) builds the LiteRT-LM image from source when
    # its cache misses, a Bazel build of tens of minutes on the runner's four
    # vCPUs, before a suite of up to 120 minutes (COMPAT_TIMEOUT). The
    # storage shard's 105: its job took 78 minutes in main run 45126544176
    # with the browser suite cut off at 20 of them, and that suite's
    # timeout is now 30m (below).
    timeout-minutes: ${{ (matrix.shard == 'localai' || matrix.shard == 'localaispeech') && 180 || matrix.shard == 'storage' && 105 || 90 }}
    # Same rule as integration: the suite that caught #268 only after it merged.
    needs: [changes, bigquery-emulator]
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    strategy:
      fail-fast: false
      matrix:
        shard: [storage, served, gke, run, crossservice, scale, emulators, memorystore, sql, sqlreplicas, acceptance, iam, localai, localaispeech]
    env:
      SHARD: ${{ matrix.shard }}
      # Every make build here uses the emulator binaries the
      # bigquery-emulator job built (#1087).
      BQENGINE_FLAGS: -prebuilt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # The served shard's Kubernetes Engine API (#1913) makes kind clusters
      # beside the instance's, each node a container of the pinned node
      # image, and refuses a cluster or node below 20 GiB free
      # (CLOUDBURROW_GKE_MIN_FREE_GB). The runner image leaves too little
      # beside the instance to be sure of that, so the toolchains no step
      # of this job uses go first, and the job fails here, naming it, rather
      # than in a test as RESOURCE_EXHAUSTED.
      # The gke shard runs the served shard's Kubernetes Engine tests on
      # its instance again (scripts/compat-shards.sh, COMPAT_GKE_TESTS).
      # The localai shard (#1985) needs the room too: the LiteRT-LM image
      # and its build, the 2.6 GB generation model and the instance's 1.3 GB
      # of embedding, speech, OCR and vision models, each held twice while
      # its cache is packed or unpacked.
      - name: Free disk for the Kubernetes Engine API's clusters
        if: matrix.shard == 'served' || matrix.shard == 'gke' || matrix.shard == 'localai' || matrix.shard == 'localaispeech'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
          free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          [ "$free" -ge 30 ] || { echo "only $free GiB free: the Kubernetes Engine tests need 20 GiB beside the instance"; exit 1; }
          # Every node container's systemd, containerd and kubelet take
          # inotify instances from root's one per-host allowance, 128 on the
          # runner image: with the clusters' nodes beside the instance's, a
          # joining node's kubelet never answered its health check (main run
          # 44645694075, a pool's second and third nodes). kind's known issues give
          # these values for many nodes on one host.
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches
          sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288

      - name: Install kubectl
        run: |
          curl --retry 5 --retry-all-errors -fsSLo kubectl "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      # The Google Cloud CLI the gcloud, gsutil and bq tests run (#694, #696),
      # pinned rather than whatever the runner image carries, in the shards
      # that export a service those tests use: bq's is BigQuery, in the
      # emulators shard, and gcloud sql's, in the sql shard. The versioned release archive,
      # checked against its pinned SHA-256 before it is unpacked, and never
      # given credentials. 88 MB and a few seconds to unpack, so it is not
      # cached: restoring the unpacked 460 MB would take longer. The iam
      # shard has it for TestIAMEnforcementArtifactRegistryOCIClients'
      # `gcloud auth print-access-token`, docker-credential-gcloud and
      # `gcloud artifacts attachments`, and the allUsers binding
      # TestIAMEnforcementArtifactRegistryDocker adds (#2111). 593.0.0
      # since 586.0.0 had no `gcloud alpha source-manager hooks`, which
      # TestGcloudSourceManagerHooks drives (#1927; main run 44645694075).
      - name: Install the Google Cloud CLI
        if: matrix.shard == 'storage' || matrix.shard == 'served' || matrix.shard == 'gke' || matrix.shard == 'run' || matrix.shard == 'crossservice' || matrix.shard == 'scale' || matrix.shard == 'emulators' || matrix.shard == 'memorystore' || matrix.shard == 'sql' || matrix.shard == 'sqlreplicas' || matrix.shard == 'iam'
        run: |
          curl --retry 5 --retry-all-errors -fsSLo "$RUNNER_TEMP/gcloud.tar.gz" https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-593.0.0-linux-x86_64.tar.gz
          echo "42c32b7553c712f71fcf6f124546c0519437f53755f47f9bd0c957998cd6b826  $RUNNER_TEMP/gcloud.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gcloud.tar.gz" -C "$RUNNER_TEMP" && rm "$RUNNER_TEMP/gcloud.tar.gz"
          # The beta commands (gcloud beta run domain-mappings, #1349) and the
          # alpha one (gcloud alpha builds approve --location, #1362) need
          # their components, installed here, at the release pinned above,
          # rather than offered from dl.google.com mid-test.
          "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" components install alpha beta --quiet
          # No update check: it would reach Google from every fresh
          # configuration the tests create, and the egress guard fails that.
          printf '[component_manager]\ndisable_update_check = true\n' >> "$RUNNER_TEMP/google-cloud-sdk/properties"
          echo "$RUNNER_TEMP/google-cloud-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" version

      # The real registry clients TestIAMEnforcementArtifactRegistryOCIClients
      # runs in the iam shard (#2111): oras 1.2.3, cosign 2.4.3 and crane
      # 0.20.3 (Apache-2.0, each project's linux release binary, checked
      # against the SHA-256 its release's checksums file publishes, which
      # dependencies.json's realTools records) in CB_OCI_TOOLS, and the
      # docker:27.5.1-dind image pulled by its digest, CB_OCI_CLIENT_IMAGE.
      # Nothing signs in to a registry; the clients run on an internal
      # Docker network whose one route is the instance.
      - name: Fetch the OCI registry clients
        if: matrix.shard == 'iam'
        run: scripts/oci-tools.sh "$RUNNER_TEMP/oci-tools" | tee -a "$GITHUB_ENV"

      # Google's Cloud SQL Auth Proxy binary for TestCloudSQLAuthProxyBinary
      # (#1421), in the shard that runs the Cloud SQL suite, sql (#1472): `make
      # cloud-sql-proxy` downloads the pinned release and checks it against
      # its SHA-256 before making it executable. The connector listens at
      # the default 3307 there, the one port the proxy dials.
      - name: Install the Cloud SQL Auth Proxy
        if: matrix.shard == 'sql'
        run: |
          echo "CLOUDBURROW_TEST_CLOUD_SQL_PROXY=$(make -s cloud-sql-proxy)" >> "$GITHUB_ENV"

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
          version: v0.33.0

      # For the Python SDK suite (#287). 3.12, the version the lock resolves.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.shard == 'storage'
        with:
          python-version: "3.12"

      # For the Node.js client suite (#589), in the shards that serve its
      # services: an exact version, no dependency cache, and `make
      # compat-node` installs from the committed lock with `npm ci
      # --ignore-scripts`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.shard == 'storage' || matrix.shard == 'emulators'
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      # For the Terraform compat tests (#283). The wrapper is off so the test
      # sees terraform's own exit status and output. At least 1.16.5 (#1620):
      # 1.16.4 could crash saving a failed create's tainted object, with
      # "status ObjectStatus(0), which cannot be saved in state".
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      # OpenTofu for the `cloudburrow terraform --binary tofu` tests (#719),
      # in the shard that runs the Terraform wrapper tests: the release
      # tarball, checked against its pinned SHA-256 before it is unpacked.
      - name: Install OpenTofu
        if: matrix.shard == 'storage'
        run: |
          curl --retry 5 --retry-all-errors -fsSLo "$RUNNER_TEMP/tofu.tar.gz" https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.tar.gz
          echo "50a6106fa4de523d09c87af85f3db1dd47535fc005727fdca6852146476b88ec  $RUNNER_TEMP/tofu.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/tofu.tar.gz" -C /usr/local/bin tofu
          tofu version

      # The emulator binaries the bigquery-emulator job built, each checked
      # against the sums it reported, for make build (#1087).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bigquery-emulator
          path: ${{ runner.temp }}/bigquery-emulator
      - name: Check the emulator binaries and put them in place
        shell: bash
        env:
          SUMS: ${{ needs.bigquery-emulator.outputs.sums }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bigquery-emulator"
          echo "$SUMS  SHA256SUMS" | shasum -a 256 -c -
          shasum -a 256 -c SHA256SUMS
          cp bigquery-emulator-* "$GITHUB_WORKSPACE/internal/bigqueryimage/bin/"

      # Artifact Registry's vulnerability scanning (#1912) in the run shard,
      # so TestArtifactRegistryVulnerabilityScanning and
      # TestGcloudArtifactsVulnerabilityScanning scan instead of skipping
      # (#1917): the pinned OSV-Scanner and the Alpine snapshot, and the Go,
      # Maven, PyPI and npm snapshots, without which the offline scanner
      # refuses an image of language packages, so
      # TestArtifactRegistryLanguagePackageLicenses and its page's test scan
      # too (#2072) (about 350 MB together), in the instance's prefetch cache, from this cache, keyed by the pins,
      # or else the latest release's mirror, then upstream, each file checked
      # against its pinned SHA-256 (tools/osvmirror fetch). Saved as soon as
      # it is fetched, so a failing suite still keeps it. With
      # CLOUDBURROW_TEST_OSV_REQUIRED the tests fail rather than skip when
      # the scanner is missing.
      # ISO/IEC 14496-26's conformance stream and reference decode for the
      # localai shard's
      # TestEmbedContentEmbedsAFullParametricStereoTrackThroughThePredictionClient,
      # which skips when they are not cached: the check job's cache, under
      # the same key, so ISO's server is asked only on a miss, as there.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.shard == 'localai'
        with:
          path: ~/.cache/cloudburrow-test/iso-14496-26-ed2
          key: iso-14496-26-ed2-${{ hashFiles('internal/isoconformance/isoconformance.go') }}
      - name: Fetch the ISO/IEC 14496-26 conformance files (test data, never committed)
        if: matrix.shard == 'localai'
        run: CLOUDBURROW_TEST_DOWNLOADS=1 go test -count=1 -run '^TestPSFullConformance$' ./third_party/aac-go/

      - name: Restore the vulnerability scanner
        id: osv-cache
        if: matrix.shard == 'run'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cb/cache/osv-scanner
          key: osv-scanner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/osvscan/pins.go') }}
      - name: Prefetch the vulnerability scanner
        if: matrix.shard == 'run'
        run: |
          go run ./tools/osvmirror fetch -dir "$RUNNER_TEMP/cb/cache" -ecosystems Alpine,Go,Maven,PyPI,npm
          echo "CLOUDBURROW_TEST_OSV_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Save the vulnerability scanner
        if: matrix.shard == 'run' && steps.osv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cb/cache/osv-scanner
          key: osv-scanner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/osvscan/pins.go') }}

      # The local AI runtime for the localai and localaispeech shards (#1985),
      # saved by localai alone, so the two never race to save one key. The LiteRT-LM
      # image is built as `make litert-lm` builds it, from deploy/litert-lm
      # (Google's source at the pinned commit, a Bazel build), and cached as
      # a saved image keyed by that directory, so it is built again only when
      # its inputs change; saved as soon as it is built, so a failing suite
      # still keeps it.
      - name: Restore the LiteRT-LM image
        id: litert-cache
        if: (matrix.shard == 'localai' || matrix.shard == 'localaispeech')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/litert-lm.tar
          key: litert-lm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/litert-lm/**') }}
      - name: Build or load the LiteRT-LM image
        if: (matrix.shard == 'localai' || matrix.shard == 'localaispeech')
        env:
          HIT: ${{ steps.litert-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            docker load -i "$RUNNER_TEMP/litert-lm.tar"
          else
            start=$(date +%s)
            make litert-lm
            echo "== make litert-lm took $(( $(date +%s) - start )) s"
            docker save -o "$RUNNER_TEMP/litert-lm.tar" cloudburrow/litert-lm:local
          fi
          docker image ls cloudburrow/litert-lm:local
          df -h /
      - name: Save the LiteRT-LM image
        if: matrix.shard == 'localai' && steps.litert-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/litert-lm.tar
          key: litert-lm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/litert-lm/**') }}
      # The pinned generation model and ONNX Runtime's library
      # (dependencies.json's localai.generationModel and onnxRuntime),
      # fetched by scripts/localai-models.sh, which checks each file's size
      # and SHA-256 (the model is public and ungated: no Hugging Face
      # sign-in), cached keyed by those pins alone. The instance's own
      # models (EmbeddingGemma and EmbeddingGemma 2's community ONNX
      # conversions, whisper.cpp's, Tesseract's and MediaPipe's), which it
      # fetches into its state directory and verifies by the pins in
      # internal/localai, are cached keyed by those files, and saved after
      # the suite whatever its result.
      - name: Key the local AI model caches
        id: localai-keys
        if: (matrix.shard == 'localai' || matrix.shard == 'localaispeech')
        run: |
          echo "models=localai-models-$(jq -c '.components.localai | [.generationModel.repo, .generationModel.artifact, .generationModel.revision, .generationModel.sha256, .onnxRuntime.artifacts]' dependencies.json | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the generation model
        id: localai-models
        if: (matrix.shard == 'localai' || matrix.shard == 'localaispeech')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/localai
          key: ${{ steps.localai-keys.outputs.models }}
      - name: Fetch and check the generation model and ONNX Runtime
        if: (matrix.shard == 'localai' || matrix.shard == 'localaispeech')
        run: scripts/localai-models.sh "$RUNNER_TEMP/localai" | tee -a "$GITHUB_ENV"
      - name: Save the generation model
        if: matrix.shard == 'localai' && steps.localai-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/localai
          key: ${{ steps.localai-models.outputs.cache-primary-key }}
      - name: Restore the instance's local AI models
        id: instance-models
        if: (matrix.shard == 'localai' || matrix.shard == 'localaispeech')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cb/models
          key: localai-instance-models-${{ hashFiles('internal/localai/*.go', '!internal/localai/*_test.go') }}

      - name: Start an instance and run the compatibility suite
        run: |
          # make build, not go build: the CLI embeds the Linux storage server
          # binaries that `up` builds the storage image from (#514). The
          # localai shard's is the -tags onnx build (#1985), which loads
          # ONNX Runtime from ONNXRUNTIME_LIB, fetched above.
          if [ "$SHARD" = localai ] || [ "$SHARD" = localaispeech ]; then
            make build-onnx
            cp bin/cloudburrow-onnx bin/cloudburrow
          else
            make build
          fi
          # The shard's services, fixtures, compat-env.sh variables and restart
          # probes, from the file scripts/verify-local.sh reads too (#705).
          # shellcheck source=scripts/compat-shards.sh
          . scripts/compat-shards.sh
          compat_shard "$SHARD"
          # One set of flags for every command, so up, wait, env, status and
          # stop all name the same instance. Control, Storage and Pub/Sub are
          # OS-assigned on purpose: a fixed port hid the #269 regression.
          CB=(--name ci --state-dir "$RUNNER_TEMP/cb" "${FIXTURES[@]}"
            --port-control 0 --port-storage 0 --port-pubsub 0 --port-run 0 --port-memorystore 0 --port-cloudsql-mysql 0 --port-cloudsql 0
            --services "$SERVICES" ${UP_FLAGS[@]+"${UP_FLAGS[@]}"})
          RUNTIME="$RUNNER_TEMP/cb/ci/up.json"

          # up --detach returns only once /readyz is 200, and exits non-zero
          # with the log's tail otherwise (#278). Bounded: an external
          # cluster's readiness cannot be hurried.
          ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}"
          # A second detach is a no-op against the running instance.
          PID=$(jq -r .pid "$RUNTIME")
          ./bin/cloudburrow up --detach "${CB[@]}" | tee detach2.log
          grep -q 'already running' detach2.log && [ "$(jq -r .pid "$RUNTIME")" = "$PID" ] ||
            { echo "a second up --detach did not leave the running instance alone"; exit 1; }
          ./bin/cloudburrow wait --timeout 1m "${CB[@]}"
          UPLOG="$RUNNER_TEMP/cb/ci/up.log"
          if [ "$SHARD" = storage ]; then
            # The seed file was applied before the instance reported ready (#286).
            seeded=$(grep -n 'seeded .* from .*seed.json' "$UPLOG" | head -1 | cut -d: -f1)
            # `wait` can return a moment before `up` has written its banner.
            for _ in $(seq 1 30); do grep -q 'press Ctrl-C to stop' "$UPLOG" && break; sleep 1; done
            ready=$(grep -n 'press Ctrl-C to stop' "$UPLOG" | head -1 | cut -d: -f1)
            [ -n "$seeded" ] && [ -n "$ready" ] && [ "$seeded" -lt "$ready" ] ||
              { echo "the seed file was not applied before the ready line"; grep -n 'seed\|Ctrl-C' "$UPLOG"; exit 1; }
          fi
          if [ "$SHARD" = emulators ]; then
            # `status`, a separate process, must name the BigQuery endpoint (#277).
            ./bin/cloudburrow status "${CB[@]}" | tee status.log
            grep -q '^  bigquery  *127.0.0.1:9014' status.log || { echo "status does not show the BigQuery endpoint"; exit 1; }
          fi

          # Every SDK endpoint comes from `cloudburrow env`: what a developer
          # would export, including the OS-assigned ports, which env reads
          # from the running instance (#272, #278).
          ./bin/cloudburrow env "${CB[@]}" --format json > env.json
          # The CLOUDBURROW_TEST_* variables come from scripts/compat-env.sh,
          # the one a developer runs (#711), so the mapping from an instance
          # to them is written down once; it names each variable's source.
          # TEST_VARS, from compat_shard above: what every instance has (the
          # ADC fixture, the instance's own kubeconfig and kind cluster, the
          # admin API, the metadata server, the console, the admin token, and
          # the CLI and the flags naming this instance) and the shard's
          # services, plus the pinned gcloud installed above in the shards
          # that have it, so its tests fail rather than skip without it (#694, #696).
          # --strict: every variable named must be non-empty, and none a
          # port of 0, which would mean env fell back to configuration; the
          # script names the first that is not, with env.json and the
          # runtime file. An assignment, not eval "$(...)", so a failure
          # fails the step.
          COMPAT_ENV=$(scripts/compat-env.sh --strict --only "$TEST_VARS" --env-json env.json \
            --cli "$PWD/bin/cloudburrow" --gcloud "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" -- "${CB[@]}")
          eval "$COMPAT_ENV"
          if ! { [ -s "$CLOUDBURROW_TEST_KUBECONFIG" ] && kind get clusters | grep -qx "$CLOUDBURROW_TEST_CLUSTER"; }; then
            echo "the instance's kubeconfig or kind cluster is not where the compat tests expect"; kind get clusters; exit 1
          fi

          # -v, so each test's PASS or SKIP is in the log. Without it go test
          # prints only a package-level "ok", and a skipped test is
          # indistinguishable from one that passed.
          set -o pipefail
          # retry_flaky re-runs a known-flaky restart test once (#566) and
          # fails a package-level failure with no test named (#675). Its
          # allow-list and removal rule: docs/compatibility.md, "Retried once" (#704).
          # shellcheck source=.github/scripts/retry-flaky.sh
          . .github/scripts/retry-flaky.sh
          if [ "$SHARD" = acceptance ]; then
            # The acceptance workflow, the release gate (#19), and test/k8s
            # (#29, #30), against this instance (#596). Their variables go to
            # these two commands only. The worker is a pod, so it is given
            # storage's in-cluster address, read from the banner `up` prints;
            # the ingress port is the gateway `env` reports. Storage, Pub/Sub
            # and Run from scripts/compat-env.sh, as for the compat shards;
            # the other two are test/e2e's own.
            ACCEPTANCE_COMPAT=$(scripts/compat-env.sh --strict --plain --only STORAGE,PUBSUB,RUN --env-json env.json \
              --cli "$PWD/bin/cloudburrow" -- "${CB[@]}")
            mapfile -t ACCEPTANCE_ENV <<< "$ACCEPTANCE_COMPAT"
            ACCEPTANCE_ENV+=(
              "CLOUDBURROW_TEST_STORAGE_INCLUSTER=$(grep -oE 'storage +host [^ ]+ +in-cluster [^ ]+' "$UPLOG" | head -1 | awk '{print $NF}')"
              "CLOUDBURROW_TEST_INGRESS=$(jq -r '.CLOUDBURROW_INGRESS // empty | sub("^.*:"; "")' env.json)"
            )
            for kv in "${ACCEPTANCE_ENV[@]}"; do
              [ -n "${kv#*=}" ] || { echo "${kv%%=*} is empty"; cat env.json "$RUNTIME"; exit 1; }
            done
            # go test exits 0 when a test skips, and each of these skips on a
            # missing variable or tool, so every test must have passed.
            all_passed() {  # <log> <tags> <package>
              local log=$1 tags=$2 pkg=$3 t bad=
              for t in $(go test -tags="$tags" -list '.*' "$pkg" | grep '^Test'); do
                grep -q -- "^--- PASS: $t (" "$log" ||
                  { echo "$t did not pass: $(grep -- "^--- [A-Z]*: $t (" "$log" || echo 'no result')"; bad=1; }
              done
              [ -z "$bad" ]
            }
            env "${ACCEPTANCE_ENV[@]}" go test -tags=e2e -count=1 -timeout 20m -v ./test/e2e/... | tee e2e.log
            all_passed e2e.log e2e ./test/e2e/... || { echo "the acceptance workflow did not pass"; exit 1; }
            env "${ACCEPTANCE_ENV[@]}" go test -tags=integration -count=1 -timeout 20m -v ./test/k8s/... | tee k8s.log
            all_passed k8s.log integration ./test/k8s/... || { echo "a test/k8s test did not pass"; exit 1; }
            echo "== acceptance: $(grep -c -- '^--- PASS' e2e.log) e2e and $(grep -c -- '^--- PASS' k8s.log) test/k8s tests passed"
          else
            set +e
            # 60m: the emulators shard passed 25m in main run 38910752877 and 45m
            # in 38946612957 (about 490 tests; Cloud SQL and Backup and DR took the
            # most), before they moved to the sql shard (#1472), and outgrew 60m
            # again in 39068203270 (3,593 s, half of it Memorystore's), before
            # Memorystore moved to the memorystore shard (#1568): each is now
            # about 30 minutes. The job's timeout-minutes, 90, leaves the build,
            # the probes and the browser suite their half hour beside it.
            # The run shard outgrew 60m too once its CPU-scaling tests passed
            # (#1802; main run 44357900271 timed out, and 44377266506 took
            # 3,766 s under Landing 148's 90m stopgap): its tests that take
            # minutes each moved to the scale shard (#1821), about 31 minutes,
            # leaving run about 32. It reached 60m again in 44740769561
            # (Landing 160's Eventarc, Workflows and Memorystore events):
            # Eventarc's tests and Artifact Registry's cleanup policies
            # moved to the crossservice shard, the run instance again (about
            # 860 s). Main run 44905534820 cancelled it at the job's 90m
            # (suite 4,021 s, then the browser step's 30m from #2123): Cloud
            # Run's own tests and gcloud's and Terraform's of Cloud Run and
            # Cloud Functions moved to crossservice too (about 1,430 s).
            # The sql shard passed 60m in 44645694075 with no test hung
            # (3,185 s in 44617241748): its replica tests moved to the
            # sqlreplicas shard, about 28 minutes of tests, leaving sql
            # about 27.
            # COMPAT_RUN, from compat_shard: the iam shard runs only the
            # enforcement tests (#1879), and sqlreplicas only the Cloud SQL
            # replica tests, which COMPAT_SKIP keeps out of sql.
            SELECT_RUN=(); [ -n "$COMPAT_RUN" ] && SELECT_RUN=(-run "$COMPAT_RUN")
            [ -n "$COMPAT_SKIP" ] && SELECT_RUN+=(-skip "$COMPAT_SKIP")
            go test -tags=compat -timeout "$COMPAT_TIMEOUT" -v ${SELECT_RUN[@]+"${SELECT_RUN[@]}"} ./test/compat/... | tee compat.log
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              retry_flaky compat.log go test -tags=compat -count=1 -timeout 10m -v ./test/compat/... ||
                { echo "compat failed"; exit 1; }
            fi
            echo "== compat summary ($SHARD): $(grep -c -- '--- PASS' compat.log) passed, $(grep -c -- '--- SKIP' compat.log) skipped, retried: $(grep -h '^RETRIED:' compat.log | sed 's/RETRIED: //' | tr '\n' ' ')"
            grep -- '--- SKIP' compat.log || true
            # What the Kubernetes Engine clusters left (#1913): they are
            # deleted by name, so this should be what the instance began with.
            if [ "$SHARD" = served ] || [ "$SHARD" = gke ]; then df -h /; kind get clusters; fi
          fi

          # The official Node.js clients (#589), configured from `cloudburrow
          # env` alone. node --test exits 0 when a test skips, and each skips
          # on a missing variable, so every test that ran must have passed:
          # Storage, Pub/Sub, Tasks and Secret Manager here, Firestore in the
          # emulators shard: every firestore*.test.mjs file, each test named
          # "Firestore ..." so storage's skip pattern and emulators' name
          # pattern both match it (#1785's main run: the Firebase SDK Write
          # stream tests matched neither, skipped in storage and ran nowhere).
          compat_node() {  # <log> <make args...>
            local log=$1; shift
            NO_COLOR=1 make compat-node CLOUDBURROW_ARGS="${CB[*]}" "$@" | tee "$log"
            if ! grep -qx 'ℹ skipped 0' "$log" || ! grep -qx 'ℹ fail 0' "$log" || grep -qx 'ℹ pass 0' "$log"; then
              echo "the Node.js suite skipped or ran no tests: $(grep '^ℹ \(pass\|fail\|skipped\)' "$log" | paste -sd' ')"
              exit 1
            fi
          }
          if [ "$SHARD" = emulators ]; then
            compat_node node.log COMPAT_NODE_TESTS="firestore*.test.mjs examples.test.mjs" COMPAT_NODE_FLAGS=--test-name-pattern=Firestore
          fi

          # The flags naming this instance, one per line, for the console
          # browser step below, which brings it up again (#594): in the
          # storage shard, and in the run, emulators, memorystore and sql
          # shards for the screens only their instances serve (#700, #854,
          # #1472, #1568).
          case "$SHARD" in
            storage|served|run|emulators|memorystore|sql|localai) printf '%s\n' "${CB[@]}" > "$RUNNER_TEMP/cb-args" ;;
          esac
          if [ "$SHARD" = storage ]; then
            # The official Python clients against the same instance (#287),
            # configured from `cloudburrow env` alone.
            make compat-python CLOUDBURROW_ARGS="${CB[*]}"
            compat_node node.log COMPAT_NODE_FLAGS=--test-skip-pattern=Firestore

            # `logs` reads the emulator pod through the instance's kubeconfig
            # (#280): the last 20 lines, exit 0; a follow ends with 130 on SIGINT.
            ./bin/cloudburrow logs "${CB[@]}" --service pubsub --tail 20 | tee logs.txt
            [ -s logs.txt ] || { echo "logs --service pubsub printed nothing"; exit 1; }
            [ "$(wc -l < logs.txt)" -le 20 ] || { echo "logs --tail 20 printed more than 20 lines"; exit 1; }
            set +e
            timeout --preserve-status -s INT 5 ./bin/cloudburrow logs "${CB[@]}" --service pubsub --follow > follow.txt
            code=$?
            set -e
            [ "$code" = 130 ] || { echo "logs --follow exited $code on SIGINT, want 130"; exit 1; }
          fi

          # A restart probe's fixture, left alone just before stop so no
          # suite-level reset wipes it: SETUP_TESTS, from compat_shard above,
          # with the files they write (#418, #483, #596, #701).
          compat_setup_exports "$SHARD" "$RUNNER_TEMP"
          if [ -n "$SETUP_TESTS" ]; then
            go test -tags=compat -count=1 -v -run "^($(echo "$SETUP_TESTS" | tr ' ' '|'))$" ./test/compat/ | tee probe-setup.log
            for t in $SETUP_TESTS; do
              grep -q -- "--- PASS: $t" probe-setup.log || { echo "the $t restart probe setup did not pass"; exit 1; }
            done
          fi

          # stop ends the detached process and removes its pidfile.
          ./bin/cloudburrow stop "${CB[@]}"
          if kill -0 "$PID" 2>/dev/null; then echo "up (pid $PID) survived stop"; exit 1; fi
          if [ "$SHARD" = storage ]; then
            # The shutdown hook ran during stop, while storage still answered.
            grep -q '"cloudburrow-hook-bucket"' "$RUNNER_TEMP/cb-shutdown-hook.json" ||
              { echo "the shutdown.d hook did not reach storage before the cluster stopped"; cat "$RUNNER_TEMP/cb-shutdown-hook.json" 2>&1; exit 1; }
          fi
          [ ! -e "$RUNTIME" ] || { echo "stop left $RUNTIME behind"; exit 1; }

          # Durability across a restart, measured (#296, #297, #307, #418,
          # #483, #596): the suite left a probe key, a probe row, a probe entity and
          # the fixture above. This instance is persistent (the default mode), so
          # after stop and up they must be there; brought up again in
          # ephemeral mode, no backend has a volume and they must be gone.
          # Each shard probes the services it has: PROBE_TESTS, from
          # compat_shard above, and PROBE_VARS, the endpoints those tests
          # read from the restarted instance.
          if [ -n "$PROBE_TESTS" ]; then
            PROBE_RUN="^($(echo "$PROBE_TESTS" | tr ' ' '|'))$"
            probe_env() {  # <expect>: the probe tests' environment, from the restarted instance
              # The endpoints from scripts/compat-env.sh, as for the suite
              # above: the in-cluster storage server comes through the
              # restarted instance's tunnel, whose port is OS-assigned and so
              # new. --strict, so a missing one fails here, named.
              scripts/compat-env.sh --strict --plain --only "$PROBE_VARS" --env-json env-restart.json \
                --cli "$PWD/bin/cloudburrow" -- "${CB[@]}"
              # What each probe test expects to find, and the storage probe's
              # fixture.
              compat_probe_expect "$1" "$RUNNER_TEMP"
            }
            probe() {
              local expect=$1; shift
              ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}" "$@"
              ./bin/cloudburrow env "${CB[@]}" "$@" --format json > env-restart.json
              # An assignment, so a probe_env failure fails the step.
              PENV_TEXT=$(probe_env "$expect")
              mapfile -t PENV <<< "$PENV_TEXT"
              # The restarted instance's endpoints only: the ones compat-env.sh
              # exported for the suite ($TEST_VARS) name the ports before the
              # restart, and the harness refuses a run whose CLI and endpoints
              # disagree (#927). The fixtures' *_PROBE paths stay.
              probe_vars() {
                local v
                for v in ${TEST_VARS//,/ }; do unset "CLOUDBURROW_TEST_$v"; done
                for line in "${PENV[@]}"; do export "${line?}"; done
              }
              ( probe_vars; go test -tags=compat -count=1 -v -run "$PROBE_RUN" ./test/compat/ ) | tee probe.log || true
              # A flaky restart probe is re-run once with the same environment
              # (#566); a pass then counts, and the retry is named in the log.
              if grep -q -- '^--- FAIL: ' probe.log; then
                # A subshell exporting the probe's variables, not env(1):
                # retry_flaky is a shell function, which env cannot run, so
                # a flaky probe was never retried.
                (
                  probe_vars
                  retry_flaky probe.log go test -tags=compat -count=1 -v ./test/compat/
                ) || true
              fi
              # Once per run, the retry's lines with it: appended both before
              # and after the retry, a test that passed counted twice, and
              # the count below named it instead of the one that failed (#1636).
              cat probe.log >> restart.log
              ./bin/cloudburrow stop "${CB[@]}" "$@"
            }
            probe present
            probe absent --mode ephemeral
            # Each probe passes once per restart, exactly: every test that
            # did not is named, with its count.
            bad=
            for t in $PROBE_TESTS; do
              # The test's own PASS line, not its subtests' indented ones
              # (TestMemorystoreClustersAcrossRestart has five, so an
              # unanchored count gave 12).
              n=$(grep -c -- "^--- PASS: $t " restart.log || true)
              [ "$n" = 2 ] || bad+=" $t (passed $n times)"
            done
            [ -z "$bad" ] || { echo "restart probes that did not pass once after each restart:$bad"; exit 1; }
            # Storage's probe is its own setup too: at setup, after the
            # persistent restart and after the ephemeral one.
            if [ "$SHARD" = storage ]; then
              cat probe-setup.log restart.log | grep -c -- '--- PASS: TestStorageAcrossRestart' | grep -qx 3 ||
                { echo "TestStorageAcrossRestart did not pass at setup, after a persistent restart and after an ephemeral one"; exit 1; }
            fi
            echo "== restart probes retried: $(grep -h '^RETRIED:' restart.log | sed 's/RETRIED: //' | tr '\n' ' ')"
          fi

      - name: Save the instance's local AI models
        if: always() && matrix.shard == 'localai' && steps.instance-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cb/models
          key: ${{ steps.instance-models.outputs.cache-primary-key }}

      # The console in a real browser (#594): test/browser drives headless
      # Chrome through chromedp (Go, build tag browser, pinned in go.mod, so
      # no Node toolchain) against this shard's instance. The step above
      # stopped the instance, so it is brought up again here with the same
      # flags. Most of the suite runs in the storage shard; the Cloud KMS and
      # Cloud Run screens are served only by the run shard's instance, so the
      # tests named TestKMS* and TestCloudRun* run there instead (#700); the
      # BigQuery, Firestore, Datastore, Spanner and Bigtable screens only by
      # the emulators shard's, so TestBigQuery*, TestFirestore*,
      # TestDatastore*, TestSpanner* and TestBigtable* run there (#854,
      # #1198); the Memorystore screens only by the memorystore shard's, so
      # TestMemorystore* run there (#1568); and the Cloud SQL screens only by the sql shard's, so
      # TestCloudSQL* run there (#868, #995, #1472); and the Kubernetes Engine API
      # only by the served shard's, so TestGKEServed* runs there, with
      # TestKubernetesEnginePages*, which also runs in storage (#1913, #1925);
      # and the Studio's and Embeddings page's local models only by the
      # localai shard's (#1985).
      # Every test selected for the shard must pass: go test
      # exits 0 on a skip, and each skips without its variables or its screen.
      - name: Console in a headless browser
        if: matrix.shard == 'storage' || matrix.shard == 'served' || matrix.shard == 'run' || matrix.shard == 'emulators' || matrix.shard == 'memorystore' || matrix.shard == 'sql' || matrix.shard == 'localai'
        run: |
          set -o pipefail
          # ubuntu-latest ships Google Chrome: it is in the runner image's
          # Browsers and Drivers list (actions/runner-images,
          # images/ubuntu/Ubuntu2404-Readme.md). Only if an image ever drops
          # it, a pinned Chrome for Testing from Google's own distribution.
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            CFT=154.0.8037.57
            echo "no google-chrome on this runner; installing Chrome for Testing $CFT"
            curl --retry 5 --retry-all-errors -fsSLo "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CFT/linux64/chrome-linux64.zip"
            unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP"
            CHROME="$RUNNER_TEMP/chrome-linux64/chrome"
          fi
          "$CHROME" --version
          export CLOUDBURROW_TEST_CHROME="$CHROME"
          # The page is this instance's console on loopback and nothing else,
          # which the suite asserts, so Chrome's sandbox is off: Ubuntu 24.04's
          # restriction on unprivileged user namespaces can refuse it.
          export CLOUDBURROW_TEST_CHROME_NO_SANDBOX=1
          export CLOUDBURROW_TEST_SCREENSHOTS="$RUNNER_TEMP/browser-screenshots"

          mapfile -t CB < "$RUNNER_TEMP/cb-args"
          ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}"
          # The console, the control address, the admin token and the kind
          # cluster the prediction fixture is loaded into (#869), from
          # scripts/compat-env.sh as in the step above; --strict fails,
          # naming it, on any that is missing. The emulators shard's also
          # the Datastore, Firestore and Bigtable emulators, which its tests
          # write and read back through with the official clients (#895,
          # #1198); the
          # other shards run neither.
          BROWSER_VARS=CONSOLE,CONTROL,ADMIN_TOKEN,CLUSTER
          # And Cloud KMS, whose key the Create a Firestore database page
          # chooses (#1881).
          # And the BigQuery Data Transfer Service, whose scheduled query the
          # Scheduled queries page makes is read back through it (#1948).
          # And BigQuery sharing, whose exchanges the Sharing pages make are
          # read back through it (#1960), and BigQuery, whose clean room's
          # linked dataset the official client queries (TestBigQueryCleanRoomsThroughThePage;
          # main runs 45047408927 and 45102950103 skipped it without BIGQUERY).
          if [ "$SHARD" = emulators ]; then BROWSER_VARS+=,DATASTORE,FIRESTORE,BIGTABLE,SPANNER,KMS,DATATRANSFER,ANALYTICSHUB,BIGQUERY; fi
          # The memorystore shard's read back through the Memorystore admin API.
          if [ "$SHARD" = memorystore ]; then BROWSER_VARS+=,MEMORYSTORE_ADMIN,MEMORYSTORE_PROJECT; fi
          # The Logs Explorer reads entries written through the Logging API (#1410).
          # And the kubeconfig, with which the Kubernetes Engine test removes the
          # deployment its Deploy made (#1857), and Cloud Monitoring, which the
          # Metrics explorer test writes to (#1939).
          if [ "$SHARD" = storage ]; then BROWSER_VARS+=,LOGGING,STORAGE,PUBSUB,TASKS,SCHEDULER,RESOURCEMANAGER,SERVICEUSAGE,APIKEYS,STORAGE_BATCH,STORAGE_INSIGHTS,STORAGE_TRANSFER,KUBECONFIG,MONITORING; fi
          # The run shard's read back through Cloud Run, Cloud KMS, Secret Manager,
          # Cloud Logging and BigQuery's official clients, and enable the
          # Container Scanning API through its Service Usage, RUN_SERVICEUSAGE
          # (#1912): the scanner is the one prefetched into the state dir above.
          # And Cloud Storage, which the Document AI batch, processor version
          # and evaluation pages and Speech-to-Text's batch transcription read
          # their output back through (#1930, #1953).
          # Cloud Monitoring's Cloud Run metrics, and the kubeconfig that
          # port-forwards the gateway a service's URL is reached through (#2049).
          # And the Firestore and Datastore emulators, where the Eventarc
          # triggers made on a function's Add trigger have their events caused (#2093).
          if [ "$SHARD" = run ]; then BROWSER_VARS+=,RUN,KMS,SECRETS,LOGGING,BIGQUERY,BIGQUERY_PROJECT,RUN_SERVICEUSAGE,WORKFLOWS,STORAGE,MONITORING,KUBECONFIG,RUN_FIRESTORE,RUN_DATASTORE; fi
          # The sql shard's read back through the Cloud SQL Admin API, the Backup
          # and DR Service and Secret Manager, which holds Run SQL's password,
          # and the Compute Engine API, whose VMs and disks Backup and DR backs
          # up and restores through the pages (#2084's round, TestBackupDRCompute*).
          if [ "$SHARD" = sql ]; then BROWSER_VARS+=,SQLADMIN,BACKUPDR,SECRETS,COMPUTE; fi
          # The served shard's: the Kubernetes Engine API, whose cluster the
          # pages make is removed through it by name whatever the test
          # reached, and the kubeconfig the Deploy test cleans up with
          # (#1913, #1925).
          if [ "$SHARD" = served ]; then BROWSER_VARS+=,GKE,KUBECONFIG,TRACE,LOGGING; fi
          # The localai shard's: the Embeddings page's Cloud Storage objects,
          # and the local AI endpoints (#1985).
          if [ "$SHARD" = localai ]; then BROWSER_VARS+=,STORAGE,LOCALAI,EMBEDDINGS; fi
          BROWSER_ENV=$(scripts/compat-env.sh --strict --only "$BROWSER_VARS" --cli "$PWD/bin/cloudburrow" -- "${CB[@]}")
          eval "$BROWSER_ENV"

          # The run, emulators, memorystore and sql shards' tests, and the rest for the
          # storage shard, from the file scripts/verify-local.sh reads too
          # (#705).
          # shellcheck source=scripts/compat-shards.sh
          . scripts/compat-shards.sh
          # What the restarted instance needs before its tests (#1985).
          compat_browser_prepare "$SHARD"
          RUN_SHARD_TESTS=$COMPAT_BROWSER_RUN_SHARD_TESTS
          EMULATORS_SHARD_TESTS=$COMPAT_BROWSER_EMULATORS_SHARD_TESTS
          MEMORYSTORE_SHARD_TESTS=$COMPAT_BROWSER_MEMORYSTORE_SHARD_TESTS
          SQL_SHARD_TESTS=$COMPAT_BROWSER_SQL_SHARD_TESTS
          SERVED_SHARD_TESTS=$COMPAT_BROWSER_SERVED_SHARD_TESTS
          SERVED_ONLY_TESTS=$COMPAT_BROWSER_SERVED_ONLY_TESTS
          LOCALAI_SHARD_TESTS=$COMPAT_BROWSER_LOCALAI_SHARD_TESTS
          NEVER_TESTS=$COMPAT_BROWSER_NEVER_TESTS
          case "$SHARD" in
            # The localai shard's tests are kept out of run, whose pattern
            # (TestSpeech*) names one of them: its transcription needs the
            # local models only that shard starts.
            run) SELECT=(-run "$RUN_SHARD_TESTS" -skip "$LOCALAI_SHARD_TESTS|$NEVER_TESTS"); PICK=(grep -E "$RUN_SHARD_TESTS") ;;
            emulators) SELECT=(-run "$EMULATORS_SHARD_TESTS" -skip "$NEVER_TESTS"); PICK=(grep -E "$EMULATORS_SHARD_TESTS") ;;
            memorystore) SELECT=(-run "$MEMORYSTORE_SHARD_TESTS" -skip "$NEVER_TESTS"); PICK=(grep -E "$MEMORYSTORE_SHARD_TESTS") ;;
            sql) SELECT=(-run "$SQL_SHARD_TESTS" -skip "$NEVER_TESTS"); PICK=(grep -E "$SQL_SHARD_TESTS") ;;
            served) SELECT=(-run "$SERVED_SHARD_TESTS" -skip "$NEVER_TESTS"); PICK=(grep -E "$SERVED_SHARD_TESTS") ;;
            localai) SELECT=(-run "$LOCALAI_SHARD_TESTS" -skip "$NEVER_TESTS"); PICK=(grep -E "$LOCALAI_SHARD_TESTS") ;;
            *) SELECT=(-skip "$RUN_SHARD_TESTS|$EMULATORS_SHARD_TESTS|$MEMORYSTORE_SHARD_TESTS|$SQL_SHARD_TESTS|$SERVED_ONLY_TESTS|$LOCALAI_SHARD_TESTS|$NEVER_TESTS"); PICK=(grep -vE "$RUN_SHARD_TESTS|$EMULATORS_SHARD_TESTS|$MEMORYSTORE_SHARD_TESTS|$SQL_SHARD_TESTS|$SERVED_ONLY_TESTS|$LOCALAI_SHARD_TESTS") ;;
          esac
          rc=0
          NOT=$NEVER_TESTS; [ "$SHARD" = localai ] || NOT="$LOCALAI_SHARD_TESTS|$NEVER_TESTS"
          # 10m, and 20m in served, whose test makes a Kubernetes Engine
          # cluster and node pool, real kind nodes, through the pages (#1913,
          # #1925): about a minute on a laptop, several on a runner. And 20m
          # in run, whose suite took 527 s in main run 44774469756 before the
          # Model Registry's Deploy, which waits up to four minutes for the
          # serving container (#1940), and the Document AI and Speech batch
          # pages joined it. And 20m in storage, the rest of the suite: 403 s
          # in 44774469756, then past 10m in 44830404935 (#2080) with no test
          # hung: its 140 tests in both took 1.30x as long (median), Landing
          # 161 added 77 s of tests, and the six it did not reach took 15 s
          # before, so about 615 s. And 20m in sql, 365 s in main run
          # 44875166859 before Backup and DR's Compute Engine pages, whose VM
          # and disk round trip took 152 s in its compat test.
          # And 30m in run since Cloud Build's and the Logging console rounds'
          # tests joined it: 1,005 s in main run 44891736706 before them.
          # And 30m in storage: 1,169 s of its 1,200 in main run
          # 45102950103, then past 20m in 45126544176 with no test hung (the
          # 200 it reached took 1,187 s; the seven it did not, 43 s before).
          BROWSER_TIMEOUT=10m; case "$SHARD" in served|sql) BROWSER_TIMEOUT=20m ;; run|storage) BROWSER_TIMEOUT=30m ;; esac
          go test -tags=browser -count=1 -timeout "$BROWSER_TIMEOUT" -v "${SELECT[@]}" ./test/browser/ | tee browser.log || rc=1
          for t in $(go test -tags=browser -list '.*' ./test/browser/ | grep '^Test' | "${PICK[@]}" | grep -vE "$NOT"); do
            grep -q -- "^--- PASS: $t (" browser.log ||
              { echo "$t did not pass: $(grep -- "^--- [A-Z]*: $t (" browser.log || echo 'no result')"; rc=1; }
          done
          ./bin/cloudburrow stop "${CB[@]}"
          [ "$rc" = 0 ] || { echo "the console browser suite did not pass"; exit 1; }
          echo "== browser ($SHARD): $(grep -c -- '^--- PASS' browser.log) console tests passed in $("$CHROME" --version)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && (matrix.shard == 'storage' || matrix.shard == 'served' || matrix.shard == 'run' || matrix.shard == 'emulators' || matrix.shard == 'memorystore' || matrix.shard == 'sql' || matrix.shard == 'localai')
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-screenshots
            browser.log
          retention-days: 7
          if-no-files-found: ignore

      # The shard's test logs, for compat-coverage.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-log-${{ matrix.shard }}
          path: |
            compat.log
            probe-setup.log
            restart.log
            e2e.log
            k8s.log
            node.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          # The same bundle a user attaches to a bug report (#293): redacted,
          # and it records what it could not collect rather than failing.
          ./bin/cloudburrow diagnose -o diagnostics/bundle.tar.gz --name ci --state-dir "$RUNNER_TEMP/cb" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: compat-diagnostics-${{ matrix.shard }}
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          # If the suite failed before `stop`, end the detached instance here.
          PID=$(jq -r .pid "$RUNNER_TEMP/cb/ci/up.json" 2>/dev/null || true)
          [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done

  # Every compat test ran in some shard. A test whose service is in no shard
  # would skip everywhere and never be missed: the shards are gated by
  # variables, and a variable nobody exports is silent. This reads the
  # shards' logs and fails on any test that passed or failed in none of them.
  compat-coverage:
    name: every compat test ran in a shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: compat
    if: always() && needs.compat.result != 'skipped'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compat-log-*
          path: logs
      - name: Compare the shards' logs with the package's tests
        run: |
          go test -tags=compat -list '.*' ./test/compat/ | grep '^Test' | sort > all.txt
          missing=
          for shard in storage served gke run crossservice scale emulators memorystore sql sqlreplicas iam localai localaispeech; do
            d=logs/compat-log-$shard
            [ -d "$d" ] || { echo "no logs from the $shard shard"; missing=1; continue; }
            # Top-level results only; a subtest's line is indented.
            cat "$d"/*.log | grep -oE -- '^--- (PASS|FAIL): Test[A-Za-z0-9_]+' | awk '{print $3}' | sort -u > "ran-$shard.txt"
            echo "== $shard ran $(wc -l < "ran-$shard.txt") tests: $(paste -sd' ' "ran-$shard.txt")"
          done
          [ -z "$missing" ] || exit 1
          sort -u ran-*.txt > ran.txt
          # Tests the compat job never runs, each for a reason. The local
          # generation and embeddings tests (Vertex AI, BigQuery's AI and ML
          # functions, Document AI, Speech-to-Text, ML.ANNOTATE_IMAGE) and
          # BigQuery ML's imported ONNX model run in the localai shard
          # (#1985; scripts/compat-shards.sh, COMPAT_LOCALAI_TESTS), so none
          # is here. The signed-URL and versioning probes run in the check
          # job against the standalone storage server, not here; the three
          # Functions tests, SubmitBuild's buildpacks test (#1268) and the
          # Node.js, Python (#1303), Java, Ruby, PHP and .NET (#1319)
          # Functions tests, and the Functions API's, gcloud's and
          # Terraform's deploys of testdata/function (#1377), and its builds
          # with event triggers, through the client and gcloud (#1414), and
          # the v1 API's, gcloud --no-gen2's, the console's and Terraform's
          # 1st-gen deploys (#1428), and the build of a function that mounts
          # Secret Manager secrets (#1464), pull Google's builder and build
          # from source, too slow for every merge, so they run only when
          # CLOUDBURROW_TEST_FUNCTIONS is set (#678), in functions.yml on
          # amd64; the run shard runs the ungated halves of the gcloud and
          # Terraform ones (and of gcloud's event triggers), so they fail
          # there but skip at the gate. Cloud Build's host-steps-off test
          # (#1382) needs an instance without --cloudbuild-host-steps, which
          # the run shard sets; and Model Garden's Hugging Face deploys
          # CLOUDBURROW_TEST_HF_DEPLOY, for about 1.3 GB of models and 6 GB
          # of vLLM and TEI engine images: Model Garden's engines, not the
          # LiteRT-LM and ONNX runtime the localai shard starts, so #1985
          # left them here; all run locally, as do its GGUF-on-the-cluster's
          # siblings over the same gate, the ONNX, MLX and PyTorch Inference
          # runtimes, whose pods install PyTorch or MLX (#2148). The Apple
          # GPU (Metal) tests, Model Garden's GGUF and MLX deploys and
          # generation on it (#2155, #2159), run only on macOS on Apple silicon,
          # which no runner here is. TestCloudSQLServerInstance
          # starts SQL Server, whose licence only the end user accepts
          # (CLOUDBURROW_ACCEPT_MSSQL_EULA=Y): CI never accepts it for them,
          # so it skips in the sql shard and runs only locally. BigQuery's
          # Spark procedures (#2104) run spark-submit in the 1.8 GB
          # apache/spark image with Google's connector from Maven Central,
          # on an --internal Docker network: CLOUDBURROW_TEST_SPARK, run
          # nightly by nightly-sql-ephemeral.yml's spark job (the spark
          # shard of scripts/compat-shards.sh) and locally.
          never='^Test(FunctionsFrameworkBuiltWithBuildpacks|FunctionsRebuildReusesLayers|FunctionsBuildBrokenModulePathFails|StorageSignedURLV2RegisteredCert|StorageVersioningPersistentMode|FunctionsSubmitBuildBuildpacks|FunctionsNodejsBuiltWithBuildpacks|FunctionsPythonBuiltWithBuildpacks|FunctionsJavaBuiltWithBuildpacks|FunctionsRubyBuiltWithBuildpacks|FunctionsPHPBuiltWithBuildpacks|FunctionsDotnetBuiltWithBuildpacks|FunctionsAPIBuildsAndServes|GcloudFunctions|TerraformCloudFunctions2Function|FunctionsEventTriggerBuilds|GcloudFunctionsEventTriggers|CloudBuildHostStepsOff|FunctionsV1BuildsAndServes|GcloudFunctionsV1|ConsoleFunctionsV1|TerraformCloudFunctionsFunction|FunctionsSecretsBuildsAndMounts|ModelGardenDeploysHuggingFaceModels|ModelGardenDeploysOnHuggingFacePyTorchInference|ModelGardenDeploysAnONNXModel|ModelGardenDeploysAnMLXModel|ModelGardenDeploysAGGUFModelOnTheAppleGPU|ModelGardenDeploysAnMLXModelOnTheAppleGPU|GenerateContentOnTheAppleGPU|CloudSQLServerInstance|BigQuerySparkStoredProcedures|BqSparkStoredProcedure|BigQuerySparkProcedureRuntimesAndTypes|BigQuerySparkProcedureContainerImage|BigQuerySparkProcedureInvoker|BigQuerySparkProcedureStagingAndCMEK)$'
          none=$(comm -23 all.txt ran.txt | grep -vE "$never" || true)
          if [ -n "$none" ]; then
            echo "tests that ran in no shard:"; echo "$none"; exit 1
          fi
          echo "== $(wc -l < ran.txt) of $(wc -l < all.txt) tests ran; in more than one shard (instance-level tests): $(sort ran-*.txt | uniq -d | paste -sd' ')"

  # A red main has to be visible without someone going to look.
  #
  # Only on pushes to main, never for a pull request, and the only job with
  # issues: write — so an untrusted pull request can never obtain a token that
  # writes to the repository. One tracking issue is reused rather than one per
  # failure, so a broken main is a single thing to watch.
  report-main-failure:
    name: report main failure
    needs: [bigquery-emulator, bigquery-emulator-patches, check, cross, modules, integration, compat, compat-coverage]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create main-broken --repo "$REPO" --color b60205 \
            --description "CI is failing on main" 2>/dev/null || true
          n=$(gh issue list --repo "$REPO" --label main-broken --state open --json number --jq '.[0].number // empty')
          body="CI failed on \`main\` at $SHA: $RUN_URL"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "CI is failing on main" --label main-broken --assignee identity-wael \
              --body "$body

          Opened automatically by the CI workflow. It closes itself when main passes again."
          fi

  # And a green main closes that issue, so it never outlives the problem.
  report-main-recovered:
    name: report main recovered
    needs: [bigquery-emulator, bigquery-emulator-patches, check, cross, modules, integration, compat, compat-coverage]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$REPO" --label main-broken --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "main is green again at $SHA: $RUN_URL"
          done

  # ci-green is the single required check: it fails when any job failed or was
  # cancelled, and passes when every job passed or was skipped by design (the
  # compat job on a docs-only pull request). The merge queue and branch rule
  # require this job alone, so a conditional job can never leave a PR waiting
  # on a check that will not run.
  ci-green:
    name: ci-green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, bigquery-emulator, bigquery-emulator-patches, modules, check, cross, integration, compat, compat-coverage]
    if: always()
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "a job failed or was cancelled"; exit 1
          fi
