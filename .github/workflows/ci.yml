name: CI

# Checks that run on every change. This workflow never publishes anything and
# never receives credentials: release permissions are kept in a separate
# workflow so an untrusted pull request cannot reach them.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each batch of PRs as a merge group and runs this
  # workflow on it once; detect changes treats it as heavy, so the compat job
  # runs on every batch. `ci-green` below is the one check the queue requires.
  merge_group:
  workflow_dispatch:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No job may reach Google Cloud. The compatibility harness also refuses these
  # at runtime, but keeping them unset means a mistake cannot cost money.
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""

jobs:
  # Decides whether a pull request touches code the slow suites cover.
  #
  # Those suites used to run on pull requests only when someone added the
  # run-integration label, and the label was only added when someone already
  # suspected a problem. So a change that broke official-SDK object reads merged
  # green and main stayed red for two days (#268). Detection is plain git, not a
  # third-party action: every action here is pinned by SHA, and adding one is a
  # supply-chain decision of its own.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        # The SHAs arrive through the environment, never interpolated into the
        # script, so nothing in a pull request's metadata can be executed.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(go\.(mod|sum)$|internal/|cmd/|test/|testdata/|docs/examples/|Makefile$|\.github/workflows/ci\.yml$|scripts/compat-env\.sh$)'; then
            heavy=true
          else
            heavy=false
          fi
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both supported Go releases, so the minimum pinned in go.mod is
        # genuinely buildable rather than assumed, and macOS.
        #
        # A merge group runs Linux on Go 1.27 only. Every PR in it already
        # passed the full matrix on its own head, and what a merge can newly
        # break (two PRs that conflict in behaviour) shows up on one platform.
        # The free plan runs 20 jobs at once and macOS 5; a queue building
        # several groups at the full matrix starved its own compat jobs of
        # runners, so each group took 25+ minutes to land. Pushes to main still
        # run everything, so a platform-only break is reported there.
        include: ${{ fromJSON(github.event_name == 'merge_group' && '[{"go":"1.27","os":"ubuntu-latest"}]' || '[{"go":"1.26","os":"ubuntu-latest"},{"go":"1.27","os":"ubuntu-latest"},{"go":"1.27","os":"macos-latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: false

      # The same commands a developer runs locally. If these diverge, the
      # documented workflow is wrong.
      - run: make fmt-check
      - run: make vet
      - run: make docs-check
      - run: make test-race
      - run: make build

      # The four release targets, which make build (host only) does not
      # compile; release.yml is otherwise the first to build them (#713).
      # This row also runs in merge groups.
      - name: Cross-compile the release targets
        if: runner.os == 'Linux' && matrix.go == '1.27'
        run: make cross

      - name: Verify the binary runs
        run: ./bin/cloudburrow version

      # For the Python storage suite against the builtin server (#516).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Linux' && matrix.go == '1.27'
        with:
          python-version: "3.12"

      # The builtin Cloud Storage server (#485) through the official Go
      # client, with no cluster: `cloudburrow storage-server` alone.
      - name: Builtin Cloud Storage compat
        if: runner.os == 'Linux' && matrix.go == '1.27'
        run: |
          # Google's in-memory Pub/Sub fake, for the builtin server's
          # notifications (#506); test infrastructure, never shipped.
          go build -o bin/pubsubfake ./test/tools/pubsubfake
          ./bin/pubsubfake --listen 127.0.0.1:8095 > pubsubfake.log 2>&1 &
          # A throwaway signing key and certificate for the signed URL tests
          # (#509); generated here, never committed.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/sign-key.pem" -out "$RUNNER_TEMP/sign-cert.pem" -days 1 -subj "/CN=signer" 2>/dev/null
          # One origin beyond loopback is allowed, for the allowlist test (#677).
          ./bin/cloudburrow storage-server --listen 127.0.0.1:4443 --host storage.localhost --pubsub-emulator 127.0.0.1:8095 \
            --cors-allow-origin https://app.test:8443 \
            --signing-cert "signer@cloudburrow-ci.iam.gserviceaccount.com=$RUNNER_TEMP/sign-cert.pem" > storage-server.log 2>&1 &
          for i in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:4443/storage/v1/b?project=p && break; sleep 0.2; done
          set -o pipefail
          CLOUDBURROW_TEST_STORAGE=http://127.0.0.1:4443 CLOUDBURROW_TEST_PUBSUB=127.0.0.1:8095 CLOUDBURROW_TEST_CORS_ORIGIN=https://app.test:8443 \
            CLOUDBURROW_TEST_SIGNING_KEY="$RUNNER_TEMP/sign-key.pem" CLOUDBURROW_TEST_SIGNING_EMAIL=signer@cloudburrow-ci.iam.gserviceaccount.com \
            go test -tags=compat -count=1 -v -run '^(TestStorage(BucketLifecycle|BucketsList|BucketPatchKeepsOmittedFields|BucketMetagenerationPreconditions|NonEmptyBucketDelete|ObjectRoundTrip|Checksums|GenerationPreconditions|ListWithPrefix|ResumableUploadAndRangedRead|Compose|Copy|VersioningKeepsNoncurrent|VersioningDeleteKeepsNoncurrent|VersioningDisableKeepsExisting|DoesNotExistWithOnlyNoncurrent|SoftDeleteAndRestore|RestoreNotSoftDeleted412|RestoreWithoutPolicy412|BucketDeleteIgnoresSoftDeleted|RetentionBlocksDelete|LockRetentionPolicy|HoldsBlockDelete|ObjectRetentionRequiresEnabledBucket|LifecycleConfigRoundTrip|LifecycleUnknownCondition400|CORSRoundTrip|XMLPreflightMatches|XMLPreflightMismatch200NoHeaders|JSONAlwaysAllowsCORS|CORSRefusesForeignOrigin|CORSLoopbackOriginWorks|CORSAllowlistedOriginWorks|BucketLabelsAndStorageClassRoundTrip|BucketFieldsNeverSilentlyDropped|BucketIAMRoundTrip|BucketIAMStaleEtag|BucketIAMConditionUnimplemented|ACLNotImplemented|HMACKeyLifecycle|HMACKeyLimit|XMLPutGetDelete|XMLListBucket|XMLResumable201And204|XMLErrorCodes|XMLHostStyle|XMLMultipartAbort204|XMLMultipartListParts|XMLMultipartPreconditionRefused|SignedURLV4HMAC|SignedURLV2RegisteredCert)|TestBucketUpdateChangesMetadata|TestMultipartUploadStoresMetadataWithContent|TestObjectMetadataUpdate|TestResumableUploadCompletes|TestObjectCopyAndRewrite|TestObjectUploadDeliversANotification|TestNotificationFiltersAreHonoured|TestNotificationConfigsCRUDThroughTheSDK|TestUnconfiguredBucketStillUploads|TestNotificationArchiveOnVersionedOverwrite|TestNotificationDeleteAndMetadataUpdate)$' ./test/compat/ | tee builtin-storage.log
          for t in TestStorageBucketLifecycle TestStorageBucketsList TestStorageBucketPatchKeepsOmittedFields TestStorageBucketMetagenerationPreconditions TestStorageNonEmptyBucketDelete TestStorageObjectRoundTrip TestStorageChecksums TestMultipartUploadStoresMetadataWithContent TestStorageGenerationPreconditions TestObjectMetadataUpdate TestStorageListWithPrefix TestStorageResumableUploadAndRangedRead TestResumableUploadCompletes TestStorageCompose TestStorageCopy TestObjectCopyAndRewrite TestStorageVersioningKeepsNoncurrent TestStorageVersioningDeleteKeepsNoncurrent TestStorageVersioningDisableKeepsExisting TestStorageDoesNotExistWithOnlyNoncurrent TestStorageSoftDeleteAndRestore TestStorageRestoreNotSoftDeleted412 TestStorageRestoreWithoutPolicy412 TestStorageBucketDeleteIgnoresSoftDeleted TestStorageRetentionBlocksDelete TestStorageLockRetentionPolicy TestStorageHoldsBlockDelete TestStorageObjectRetentionRequiresEnabledBucket TestStorageLifecycleConfigRoundTrip TestStorageLifecycleUnknownCondition400 TestStorageCORSRoundTrip TestStorageXMLPreflightMatches TestStorageXMLPreflightMismatch200NoHeaders TestStorageJSONAlwaysAllowsCORS TestStorageCORSRefusesForeignOrigin TestStorageCORSLoopbackOriginWorks TestStorageCORSAllowlistedOriginWorks TestStorageBucketLabelsAndStorageClassRoundTrip TestStorageBucketFieldsNeverSilentlyDropped TestBucketUpdateChangesMetadata TestStorageBucketIAMRoundTrip TestStorageBucketIAMStaleEtag TestStorageBucketIAMConditionUnimplemented TestStorageACLNotImplemented TestStorageHMACKeyLifecycle TestStorageHMACKeyLimit TestObjectUploadDeliversANotification TestNotificationFiltersAreHonoured TestNotificationConfigsCRUDThroughTheSDK TestUnconfiguredBucketStillUploads TestNotificationArchiveOnVersionedOverwrite TestNotificationDeleteAndMetadataUpdate TestStorageXMLPutGetDelete TestStorageXMLListBucket TestStorageXMLResumable201And204 TestStorageXMLErrorCodes TestStorageXMLHostStyle TestStorageXMLMultipartAbort204 TestStorageXMLMultipartListParts TestStorageXMLMultipartPreconditionRefused TestStorageSignedURLV4HMAC TestStorageSignedURLV2RegisteredCert; do
            grep -q -- "--- PASS: $t " builtin-storage.log || { echo "$t did not pass against the builtin server"; cat storage-server.log; exit 1; }
          done

          # The official Python client against the same server (#516). No
          # instance means no `cloudburrow env`: env.json stands in for it, in
          # its format, with a fixture service account made from the throwaway
          # key, so the suite's credentials guard holds as it does on an
          # instance.
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          t = sys.argv[1]
          sa = {"type": "service_account", "project_id": "cloudburrow-ci", "private_key_id": "fixture",
                "private_key": open(t + "/sign-key.pem").read(), "client_id": "1",
                "client_email": "signer@cloudburrow-ci.iam.gserviceaccount.com", "token_uri": "http://127.0.0.1:1/token"}
          json.dump(sa, open(t + "/fixture-sa.json", "w"))
          json.dump({"STORAGE_EMULATOR_HOST": "http://127.0.0.1:4443", "GOOGLE_CLOUD_PROJECT": "cloudburrow-ci",
                     "GOOGLE_APPLICATION_CREDENTIALS": t + "/fixture-sa.json"}, open(t + "/env.json", "w"))
          PY
          CLOUDBURROW_ENV_JSON="$RUNNER_TEMP/env.json" \
            CLOUDBURROW_TEST_SIGNING_KEY="$RUNNER_TEMP/sign-key.pem" CLOUDBURROW_TEST_SIGNING_EMAIL=signer@cloudburrow-ci.iam.gserviceaccount.com \
            make compat-python COMPAT_PY_TESTS=test/compat-python/test_storage.py | tee builtin-python.log
          for t in test_bucket_and_object_crud_with_a_resumable_upload test_resumable_upload_resumes_after_interruption test_media_link_uses_emulator_host test_if_generation_match_zero test_batch_deletes_and_patches test_transfer_manager_xml_multipart_upload test_generate_signed_url_v4; do
            grep -q "::$t PASSED" builtin-python.log || { echo "$t did not pass against the builtin server"; cat storage-server.log; exit 1; }
          done

          # Versioning across a restart of a persistent builtin server (#498):
          # the probe writes a noncurrent and a live version, the server is
          # stopped and started on the same --data-dir, and the probe reads
          # both back.
          persist() {
            ./bin/cloudburrow storage-server --listen 127.0.0.1:4444 --data-dir "$RUNNER_TEMP/gcs-data" --mode "${1:-persistent}" >> storage-persist.log 2>&1 &
            PERSIST=$!
            for i in $(seq 1 50); do curl -s -o /dev/null 'http://127.0.0.1:4444/storage/v1/b?project=p' && break; sleep 0.2; done
          }
          probe() {
            CLOUDBURROW_TEST_STORAGE=http://127.0.0.1:4444 \
              CLOUDBURROW_TEST_STORAGE_VERSIONING_PROBE="$1:$RUNNER_TEMP/versioning-probe.json" \
              CLOUDBURROW_TEST_STORAGE_RESTART_PROBE="$2:$RUNNER_TEMP/restart-probe.json" \
              go test -tags=compat -count=1 -v -run '^(TestStorageVersioningPersistentMode|TestStorageAcrossRestart)$' ./test/compat/ | tee -a versioning-restart.log
          }
          persist; probe setup setup
          kill "$PERSIST"; wait "$PERSIST" || true
          persist; probe check present
          kill "$PERSIST"; wait "$PERSIST" || true
          # Ephemeral mode on the same directory starts with nothing (#512).
          persist ephemeral; probe "" absent
          kill "$PERSIST"
          grep -c -- '--- PASS: TestStorageVersioningPersistentMode' versioning-restart.log | grep -qx 2 ||
            { echo "the versioning restart probe did not pass before and after the restart"; cat storage-persist.log; exit 1; }
          grep -c -- '--- PASS: TestStorageAcrossRestart' versioning-restart.log | grep -qx 3 ||
            { echo "TestStorageAcrossRestart did not pass at setup, after a persistent restart and after an ephemeral one"; cat storage-persist.log; exit 1; }

      # The installer is run by people who have not read it, piped into sh.
      # shellcheck ships on the Ubuntu runners; the scripts' behaviour,
      # including refusing a corrupted download, is tested on both OSes by
      # test/install as part of test-race.
      # The generated API coverage must match the proto surface, the
      # registry and the compat tests' annotations (#288).
      - name: API coverage is current
        if: runner.os == 'Linux' && matrix.go == '1.27'
        run: go run ./tools/coverage -check

      - name: shellcheck the release scripts
        if: runner.os == 'Linux'
        run: |
          # scripts/compat-env.sh, compat-shards.sh and verify-local.sh are
          # bash, and checked as bash below.
          find scripts -maxdepth 1 -name '*.sh' ! -name compat-env.sh ! -name compat-shards.sh ! -name verify-local.sh -exec shellcheck -s sh {} +
          # Bash helpers the workflows source (#675), and the compat
          # environment generator (#711), checked as bash.
          shellcheck -s bash .github/scripts/*.sh scripts/compat-env.sh
          # The compat job's shards and their local run (#705), as bash.
          shellcheck -x -s bash scripts/compat-shards.sh scripts/verify-local.sh

  modules:
    name: modules and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # A dirty go.mod/go.sum after tidy means the committed dependency set is
      # not what the code actually needs.
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go mod verify
        run: go mod verify

      - name: govulncheck
        run: |
          # Pinned: dependencies.json toolchain.govulncheck (#695).
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  integration:
    name: integration (cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cluster tests are slow and need Docker. They run on main, and on a pull
    # request that touches code they cover (see the changes job) or is labelled
    # run-integration. A docs-only change still skips them.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=v1.36.4
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      - name: Cluster lifecycle tests
        run: go test -tags=integration -timeout 25m ./internal/cluster/...

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          kind get clusters > diagnostics/clusters.txt 2>&1 || true
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          # Bounded on purpose: a multi-megabyte dump helps nobody.
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "diagnostics/$c" --name "$c" 2>&1 | tail -50 || true
          done
          find diagnostics -type f -size +1M -delete || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Leave no clusters behind
        if: always()
        run: |
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done

  # The compatibility suite runs as four shards and an acceptance shard,
  # each an instance with only its services and only their CLOUDBURROW_TEST_*
  # variables exported (#565). What each shard starts and runs is in
  # scripts/compat-shards.sh, sourced here and by scripts/verify-local.sh,
  # which runs this flow on a developer's machine (#705). Wall time is the
  # slowest shard, not the sum: one instance with all sixteen services was
  # 25 minutes, 18 of them the suite. The acceptance shard (#596) needs
  # Knative, which only run has, and run is already the slowest shard; on an
  # instance of their own they add a runner, not wall time.
  # The instance-level tests (console, metadata, credentials, admin) run in
  # every shard, since every shard has them; compat-coverage below checks
  # that each test ran in at least one.
  compat:
    name: official SDK compatibility (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Well above its usual run; a wedged job fails here instead of at GitHub's 6-hour default (#715).
    timeout-minutes: 60
    # Same rule as integration: the suite that caught #268 only after it merged.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    strategy:
      fail-fast: false
      matrix:
        shard: [storage, served, run, emulators, acceptance]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      # The Google Cloud CLI the gcloud, gsutil and bq tests run (#694, #696),
      # pinned rather than whatever the runner image carries, in the shards
      # that export a service those tests use: bq's is BigQuery, in the
      # emulators shard. The versioned release archive,
      # checked against its pinned SHA-256 before it is unpacked, and never
      # given credentials. 88 MB and a few seconds to unpack, so it is not
      # cached: restoring the unpacked 460 MB would take longer.
      - name: Install the Google Cloud CLI
        if: matrix.shard == 'storage' || matrix.shard == 'served' || matrix.shard == 'run' || matrix.shard == 'emulators'
        run: |
          curl -fsSLo "$RUNNER_TEMP/gcloud.tar.gz" https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-586.0.0-linux-x86_64.tar.gz
          echo "6c774c76793eedd501150b59da653610fbe3eaac169e822965b722de75a2f001  $RUNNER_TEMP/gcloud.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gcloud.tar.gz" -C "$RUNNER_TEMP" && rm "$RUNNER_TEMP/gcloud.tar.gz"
          # No update check: it would reach Google from every fresh
          # configuration the tests create, and the egress guard fails that.
          printf '[component_manager]\ndisable_update_check = true\n' >> "$RUNNER_TEMP/google-cloud-sdk/properties"
          echo "$RUNNER_TEMP/google-cloud-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" version

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      # For the Python SDK suite (#287). 3.12, the version the lock resolves.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.shard == 'storage'
        with:
          python-version: "3.12"

      # For the Node.js client suite (#589), in the shards that serve its
      # services: an exact version, no dependency cache, and `make
      # compat-node` installs from the committed lock with `npm ci
      # --ignore-scripts`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.shard == 'storage' || matrix.shard == 'emulators'
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      # For the Terraform compat tests (#283). The wrapper is off so the test
      # sees terraform's own exit status and output.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      # OpenTofu for the `cloudburrow terraform --binary tofu` tests (#719),
      # in the shard that runs the Terraform wrapper tests: the release
      # tarball, checked against its pinned SHA-256 before it is unpacked.
      - name: Install OpenTofu
        if: matrix.shard == 'storage'
        run: |
          curl -fsSLo "$RUNNER_TEMP/tofu.tar.gz" https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.tar.gz
          echo "50a6106fa4de523d09c87af85f3db1dd47535fc005727fdca6852146476b88ec  $RUNNER_TEMP/tofu.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/tofu.tar.gz" -C /usr/local/bin tofu
          tofu version

      - name: Start an instance and run the compatibility suite
        run: |
          # make build, not go build: the CLI embeds the Linux storage server
          # binaries that `up` builds the storage image from (#514).
          make build
          # The shard's services, fixtures, compat-env.sh variables and restart
          # probes, from the file scripts/verify-local.sh reads too (#705).
          # shellcheck source=scripts/compat-shards.sh
          . scripts/compat-shards.sh
          compat_shard "$SHARD"
          # One set of flags for every command, so up, wait, env, status and
          # stop all name the same instance. Control, Storage and Pub/Sub are
          # OS-assigned on purpose: a fixed port hid the #269 regression.
          CB=(--name ci --state-dir "$RUNNER_TEMP/cb" "${FIXTURES[@]}"
            --port-control 0 --port-storage 0 --port-pubsub 0 --port-run 0 --port-memorystore 0 --port-cloudsql-mysql 0 --port-cloudsql 0
            --services "$SERVICES")
          RUNTIME="$RUNNER_TEMP/cb/ci/up.json"

          # up --detach returns only once /readyz is 200, and exits non-zero
          # with the log's tail otherwise (#278). Bounded: an external
          # cluster's readiness cannot be hurried.
          ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}"
          # A second detach is a no-op against the running instance.
          PID=$(jq -r .pid "$RUNTIME")
          ./bin/cloudburrow up --detach "${CB[@]}" | tee detach2.log
          grep -q 'already running' detach2.log && [ "$(jq -r .pid "$RUNTIME")" = "$PID" ] ||
            { echo "a second up --detach did not leave the running instance alone"; exit 1; }
          ./bin/cloudburrow wait --timeout 1m "${CB[@]}"
          UPLOG="$RUNNER_TEMP/cb/ci/up.log"
          if [ "$SHARD" = storage ]; then
            # The seed file was applied before the instance reported ready (#286).
            seeded=$(grep -n 'seeded .* from .*seed.json' "$UPLOG" | head -1 | cut -d: -f1)
            ready=$(grep -n 'press Ctrl-C to stop' "$UPLOG" | head -1 | cut -d: -f1)
            [ -n "$seeded" ] && [ -n "$ready" ] && [ "$seeded" -lt "$ready" ] ||
              { echo "the seed file was not applied before the ready line"; grep -n 'seed\|Ctrl-C' "$UPLOG"; exit 1; }
          fi
          if [ "$SHARD" = emulators ]; then
            # `status`, a separate process, must name the BigQuery endpoint (#277).
            ./bin/cloudburrow status "${CB[@]}" | tee status.log
            grep -q '^  bigquery  *127.0.0.1:9014' status.log || { echo "status does not show the BigQuery endpoint"; exit 1; }
          fi

          # Every SDK endpoint comes from `cloudburrow env`: what a developer
          # would export, including the OS-assigned ports, which env reads
          # from the running instance (#272, #278).
          ./bin/cloudburrow env "${CB[@]}" --format json > env.json
          # The CLOUDBURROW_TEST_* variables come from scripts/compat-env.sh,
          # the one a developer runs (#711), so the mapping from an instance
          # to them is written down once; it names each variable's source.
          # TEST_VARS, from compat_shard above: what every instance has (the
          # ADC fixture, the instance's own kubeconfig and kind cluster, the
          # admin API, the metadata server, the console, the admin token, and
          # the CLI and the flags naming this instance) and the shard's
          # services, plus the pinned gcloud installed above in the shards
          # that have it, so its tests fail rather than skip without it (#694, #696).
          # --strict: every variable named must be non-empty, and none a
          # port of 0, which would mean env fell back to configuration; the
          # script names the first that is not, with env.json and the
          # runtime file. An assignment, not eval "$(...)", so a failure
          # fails the step.
          COMPAT_ENV=$(scripts/compat-env.sh --strict --only "$TEST_VARS" --env-json env.json \
            --cli "$PWD/bin/cloudburrow" --gcloud "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" -- "${CB[@]}")
          eval "$COMPAT_ENV"
          [ -s "$CLOUDBURROW_TEST_KUBECONFIG" ] && kind get clusters | grep -qx "$CLOUDBURROW_TEST_CLUSTER" ||
            { echo "the instance's kubeconfig or kind cluster is not where the compat tests expect"; kind get clusters; exit 1; }

          # -v, so each test's PASS or SKIP is in the log. Without it go test
          # prints only a package-level "ok", and a skipped test is
          # indistinguishable from one that passed.
          set -o pipefail
          # retry_flaky re-runs a known-flaky restart test once (#566) and
          # fails a package-level failure with no test named (#675). Its
          # allow-list and removal rule: docs/compatibility.md, "Retried once" (#704).
          # shellcheck source=.github/scripts/retry-flaky.sh
          . .github/scripts/retry-flaky.sh
          if [ "$SHARD" = acceptance ]; then
            # The acceptance workflow, the release gate (#19), and test/k8s
            # (#29, #30), against this instance (#596). Their variables go to
            # these two commands only. The worker is a pod, so it is given
            # storage's in-cluster address, read from the banner `up` prints;
            # the ingress port is the gateway `env` reports. Storage, Pub/Sub
            # and Run from scripts/compat-env.sh, as for the compat shards;
            # the other two are test/e2e's own.
            ACCEPTANCE_COMPAT=$(scripts/compat-env.sh --strict --plain --only STORAGE,PUBSUB,RUN --env-json env.json \
              --cli "$PWD/bin/cloudburrow" -- "${CB[@]}")
            mapfile -t ACCEPTANCE_ENV <<< "$ACCEPTANCE_COMPAT"
            ACCEPTANCE_ENV+=(
              "CLOUDBURROW_TEST_STORAGE_INCLUSTER=$(grep -oE 'storage +host [^ ]+ +in-cluster [^ ]+' "$UPLOG" | head -1 | awk '{print $NF}')"
              "CLOUDBURROW_TEST_INGRESS=$(jq -r '.CLOUDBURROW_INGRESS // empty | sub("^.*:"; "")' env.json)"
            )
            for kv in "${ACCEPTANCE_ENV[@]}"; do
              [ -n "${kv#*=}" ] || { echo "${kv%%=*} is empty"; cat env.json "$RUNTIME"; exit 1; }
            done
            # go test exits 0 when a test skips, and each of these skips on a
            # missing variable or tool, so every test must have passed.
            all_passed() {  # <log> <tags> <package>
              local log=$1 tags=$2 pkg=$3 t bad=
              for t in $(go test -tags="$tags" -list '.*' "$pkg" | grep '^Test'); do
                grep -q -- "^--- PASS: $t (" "$log" ||
                  { echo "$t did not pass: $(grep -- "^--- [A-Z]*: $t (" "$log" || echo 'no result')"; bad=1; }
              done
              [ -z "$bad" ]
            }
            env "${ACCEPTANCE_ENV[@]}" go test -tags=e2e -count=1 -timeout 20m -v ./test/e2e/... | tee e2e.log
            all_passed e2e.log e2e ./test/e2e/... || { echo "the acceptance workflow did not pass"; exit 1; }
            env "${ACCEPTANCE_ENV[@]}" go test -tags=integration -count=1 -timeout 20m -v ./test/k8s/... | tee k8s.log
            all_passed k8s.log integration ./test/k8s/... || { echo "a test/k8s test did not pass"; exit 1; }
            echo "== acceptance: $(grep -c -- '^--- PASS' e2e.log) e2e and $(grep -c -- '^--- PASS' k8s.log) test/k8s tests passed"
          else
            set +e
            go test -tags=compat -timeout 25m -v ./test/compat/... | tee compat.log
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              retry_flaky compat.log go test -tags=compat -count=1 -timeout 10m -v ./test/compat/... ||
                { echo "compat failed"; exit 1; }
            fi
            echo "== compat summary ($SHARD): $(grep -c -- '--- PASS' compat.log) passed, $(grep -c -- '--- SKIP' compat.log) skipped, retried: $(grep -h '^RETRIED:' compat.log | sed 's/RETRIED: //' | tr '\n' ' ')"
            grep -- '--- SKIP' compat.log || true
          fi

          # The official Node.js clients (#589), configured from `cloudburrow
          # env` alone. node --test exits 0 when a test skips, and each skips
          # on a missing variable, so every test that ran must have passed:
          # Storage, Pub/Sub, Tasks and Secret Manager here, Firestore in the
          # emulators shard.
          compat_node() {  # <log> <make args...>
            local log=$1; shift
            NO_COLOR=1 make compat-node CLOUDBURROW_ARGS="${CB[*]}" "$@" | tee "$log"
            if ! grep -qx 'ℹ skipped 0' "$log" || ! grep -qx 'ℹ fail 0' "$log" || grep -qx 'ℹ pass 0' "$log"; then
              echo "the Node.js suite skipped or ran no tests: $(grep '^ℹ \(pass\|fail\|skipped\)' "$log" | paste -sd' ')"
              exit 1
            fi
          }
          if [ "$SHARD" = emulators ]; then
            compat_node node.log COMPAT_NODE_TESTS="firestore.test.mjs examples.test.mjs" COMPAT_NODE_FLAGS=--test-name-pattern=Firestore
          fi

          # The flags naming this instance, one per line, for the console
          # browser step below, which brings it up again (#594): in the
          # storage shard, and in the run shard for the screens only its
          # instance serves (#700).
          case "$SHARD" in
            storage|run) printf '%s\n' "${CB[@]}" > "$RUNNER_TEMP/cb-args" ;;
          esac
          if [ "$SHARD" = storage ]; then
            # The official Python clients against the same instance (#287),
            # configured from `cloudburrow env` alone.
            make compat-python CLOUDBURROW_ARGS="${CB[*]}"
            compat_node node.log COMPAT_NODE_FLAGS=--test-skip-pattern=Firestore

            # `logs` reads the emulator pod through the instance's kubeconfig
            # (#280): the last 20 lines, exit 0; a follow ends with 130 on SIGINT.
            ./bin/cloudburrow logs "${CB[@]}" --service pubsub --tail 20 | tee logs.txt
            [ -s logs.txt ] || { echo "logs --service pubsub printed nothing"; exit 1; }
            [ "$(wc -l < logs.txt)" -le 20 ] || { echo "logs --tail 20 printed more than 20 lines"; exit 1; }
            set +e
            timeout --preserve-status -s INT 5 ./bin/cloudburrow logs "${CB[@]}" --service pubsub --follow > follow.txt
            code=$?
            set -e
            [ "$code" = 130 ] || { echo "logs --follow exited $code on SIGINT, want 130"; exit 1; }
          fi

          # A restart probe's fixture, left alone just before stop so no
          # suite-level reset wipes it: SETUP_TESTS, from compat_shard above,
          # with the files they write (#418, #483, #596, #701).
          compat_setup_exports "$SHARD" "$RUNNER_TEMP"
          if [ -n "$SETUP_TESTS" ]; then
            go test -tags=compat -count=1 -v -run "^($(echo "$SETUP_TESTS" | tr ' ' '|'))$" ./test/compat/ | tee probe-setup.log
            for t in $SETUP_TESTS; do
              grep -q -- "--- PASS: $t" probe-setup.log || { echo "the $t restart probe setup did not pass"; exit 1; }
            done
          fi

          # stop ends the detached process and removes its pidfile.
          ./bin/cloudburrow stop "${CB[@]}"
          if kill -0 "$PID" 2>/dev/null; then echo "up (pid $PID) survived stop"; exit 1; fi
          if [ "$SHARD" = storage ]; then
            # The shutdown hook ran during stop, while storage still answered.
            grep -q '"cloudburrow-hook-bucket"' "$RUNNER_TEMP/cb-shutdown-hook.json" ||
              { echo "the shutdown.d hook did not reach storage before the cluster stopped"; cat "$RUNNER_TEMP/cb-shutdown-hook.json" 2>&1; exit 1; }
          fi
          [ ! -e "$RUNTIME" ] || { echo "stop left $RUNTIME behind"; exit 1; }

          # Durability across a restart, measured (#296, #297, #307, #418,
          # #483, #596): the suite left a probe key, a probe row, a probe entity and
          # the fixture above. This instance is persistent (the default mode), so
          # after stop and up they must be there; brought up again in
          # ephemeral mode, no backend has a volume and they must be gone.
          # Each shard probes the services it has: PROBE_TESTS, from
          # compat_shard above, and PROBE_VARS, the endpoints those tests
          # read from the restarted instance.
          if [ -n "$PROBE_TESTS" ]; then
            PROBE_RUN="^($(echo "$PROBE_TESTS" | tr ' ' '|'))$"
            probe_env() {  # <expect>: the probe tests' environment, from the restarted instance
              # The endpoints from scripts/compat-env.sh, as for the suite
              # above: the in-cluster storage server comes through the
              # restarted instance's tunnel, whose port is OS-assigned and so
              # new. --strict, so a missing one fails here, named.
              scripts/compat-env.sh --strict --plain --only "$PROBE_VARS" --env-json env-restart.json \
                --cli "$PWD/bin/cloudburrow" -- "${CB[@]}"
              # What each probe test expects to find, and the storage probe's
              # fixture.
              compat_probe_expect "$1" "$RUNNER_TEMP"
            }
            probe() {
              local expect=$1; shift
              ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}" "$@"
              ./bin/cloudburrow env "${CB[@]}" "$@" --format json > env-restart.json
              # An assignment, so a probe_env failure fails the step.
              PENV_TEXT=$(probe_env "$expect")
              mapfile -t PENV <<< "$PENV_TEXT"
              env "${PENV[@]}" \
                go test -tags=compat -count=1 -v -run "$PROBE_RUN" ./test/compat/ | tee probe.log || true
              cat probe.log >> restart.log
              # A flaky restart probe is re-run once with the same environment
              # (#566); a pass then counts, and the retry is named in the log.
              if grep -q -- '^--- FAIL: ' probe.log; then
                # A subshell exporting the probe's variables, not env(1):
                # retry_flaky is a shell function, which env cannot run, so
                # a flaky probe was never retried.
                (
                  for line in "${PENV[@]}"; do export "${line?}"; done
                  retry_flaky probe.log go test -tags=compat -count=1 -v ./test/compat/
                ) || true
                grep -- '^RETRIED:\|^--- ' probe.log | tail -n +1 >> restart.log
              fi
              ./bin/cloudburrow stop "${CB[@]}" "$@"
            }
            probe present
            probe absent --mode ephemeral
            for t in $PROBE_TESTS; do
              grep -c -- "--- PASS: $t" restart.log | grep -qx 2 ||
                { echo "the $t restart probe did not pass twice"; exit 1; }
            done
            # Storage's probe is its own setup too: at setup, after the
            # persistent restart and after the ephemeral one.
            if [ "$SHARD" = storage ]; then
              cat probe-setup.log restart.log | grep -c -- '--- PASS: TestStorageAcrossRestart' | grep -qx 3 ||
                { echo "TestStorageAcrossRestart did not pass at setup, after a persistent restart and after an ephemeral one"; exit 1; }
            fi
            echo "== restart probes retried: $(grep -h '^RETRIED:' restart.log | sed 's/RETRIED: //' | tr '\n' ' ')"
          fi

      # The console in a real browser (#594): test/browser drives headless
      # Chrome through chromedp (Go, build tag browser, pinned in go.mod, so
      # no Node toolchain) against this shard's instance. The step above
      # stopped the instance, so it is brought up again here with the same
      # flags. Most of the suite runs in the storage shard; the Cloud KMS and
      # Cloud Run screens are served only by the run shard's instance, so the
      # tests named TestKMS* and TestCloudRun* run there instead (#700).
      # Every test selected for the shard must pass: go test exits 0 on a
      # skip, and each skips without its variables or its screen.
      - name: Console in a headless browser
        if: matrix.shard == 'storage' || matrix.shard == 'run'
        run: |
          set -o pipefail
          # ubuntu-latest ships Google Chrome: it is in the runner image's
          # Browsers and Drivers list (actions/runner-images,
          # images/ubuntu/Ubuntu2404-Readme.md). Only if an image ever drops
          # it, a pinned Chrome for Testing from Google's own distribution.
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            CFT=154.0.8037.57
            echo "no google-chrome on this runner; installing Chrome for Testing $CFT"
            curl -fsSLo "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CFT/linux64/chrome-linux64.zip"
            unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP"
            CHROME="$RUNNER_TEMP/chrome-linux64/chrome"
          fi
          "$CHROME" --version
          export CLOUDBURROW_TEST_CHROME="$CHROME"
          # The page is this instance's console on loopback and nothing else,
          # which the suite asserts, so Chrome's sandbox is off: Ubuntu 24.04's
          # restriction on unprivileged user namespaces can refuse it.
          export CLOUDBURROW_TEST_CHROME_NO_SANDBOX=1
          export CLOUDBURROW_TEST_SCREENSHOTS="$RUNNER_TEMP/browser-screenshots"

          mapfile -t CB < "$RUNNER_TEMP/cb-args"
          ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}"
          # The console, the control address and the admin token, from
          # scripts/compat-env.sh as in the step above; --strict fails,
          # naming it, on any that is missing.
          BROWSER_ENV=$(scripts/compat-env.sh --strict --only CONSOLE,CONTROL,ADMIN_TOKEN --cli "$PWD/bin/cloudburrow" -- "${CB[@]}")
          eval "$BROWSER_ENV"

          # The run shard's tests, and the rest for the storage shard, from
          # the file scripts/verify-local.sh reads too (#705).
          # shellcheck source=scripts/compat-shards.sh
          . scripts/compat-shards.sh
          RUN_SHARD_TESTS=$COMPAT_BROWSER_RUN_SHARD_TESTS
          if [ "$SHARD" = run ]; then SELECT=(-run "$RUN_SHARD_TESTS"); PICK=(grep -E "$RUN_SHARD_TESTS")
          else SELECT=(-skip "$RUN_SHARD_TESTS"); PICK=(grep -vE "$RUN_SHARD_TESTS"); fi
          rc=0
          go test -tags=browser -count=1 -timeout 10m -v "${SELECT[@]}" ./test/browser/ | tee browser.log || rc=1
          for t in $(go test -tags=browser -list '.*' ./test/browser/ | grep '^Test' | "${PICK[@]}"); do
            grep -q -- "^--- PASS: $t (" browser.log ||
              { echo "$t did not pass: $(grep -- "^--- [A-Z]*: $t (" browser.log || echo 'no result')"; rc=1; }
          done
          ./bin/cloudburrow stop "${CB[@]}"
          [ "$rc" = 0 ] || { echo "the console browser suite did not pass"; exit 1; }
          echo "== browser ($SHARD): $(grep -c -- '^--- PASS' browser.log) console tests passed in $("$CHROME" --version)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && (matrix.shard == 'storage' || matrix.shard == 'run')
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-screenshots
            browser.log
          retention-days: 7
          if-no-files-found: ignore

      # The shard's test logs, for compat-coverage.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compat-log-${{ matrix.shard }}
          path: |
            compat.log
            probe-setup.log
            restart.log
            e2e.log
            k8s.log
            node.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          # The same bundle a user attaches to a bug report (#293): redacted,
          # and it records what it could not collect rather than failing.
          ./bin/cloudburrow diagnose -o diagnostics/bundle.tar.gz --name ci --state-dir "$RUNNER_TEMP/cb" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: compat-diagnostics-${{ matrix.shard }}
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          # If the suite failed before `stop`, end the detached instance here.
          PID=$(jq -r .pid "$RUNNER_TEMP/cb/ci/up.json" 2>/dev/null || true)
          [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done

  # Every compat test ran in some shard. A test whose service is in no shard
  # would skip everywhere and never be missed: the shards are gated by
  # variables, and a variable nobody exports is silent. This reads the three
  # shards' logs and fails on any test that passed or failed in none of them.
  compat-coverage:
    name: every compat test ran in a shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: compat
    if: always() && needs.compat.result != 'skipped'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compat-log-*
          path: logs
      - name: Compare the shards' logs with the package's tests
        run: |
          go test -tags=compat -list '.*' ./test/compat/ | grep '^Test' | sort > all.txt
          missing=
          for shard in storage served run emulators; do
            d=logs/compat-log-$shard
            [ -d "$d" ] || { echo "no logs from the $shard shard"; missing=1; continue; }
            # Top-level results only; a subtest's line is indented.
            cat "$d"/*.log | grep -oE -- '^--- (PASS|FAIL): Test[A-Za-z0-9_]+' | awk '{print $3}' | sort -u > "ran-$shard.txt"
            echo "== $shard ran $(wc -l < "ran-$shard.txt") tests: $(paste -sd' ' "ran-$shard.txt")"
          done
          [ -z "$missing" ] || exit 1
          sort -u ran-*.txt > ran.txt
          # Tests the compat job never runs, each for a reason: the three
          # generation tests need a local model CI does not download, and the
          # signed-URL and versioning probes run in the check job against the
          # standalone storage server, not here; the OpenTofu wrapper test
          # needs `tofu`, which CI does not install (#591); the three Functions
          # tests pull Google's builder and build from source, too slow for
          # every merge, so they run only when CLOUDBURROW_TEST_FUNCTIONS is
          # set (#678).
          never='^Test(TofuSchedulerAndSubscription|FunctionsFrameworkBuiltWithBuildpacks|FunctionsRebuildReusesLayers|FunctionsBuildBrokenModulePathFails|GenerateContentThroughTheOfficialSDK|GenerationNeverUsesApplicationDefaultCredentials|StreamGenerateContentThroughTheOfficialSDK|StorageSignedURLV2RegisteredCert|StorageVersioningPersistentMode)$'
          none=$(comm -23 all.txt ran.txt | grep -vE "$never" || true)
          if [ -n "$none" ]; then
            echo "tests that ran in no shard:"; echo "$none"; exit 1
          fi
          echo "== $(wc -l < ran.txt) of $(wc -l < all.txt) tests ran; in more than one shard (instance-level tests): $(sort ran-*.txt | uniq -d | paste -sd' ')"

  # A red main has to be visible without someone going to look.
  #
  # Only on pushes to main, never for a pull request, and the only job with
  # issues: write — so an untrusted pull request can never obtain a token that
  # writes to the repository. One tracking issue is reused rather than one per
  # failure, so a broken main is a single thing to watch.
  report-main-failure:
    name: report main failure
    needs: [check, modules, integration, compat, compat-coverage]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create main-broken --repo "$REPO" --color b60205 \
            --description "CI is failing on main" 2>/dev/null || true
          n=$(gh issue list --repo "$REPO" --label main-broken --state open --json number --jq '.[0].number // empty')
          body="CI failed on \`main\` at $SHA: $RUN_URL"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "CI is failing on main" --label main-broken \
              --body "$body

          Opened automatically by the CI workflow. It closes itself when main passes again."
          fi

  # And a green main closes that issue, so it never outlives the problem.
  report-main-recovered:
    name: report main recovered
    needs: [check, modules, integration, compat, compat-coverage]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$REPO" --label main-broken --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "main is green again at $SHA: $RUN_URL"
          done

  # ci-green is the single required check: it fails when any job failed or was
  # cancelled, and passes when every job passed or was skipped by design (the
  # compat job on a docs-only pull request). The merge queue and branch rule
  # require this job alone, so a conditional job can never leave a PR waiting
  # on a check that will not run.
  ci-green:
    name: ci-green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, modules, check, integration, compat, compat-coverage]
    if: always()
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "a job failed or was cancelled"; exit 1
          fi
