name: CI

# Checks that run on every change. This workflow never publishes anything and
# never receives credentials: release permissions are kept in a separate
# workflow so an untrusted pull request cannot reach them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No job may reach Google Cloud. The compatibility harness also refuses these
  # at runtime, but keeping them unset means a mistake cannot cost money.
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""

jobs:
  # Decides whether a pull request touches code the slow suites cover.
  #
  # Those suites used to run on pull requests only when someone added the
  # run-integration label, and the label was only added when someone already
  # suspected a problem. So a change that broke official-SDK object reads merged
  # green and main stayed red for two days (#268). Detection is plain git, not a
  # third-party action: every action here is pinned by SHA, and adding one is a
  # supply-chain decision of its own.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        # The SHAs arrive through the environment, never interpolated into the
        # script, so nothing in a pull request's metadata can be executed.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(go\.(mod|sum)$|internal/|cmd/|test/|testdata/|docs/examples/|Makefile$|\.github/workflows/ci\.yml$)'; then
            heavy=true
          else
            heavy=false
          fi
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported Go releases, so the minimum pinned in go.mod is
        # genuinely buildable rather than assumed.
        go: ["1.26", "1.27"]
        os: [ubuntu-latest]
        include:
          - go: "1.27"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: false

      # The same commands a developer runs locally. If these diverge, the
      # documented workflow is wrong.
      - run: make fmt-check
      - run: make vet
      - run: make test-race
      - run: make build

      - name: Verify the binary runs
        run: ./bin/cloudburrow version

      # The installer is run by people who have not read it, piped into sh.
      # shellcheck ships on the Ubuntu runners; the scripts' behaviour,
      # including refusing a corrupted download, is tested on both OSes by
      # test/install as part of test-race.
      # The generated API coverage must match the proto surface, the
      # registry and the compat tests' annotations (#288).
      - name: API coverage is current
        if: runner.os == 'Linux' && matrix.go == '1.27'
        run: go run ./tools/coverage -check

      - name: shellcheck the release scripts
        if: runner.os == 'Linux'
        run: shellcheck -s sh scripts/*.sh

  modules:
    name: modules and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # A dirty go.mod/go.sum after tidy means the committed dependency set is
      # not what the code actually needs.
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go mod verify
        run: go mod verify

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  integration:
    name: integration (cluster)
    runs-on: ubuntu-latest
    # Cluster tests are slow and need Docker. They run on main, and on a pull
    # request that touches code they cover (see the changes job) or is labelled
    # run-integration. A docs-only change still skips them.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=v1.36.4
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      - name: Cluster lifecycle tests
        run: go test -tags=integration -timeout 25m ./internal/cluster/...

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          kind get clusters > diagnostics/clusters.txt 2>&1 || true
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          # Bounded on purpose: a multi-megabyte dump helps nobody.
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "diagnostics/$c" --name "$c" 2>&1 | tail -50 || true
          done
          find diagnostics -type f -size +1M -delete || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Leave no clusters behind
        if: always()
        run: |
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done

  compat:
    name: official SDK compatibility
    runs-on: ubuntu-latest
    # Same rule as integration: the suite that caught #268 only after it merged.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      # For the Python SDK suite (#287). 3.12, the version the lock resolves.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # For the Terraform compat test (#283). The wrapper is off so the test
      # sees terraform's own exit status and output.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Start an instance and run the compatibility suite
        run: |
          go build -o bin/cloudburrow ./cmd/cloudburrow
          # One set of flags for every command, so up, wait, env, status and
          # stop all name the same instance. Control, Storage and Pub/Sub are
          # OS-assigned on purpose: a fixed port hid the #269 regression.
          # The hooks are the #285 fixtures: two ready.d scripts, the second
          # creating a bucket, and a shutdown.d script checked after stop.
          CB=(--name ci --state-dir "$RUNNER_TEMP/cb" --hooks-dir test/compat/testdata/hooks
            --seed-file test/compat/testdata/seed.json
            --port-control 0 --port-storage 0 --port-pubsub 0 --port-run 0 --port-memorystore 0 --port-cloudsql-mysql 0
            
            --services storage,pubsub,spanner,tasks,secretmanager,bigquery,run,memorystore,cloudsql-mysql,scheduler,datastore,logging)
          RUNTIME="$RUNNER_TEMP/cb/ci/up.json"

          # up --detach returns only once /readyz is 200, and exits non-zero
          # with the log's tail otherwise (#278). Bounded: an external
          # cluster's readiness cannot be hurried.
          ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}"
          # A second detach is a no-op against the running instance.
          PID=$(jq -r .pid "$RUNTIME")
          ./bin/cloudburrow up --detach "${CB[@]}" | tee detach2.log
          grep -q 'already running' detach2.log && [ "$(jq -r .pid "$RUNTIME")" = "$PID" ] ||
            { echo "a second up --detach did not leave the running instance alone"; exit 1; }
          ./bin/cloudburrow wait --timeout 1m "${CB[@]}"
          # The seed file was applied before the instance reported ready (#286).
          UPLOG="$RUNNER_TEMP/cb/ci/up.log"
          seeded=$(grep -n 'seeded .* from .*seed.json' "$UPLOG" | head -1 | cut -d: -f1)
          ready=$(grep -n 'press Ctrl-C to stop' "$UPLOG" | head -1 | cut -d: -f1)
          [ -n "$seeded" ] && [ -n "$ready" ] && [ "$seeded" -lt "$ready" ] ||
            { echo "the seed file was not applied before the ready line"; grep -n 'seed\|Ctrl-C' "$UPLOG"; exit 1; }

          # `status`, a separate process, must name the BigQuery endpoint (#277).
          ./bin/cloudburrow status "${CB[@]}" | tee status.log
          grep -q '^  bigquery  *127.0.0.1:9014' status.log || { echo "status does not show the BigQuery endpoint"; exit 1; }

          # Every SDK endpoint comes from `cloudburrow env`: what a developer
          # would export, including the OS-assigned ports, which env reads
          # from the running instance (#272, #278).
          ./bin/cloudburrow env "${CB[@]}" --format json > env.json
          CLOUDBURROW_TEST_STORAGE=$(jq -r '.STORAGE_EMULATOR_HOST // empty' env.json)
          CLOUDBURROW_TEST_PUBSUB=$(jq -r '.PUBSUB_EMULATOR_HOST // empty' env.json)
          CLOUDBURROW_TEST_SPANNER=$(jq -r '.SPANNER_EMULATOR_HOST // empty' env.json)
          # Datastore (#307): its durability is measured below, and its CRUD
          # test used to skip because this was never set.
          CLOUDBURROW_TEST_DATASTORE=$(jq -r '.DATASTORE_EMULATOR_HOST // empty' env.json)
          # Memorystore from the two variables env exports for it (#296); the
          # port is OS-assigned, so this also checks env read it live.
          CLOUDBURROW_TEST_MEMORYSTORE=$(jq -r 'if .REDIS_HOST and .REDIS_PORT then "\(.REDIS_HOST):\(.REDIS_PORT)" else empty end' env.json)
          # Cloud SQL for MySQL the same way, with its generated password (#297).
          CLOUDBURROW_TEST_MYSQL=$(jq -r 'if .MYSQL_HOST and .MYSQL_PORT then "\(.MYSQL_HOST):\(.MYSQL_PORT)" else empty end' env.json)
          CLOUDBURROW_TEST_MYSQL_PASSWORD=$(jq -r '.MYSQL_PASSWORD // empty' env.json)
          # Resource Manager v3 (#298), from the endpoint env exports for code.
          CLOUDBURROW_TEST_RESOURCEMANAGER=$(jq -r '.CLOUDBURROW_RESOURCEMANAGER_ENDPOINT // empty' env.json)
          # BigQuery has no emulator variable in any client library, so these
          # are CloudBurrow's own, and the project is the instance's: the
          # emulator serves that one project only (#277).
          CLOUDBURROW_TEST_BIGQUERY=$(jq -r '.CLOUDBURROW_BIGQUERY_ENDPOINT // empty' env.json)
          CLOUDBURROW_TEST_BIGQUERY_STORAGE=$(jq -r '.CLOUDBURROW_BIGQUERY_STORAGE_ENDPOINT // empty' env.json)
          CLOUDBURROW_TEST_BIGQUERY_PROJECT=$(jq -r '.GOOGLE_CLOUD_PROJECT // empty' env.json)
          # Cloud Tasks and Secret Manager have no emulator variable, and the
          # admin API is not an SDK endpoint, so these come from the runtime
          # file the running instance records its bound addresses in.
          CLOUDBURROW_TEST_CONTROL=$(jq -r '.endpoints.control // empty' "$RUNTIME")
          CLOUDBURROW_TEST_TASKS=$(jq -r '.endpoints.tasks // empty' "$RUNTIME")
          CLOUDBURROW_TEST_SECRETS=$(jq -r '.endpoints.secretmanager // empty' "$RUNTIME")
          # Cloud Scheduler (#302), from the variable env exports for code.
          CLOUDBURROW_TEST_SCHEDULER=$(jq -r '.CLOUDBURROW_SCHEDULER_ENDPOINT // empty' env.json)
          # The metadata server, which also serves IAM Credentials (#303).
          CLOUDBURROW_TEST_METADATA=$(jq -r '.endpoints.metadata // empty' "$RUNTIME")
          # Cloud Logging (#304), from the variable env exports for code.
          CLOUDBURROW_TEST_LOGGING=$(jq -r '.CLOUDBURROW_LOGGING_ENDPOINT // empty' env.json)
          # Cloud Run (#336): its tests used to skip, because run was not
          # enabled here and this was never set.
          CLOUDBURROW_TEST_RUN=$(jq -r '.endpoints.run // empty' "$RUNTIME")
          # The console, so its compat tests run rather than skip: without it
          # every console claim in compatibility.md went untested in CI.
          CLOUDBURROW_TEST_CONSOLE=$(jq -r '.endpoints.console // empty' "$RUNTIME")
          # Every CLOUDBURROW_TEST_* assigned above must be non-empty, and all
          # are exported. Read from the shell rather than kept as a list, so a
          # service adds its assignment and nothing else — the lists were
          # where every pull request that added a service collided.
          for v in $(compgen -v CLOUDBURROW_TEST_); do
            [ -n "${!v}" ] || { echo "$v is empty"; cat env.json "$RUNTIME"; exit 1; }
            export "$v"
          done
          # A port of 0 would mean env fell back to configuration.
          case "$CLOUDBURROW_TEST_STORAGE $CLOUDBURROW_TEST_PUBSUB" in
            *:0\ *|*:0) echo "env exported an unbound port: $CLOUDBURROW_TEST_STORAGE $CLOUDBURROW_TEST_PUBSUB"; exit 1 ;;
          esac
          # The CLI itself and the flags naming this instance, for tests that
          # drive a cloudburrow command, such as `cloudburrow terraform`.
          export CLOUDBURROW_TEST_CLI="$PWD/bin/cloudburrow" CLOUDBURROW_TEST_CLI_ARGS="${CB[*]}"

          # -v, so each test's PASS or SKIP is in the log. Without it go test
          # prints only a package-level "ok", and a skipped test is
          # indistinguishable from one that passed.
          set -o pipefail
          go test -tags=compat -timeout 15m -v ./test/compat/... | tee compat.log
          echo "== compat summary: $(grep -c -- '--- PASS' compat.log) passed, $(grep -c -- '--- SKIP' compat.log) skipped"
          grep -- '--- SKIP' compat.log || true

          # The official Python clients against the same instance (#287),
          # configured from `cloudburrow env` alone.
          make compat-python CLOUDBURROW_ARGS="${CB[*]}"

          # `logs` reads the emulator pod through the instance's kubeconfig
          # (#280): the last 20 lines, exit 0; a follow ends with 130 on SIGINT.
          ./bin/cloudburrow logs "${CB[@]}" --service pubsub --tail 20 | tee logs.txt
          [ -s logs.txt ] || { echo "logs --service pubsub printed nothing"; exit 1; }
          [ "$(wc -l < logs.txt)" -le 20 ] || { echo "logs --tail 20 printed more than 20 lines"; exit 1; }
          set +e
          timeout --preserve-status -s INT 5 ./bin/cloudburrow logs "${CB[@]}" --service pubsub --follow > follow.txt
          code=$?
          set -e
          [ "$code" = 130 ] || { echo "logs --follow exited $code on SIGINT, want 130"; exit 1; }

          # stop ends the detached process and removes its pidfile.
          ./bin/cloudburrow stop "${CB[@]}"
          if kill -0 "$PID" 2>/dev/null; then echo "up (pid $PID) survived stop"; exit 1; fi
          # The shutdown hook ran during stop, while storage still answered.
          grep -q '"cloudburrow-hook-bucket"' "$RUNNER_TEMP/cb-shutdown-hook.json" ||
            { echo "the shutdown.d hook did not reach storage before the cluster stopped"; cat "$RUNNER_TEMP/cb-shutdown-hook.json" 2>&1; exit 1; }
          [ ! -e "$RUNTIME" ] || { echo "stop left $RUNTIME behind"; exit 1; }

          # Memorystore and Cloud SQL for MySQL durability, measured (#296,
          # #297). The suite left a probe key and a probe row. This instance
          # is persistent (the default mode), so after stop and up both must
          # be there; brought up again in ephemeral mode, neither backend has
          # a volume and both must be gone.
          probe() {
            local expect=$1; shift
            ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}" "$@"
            ./bin/cloudburrow env "${CB[@]}" "$@" --format json > env-restart.json
            CLOUDBURROW_TEST_MEMORYSTORE=$(jq -r '"\(.REDIS_HOST):\(.REDIS_PORT)"' env-restart.json) \
            CLOUDBURROW_TEST_MEMORYSTORE_EXPECT="$expect" \
            CLOUDBURROW_TEST_MYSQL=$(jq -r '"\(.MYSQL_HOST):\(.MYSQL_PORT)"' env-restart.json) \
            CLOUDBURROW_TEST_MYSQL_PASSWORD=$(jq -r '.MYSQL_PASSWORD' env-restart.json) \
            CLOUDBURROW_TEST_MYSQL_EXPECT="$expect" \
            CLOUDBURROW_TEST_DATASTORE=$(jq -r '.DATASTORE_EMULATOR_HOST' env-restart.json) \
            CLOUDBURROW_TEST_DATASTORE_EXPECT="$expect" \
              go test -tags=compat -count=1 -v -run '^Test(Memorystore|CloudSQLMySQL|Datastore)AcrossRestart$' ./test/compat/ | tee -a restart.log
            ./bin/cloudburrow stop "${CB[@]}" "$@"
          }
          probe present
          probe absent --mode ephemeral
          for t in TestMemorystoreAcrossRestart TestCloudSQLMySQLAcrossRestart TestDatastoreAcrossRestart; do
            grep -c -- "--- PASS: $t" restart.log | grep -qx 2 ||
              { echo "the $t restart probe did not pass twice"; exit 1; }
          done

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          # The same bundle a user attaches to a bug report (#293): redacted,
          # and it records what it could not collect rather than failing.
          ./bin/cloudburrow diagnose -o diagnostics/bundle.tar.gz --name ci --state-dir "$RUNNER_TEMP/cb" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: compat-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          # If the suite failed before `stop`, end the detached instance here.
          PID=$(jq -r .pid "$RUNNER_TEMP/cb/ci/up.json" 2>/dev/null || true)
          [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done

  # A red main has to be visible without someone going to look.
  #
  # Only on pushes to main, never for a pull request, and the only job with
  # issues: write — so an untrusted pull request can never obtain a token that
  # writes to the repository. One tracking issue is reused rather than one per
  # failure, so a broken main is a single thing to watch.
  report-main-failure:
    name: report main failure
    needs: [check, modules, integration, compat]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create main-broken --repo "$REPO" --color b60205 \
            --description "CI is failing on main" 2>/dev/null || true
          n=$(gh issue list --repo "$REPO" --label main-broken --state open --json number --jq '.[0].number // empty')
          body="CI failed on \`main\` at $SHA: $RUN_URL"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "CI is failing on main" --label main-broken \
              --body "$body

          Opened automatically by the CI workflow. It closes itself when main passes again."
          fi

  # And a green main closes that issue, so it never outlives the problem.
  report-main-recovered:
    name: report main recovered
    needs: [check, modules, integration, compat]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$REPO" --label main-broken --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "main is green again at $SHA: $RUN_URL"
          done
