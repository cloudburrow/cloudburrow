# The fourteen gated Functions tests, with the ungated TestFunctionsAPI and
# TestFunctionsEventTriggers, and the gated halves of TestGcloudFunctions and
# TestTerraformCloudFunctions2Function (#1377) and TestGcloudFunctionsEventTriggers
# (#1414) (#678; TestFunctionsSubmitBuildBuildpacks since #1268;
# TestFunctionsEventTriggerBuilds since #1414; TestFunctionsV1BuildsAndServes,
# with the ungated TestFunctionsV1API and the gated halves of TestGcloudFunctionsV1,
# TestConsoleFunctionsV1 and TestTerraformCloudFunctionsFunction, since #1428;
# TestFunctionsSecretsBuildsAndMounts, with the ungated TestFunctionsFields and
# TestFunctionsV1Fields, since #1464;
# TestFunctionsNodejsBuiltWithBuildpacks and TestFunctionsPythonBuiltWithBuildpacks
# since #1303; the Java, Ruby, PHP and .NET ones since #1319), on demand:
# TestFunctionsFrameworkBuiltWithBuildpacks builds testdata/function with the
# pinned Google builder and deploys it through the official Cloud Run v2
# client, and the language tests do the same for testdata/function-nodejs,
# -python, -java, -ruby, -php and -dotnet; they
# need amd64 kind nodes (the builder's only platform), which a maintainer's
# arm64 Mac does not have;
# TestFunctionsRebuildReusesLayers and TestFunctionsBuildBrokenModulePathFails
# need only pack and Docker. They pull Google's builder and run images and
# take minutes, so this runs by hand only: never on a pull request, in the
# merge queue or on a schedule, because runners are what the queue waits on.
# ci.yml's compat-coverage keeps them on its `never` list for the same reason.
name: Functions build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

env:
  # No job may reach Google Cloud; the compatibility harness also refuses
  # these at runtime. Same as ci.yml.
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""

jobs:
  functions:
    name: Functions Framework built with Buildpacks (amd64)
    # amd64: the Google builder publishes linux/amd64 only, and
    # TestFunctionsFrameworkBuiltWithBuildpacks skips on any other node.
    runs-on: ubuntu-latest
    # 165: ten tests, eight of which build their fixture twice (#1319),
    # gcloud's and Terraform's builds of testdata/function (#1377), and four
    # more of it with event triggers, two through the client and two through
    # gcloud (#1414), and one that mounts Secret Manager secrets (#1464).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      # The embedded BigQuery emulator from ci.yml's cache (#1130), read
      # only, under ci.yml's key (this job runs on the same ubuntu-latest):
      # make build's bqengine keeps binaries whose stamps match the sources
      # and the go command, and builds them from source on a miss.
      - id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: internal/bigqueryimage/bin/bigquery-emulator-*
          key: bigquery-emulator-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('tools/bqengine/*.go', 'third_party/bigquery-emulator/sources.json', 'third_party/bigquery-emulator/go.mod', 'third_party/bigquery-emulator/go.sum', 'third_party/bigquery-emulator/patches/**') }}

      - name: Install kubectl
        run: |
          curl --retry 5 --retry-all-errors -fsSLo kubectl "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      # The pinned Google Cloud CLI and Terraform, as ci.yml installs them,
      # for TestGcloudFunctions and TestTerraformCloudFunctions2Function
      # (#1377), whose deploys from source are gated as the Functions tests are.
      - name: Install the Google Cloud CLI
        run: |
          curl --retry 5 --retry-all-errors -fsSLo "$RUNNER_TEMP/gcloud.tar.gz" https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-586.0.0-linux-x86_64.tar.gz
          echo "6c774c76793eedd501150b59da653610fbe3eaac169e822965b722de75a2f001  $RUNNER_TEMP/gcloud.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gcloud.tar.gz" -C "$RUNNER_TEMP" && rm "$RUNNER_TEMP/gcloud.tar.gz"
          # The beta commands (gcloud beta run domain-mappings, #1349) need the
          # beta component, installed here, at the release pinned above,
          # rather than offered from dl.google.com mid-test.
          "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" components install beta --quiet
          # No update check: it would reach Google from every fresh
          # configuration the tests create, and the egress guard fails that.
          printf '[component_manager]\ndisable_update_check = true\n' >> "$RUNNER_TEMP/google-cloud-sdk/properties"
          echo "$RUNNER_TEMP/google-cloud-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" version

      # For the Terraform compat tests (#283). The wrapper is off so the test
      # sees terraform's own exit status and output. At least 1.16.5 (#1620):
      # 1.16.4 could crash saving a failed create's tainted object, with
      # "status ObjectStatus(0), which cannot be saved in state".
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          version: v0.33.0

      # pack at the version dependencies.json pins (build.packCli, 0.40.9):
      # the release tarball, checked against the SHA-256 the release
      # publishes (pack-v0.40.9-linux.tgz.sha256) before it is unpacked.
      - name: Install pack
        run: |
          curl --retry 5 --retry-all-errors -fsSLo "$RUNNER_TEMP/pack.tgz" https://github.com/buildpacks/pack/releases/download/v0.40.9/pack-v0.40.9-linux.tgz
          echo "dc0ee1e931cf8a106d7555a01a214864f9acb60b77adf15d69b74df4404758e9  $RUNNER_TEMP/pack.tgz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/pack.tgz" -C /usr/local/bin pack
          pack version

      # The CLI embeds the Linux storage server that `up` builds the storage
      # image from (#514): make build runs make storage-binaries first, the
      # step cli-integration.yml runs on its own, then builds bin/cloudburrow.
      - name: Build the CLI
        run: make build

      - name: Start an instance and run the Functions tests
        run: |
          # The run shard's services and fixtures, from the file ci.yml's
          # compat job reads (#705), and the same flags, so the instance is
          # the one TestFunctionsFrameworkBuiltWithBuildpacks would meet in
          # that shard.
          # shellcheck source=scripts/compat-shards.sh
          . scripts/compat-shards.sh
          compat_shard run
          CB=(--name ci --state-dir "$RUNNER_TEMP/cb" "${FIXTURES[@]}"
            --port-control 0 --port-storage 0 --port-pubsub 0 --port-run 0 --port-memorystore 0 --port-cloudsql-mysql 0 --port-cloudsql 0
            --services "$SERVICES")

          # up --detach returns only once /readyz is 200, and exits non-zero
          # with the log's tail otherwise (#278).
          ./bin/cloudburrow up --detach --detach-timeout 10m "${CB[@]}"
          ./bin/cloudburrow wait --timeout 1m "${CB[@]}"
          kubectl --kubeconfig "$RUNNER_TEMP/cb/ci/kubeconfig" get nodes -o jsonpath='{range .items[*]}{.status.nodeInfo.architecture}{"\n"}{end}' | tee arch.txt
          if [ ! -s arch.txt ] || grep -vqx amd64 arch.txt; then echo "the cluster's nodes are not all amd64"; exit 1; fi

          # The harness variables from scripts/compat-env.sh (#711), the run
          # shard's list, GCLOUD the CLI installed above. --strict: every one
          # set, none a port of 0. An assignment, not eval "$(...)", so a
          # failure fails the step.
          ./bin/cloudburrow env "${CB[@]}" --format json > env.json
          # And Service Usage and Resource Manager, which the run shard does
          # not export: gcloud functions deploy reads both once a deploy
          # succeeds, and the harness points gcloud at only the services it
          # names (run 38919482569). This job runs only the Functions tests, so
          # neither suite runs twice.
          TEST_VARS+=,SERVICEUSAGE,RESOURCEMANAGER
          COMPAT_ENV=$(scripts/compat-env.sh --strict --only "$TEST_VARS" --env-json env.json \
            --cli "$PWD/bin/cloudburrow" --gcloud "$RUNNER_TEMP/google-cloud-sdk/bin/gcloud" -- "${CB[@]}")
          eval "$COMPAT_ENV"

          # The Functions tests, gcloud's and Terraform's deploys of the
          # same fixture (#1377), its event triggers through the client
          # and gcloud (#1414), and its 1st-gen deploys through the v1 API,
          # gcloud --no-gen2, the console and Terraform (#1428).
          TESTS='TestFunctions|^TestGcloudFunctions$|^TestGcloudFunctionsEventTriggers$|^TestGcloudFunctionsV1$|^TestTerraformCloudFunctions2Function$|^TestConsoleFunctionsV1$|^TestTerraformCloudFunctionsFunction$'
          set -o pipefail
          rc=0
          CLOUDBURROW_TEST_FUNCTIONS=1 go test -tags compat -count=1 -timeout 160m -run "$TESTS" -v ./test/compat/ | tee functions.log || rc=1
          # go test exits 0 when a test skips, and each of these skips
          # without the gate, a tool or amd64 nodes, so every selected test
          # must have passed: the acceptance shard's all_passed in ci.yml,
          # over this -run.
          bad=
          for t in $(go test -tags compat -list "$TESTS" ./test/compat/ | grep '^Test'); do
            grep -q -- "^--- PASS: $t (" functions.log ||
              { echo "$t did not pass: $(grep -- "^--- [A-Z]*: $t (" functions.log || echo 'no result')"; bad=1; }
          done
          [ "$rc" = 0 ] && [ -z "$bad" ] || { echo "the Functions tests did not pass"; exit 1; }
          echo "== functions: $(grep -c -- '^--- PASS' functions.log) passed, pack $(pack version)"

          ./bin/cloudburrow stop "${CB[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functions-log
          path: functions.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          # The bug-report bundle (#293) and the kind logs, as arm64.yml collects.
          ./bin/cloudburrow diagnose -o diagnostics/bundle.tar.gz --name ci --state-dir "$RUNNER_TEMP/cb" || true
          kind get clusters > diagnostics/clusters.txt 2>&1 || true
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "diagnostics/$c" --name "$c" 2>&1 | tail -50 || true
          done
          # Bounded on purpose: a multi-megabyte dump helps nobody.
          find diagnostics -type f -size +1M ! -name bundle.tar.gz -delete || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: functions-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          # If the run failed before `stop`, end the detached instance here.
          PID=$(jq -r .pid "$RUNNER_TEMP/cb/ci/up.json" 2>/dev/null || true)
          [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done
