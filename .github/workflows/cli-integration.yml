# The cmd/cloudburrow integration tests (#685): `up` starts, becomes ready and
# stops cleanly (TestUpStartsBecomesReadyAndStopsCleanly), says nothing is
# running before it is (TestUpDoesNotClaimServicesAreRunning), and two
# instances run side by side with a port base (#584,
# TestTwoInstancesRunSideBySideWithAPortBase). Each creates kind clusters.
#
# On pushes to main only, never on a pull request or a merge group: runners are
# what the merge queue waits on, and this is its own workflow, not a job in
# CI, so ci-green never waits on it and it cannot block a merge. A failure is
# a red run on the main commit that broke it. The offline test is nightly, in
# offline.yml.
name: CLI integration

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time. Not cancel-in-progress: merges can land faster than a run
# takes, and cancelling would mean none ever finished. GitHub keeps only the
# newest pending run, which tests every commit before it too.
concurrency:
  group: cli-integration
  cancel-in-progress: false

env:
  # No job may reach Google Cloud.
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""

jobs:
  cli-integration:
    name: cmd/cloudburrow integration
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      # The CLI embeds the Linux storage server that `up` builds the storage
      # image from (#514); both the in-process runUp and the tests' own
      # `go build` need it in place.
      - name: Build the embedded storage server
        run: make storage-binaries

      - name: Integration tests
        run: |
          # Every test in cmd/cloudburrow's integration-tagged files, except
          # the offline one, which is nightly. Read from the files, so a test
          # added there runs here without editing this list.
          tests=$(grep -l '^//go:build integration' cmd/cloudburrow/*_test.go |
            xargs grep -ho '^func Test[A-Za-z0-9_]*' | sed 's/^func //' |
            grep -vx TestPrefetchThenUpOfflineWithNoEgress | sort -u)
          [ -n "$tests" ] || { echo "no integration tests found in cmd/cloudburrow"; exit 1; }
          echo "$tests"
          set +e
          go test -tags=integration -count=1 -timeout 40m -v \
            -run "^($(echo "$tests" | paste -sd '|' -))\$" ./cmd/cloudburrow/ | tee cli-integration.log
          rc=${PIPESTATUS[0]}
          set -e
          # go test exits 0 when a test skips, so each must have passed, as
          # the acceptance shard requires of test/e2e and test/k8s.
          bad=
          for t in $tests; do
            grep -q -- "^--- PASS: $t (" cli-integration.log ||
              { echo "$t did not pass: $(grep -- "^--- [A-Z]*: $t (" cli-integration.log || echo 'no result')"; bad=1; }
          done
          if [ "$rc" -ne 0 ] || [ -n "$bad" ]; then
            echo "a cmd/cloudburrow integration test did not pass"; exit 1
          fi

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp cli-integration.log diagnostics/ 2>/dev/null || true
          kind get clusters > diagnostics/clusters.txt 2>&1 || true
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          # Bounded on purpose: a multi-megabyte dump helps nobody.
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "diagnostics/$c" --name "$c" 2>&1 | tail -50 || true
          done
          find diagnostics -type f -size +1M -delete || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cli-integration-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Leave no clusters behind
        if: always()
        run: |
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done
