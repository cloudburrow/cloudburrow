name: linux/arm64 nightly

# The linux/arm64 archive on a native arm64 runner (#689): the unit tests and
# build, then an instance brought up on a kind cluster of arm64 nodes and an
# official-SDK subset run against it. Nightly and by hand only, never on a
# pull request or in the merge queue: runners are what the queue waits on,
# and ci.yml already covers linux/amd64 there.
on:
  schedule:
    # 04:17 UTC, off the hour so it does not queue behind every other
    # scheduled workflow on GitHub.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  # No job may reach Google Cloud; the compatibility harness also refuses
  # these at runtime. Same as ci.yml.
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""

jobs:
  check:
    name: check (ubuntu-24.04-arm, go 1.27)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: false

      # fmt-check, vet and test-race: what ci.yml's check job runs, through
      # the one target a developer runs locally.
      - run: make check
      - run: make build

      - name: Verify the binary runs and is arm64
        run: |
          ./bin/cloudburrow version
          go version -m bin/cloudburrow | tee buildinfo.txt
          grep -qE '^\s+build\s+GOARCH=arm64$' buildinfo.txt || { echo "bin/cloudburrow is not an arm64 binary"; exit 1; }

  cluster:
    name: cluster and SDK subset (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # ci.yml's version, for arm64. jq is on the x64 images ci.yml uses;
      # installed here in case the arm64 image lacks it.
      - name: Install kubectl
        run: |
          command -v jq >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq jq; }
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.36.4/bin/linux/arm64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      # The action picks the kind binary for the runner's architecture.
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0

      - name: Start an instance and run the SDK subset
        run: |
          # make build, not go build: the CLI embeds the Linux storage server
          # binaries (amd64 and arm64) that `up` builds the storage image
          # from (#514). On this runner the arm64 one is used.
          make build

          # A cut-down copy of ci.yml's compat job, storage shard: the same
          # flags, the same env export, only Storage and Pub/Sub. Keep the two
          # in step until #711 moves the shard setup into one script.
          CB=(--name ci --state-dir "$RUNNER_TEMP/cb"
            --port-control 0 --port-storage 0 --port-pubsub 0
            --services "storage,pubsub")
          RUNTIME="$RUNNER_TEMP/cb/ci/up.json"

          # up --detach returns only once /readyz is 200, and exits non-zero
          # with the log's tail otherwise (#278).
          ./bin/cloudburrow up --detach --detach-timeout 15m "${CB[@]}"
          ./bin/cloudburrow wait --timeout 2m "${CB[@]}"
          # Every node is arm64, so what ran is the arm64 storage image and
          # the arm64 variants of the upstream images.
          kubectl --kubeconfig "$RUNNER_TEMP/cb/ci/kubeconfig" get nodes -o jsonpath='{range .items[*]}{.status.nodeInfo.architecture}{"\n"}{end}' | tee arch.txt
          if [ ! -s arch.txt ] || grep -vqx arm64 arch.txt; then echo "the cluster's nodes are not all arm64"; exit 1; fi

          # The endpoints from `cloudburrow env`, as in ci.yml.
          ./bin/cloudburrow env "${CB[@]}" --format json > env.json
          CLOUDBURROW_TEST_STORAGE=$(jq -r '.STORAGE_EMULATOR_HOST // empty' env.json)
          CLOUDBURROW_TEST_PUBSUB=$(jq -r '.PUBSUB_EMULATOR_HOST // empty' env.json)
          export CLOUDBURROW_TEST_STORAGE CLOUDBURROW_TEST_PUBSUB
          # Both set, and neither a port of 0, which would mean env fell
          # back to configuration.
          for kv in "STORAGE=$CLOUDBURROW_TEST_STORAGE" "PUBSUB=$CLOUDBURROW_TEST_PUBSUB"; do
            case "${kv#*=}" in
              "") echo "CLOUDBURROW_TEST_${kv%%=*} is empty"; cat env.json "$RUNTIME"; exit 1 ;;
              *:0) echo "env exported an unbound port: CLOUDBURROW_TEST_$kv"; exit 1 ;;
            esac
          done

          # A subset of the storage shard: official Go client object and
          # bucket operations against the in-cluster storage server, and the
          # Pub/Sub emulator's publish, pull and streaming pull.
          TESTS='^(TestStorage(BucketLifecycle|ObjectRoundTrip|ListWithPrefix|GenerationPreconditions|ResumableUploadAndRangedRead|Compose|Copy|Checksums)|TestPubSub(TopicLifecycle|PublishAndPull|StreamingPull|OrderingKeys))$'
          set -o pipefail
          go test -tags=compat -count=1 -timeout 20m -v -run "$TESTS" ./test/compat/ | tee compat.log
          # go test exits 0 when a test skips, and each of these skips on a
          # missing variable, so every selected test must have passed: the
          # acceptance shard's all_passed in ci.yml, over this -run.
          bad=
          for t in $(go test -tags=compat -list "$TESTS" ./test/compat/ | grep '^Test'); do
            grep -q -- "^--- PASS: $t (" compat.log ||
              { echo "$t did not pass: $(grep -- "^--- [A-Z]*: $t (" compat.log || echo 'no result')"; bad=1; }
          done
          [ -z "$bad" ] || { echo "the arm64 SDK subset did not pass"; exit 1; }
          echo "== arm64 compat: $(grep -c -- '^--- PASS' compat.log) passed"

          ./bin/cloudburrow stop "${CB[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: arm64-compat-log
          path: compat.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          # The bug-report bundle (#293) and the kind logs, as ci.yml collects.
          ./bin/cloudburrow diagnose -o diagnostics/bundle.tar.gz --name ci --state-dir "$RUNNER_TEMP/cb" || true
          kind get clusters > diagnostics/clusters.txt 2>&1 || true
          docker ps -a > diagnostics/containers.txt 2>&1 || true
          for c in $(kind get clusters 2>/dev/null); do
            kind export logs "diagnostics/$c" --name "$c" 2>&1 | tail -50 || true
          done
          # Bounded on purpose: a multi-megabyte dump helps nobody.
          find diagnostics -type f -size +1M ! -name bundle.tar.gz -delete || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: arm64-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          # If the run failed before `stop`, end the detached instance here.
          PID=$(jq -r .pid "$RUNNER_TEMP/cb/ci/up.json" 2>/dev/null || true)
          [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
          for c in $(kind get clusters 2>/dev/null); do kind delete cluster --name "$c" || true; done
