# Dependency update configuration.
#
# Discovery only: these PRs are proposals, and #31 is what decides whether a
# candidate is actually compatible. Nothing here publishes or auto-merges.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Google SDKs move together; separate PRs for each would be noise.
      google-sdks:
        patterns:
          - "cloud.google.com/go*"
          - "google.golang.org/*"
          - "github.com/googleapis/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The Node.js compat suite's official clients (#589). Proposals only, as
  # above: a bump is a candidate for `make compat-node`, not a verdict.
  - package-ecosystem: npm
    directory: /test/compat-node
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      google-cloud-node:
        patterns:
          - "*"
