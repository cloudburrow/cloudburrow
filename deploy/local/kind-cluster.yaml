kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloudburrow-verify
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "cloudburrow.dev/owned=true"
    extraPortMappings:
      - containerPort: 31080
        hostPort: 31080
        protocol: TCP
