apiVersion: v1
kind: Namespace
metadata:
  name: cloudburrow
  labels: { cloudburrow.dev/owned: "true" }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: gcs-data, namespace: cloudburrow, labels: { cloudburrow.dev/owned: "true" } }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pubsub, namespace: cloudburrow, labels: { cloudburrow.dev/owned: "true" } }
spec:
  replicas: 1
  selector: { matchLabels: { app: pubsub } }
  template:
    metadata: { labels: { app: pubsub, cloudburrow.dev/owned: "true" } }
    spec:
      containers:
        - name: emulator
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:3294e8a543de846703594a8a89bfe009e0e9ffbdd2e495d00133f3de14cabcc0
          command: ["gcloud","beta","emulators","pubsub","start","--project=cloudburrow","--host-port=0.0.0.0:8085"]
          ports: [{ containerPort: 8085 }]
          readinessProbe: { tcpSocket: { port: 8085 }, initialDelaySeconds: 2, periodSeconds: 2 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: pubsub, namespace: cloudburrow }
spec:
  selector: { app: pubsub }
  ports: [{ name: grpc, port: 8085, targetPort: 8085 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage, namespace: cloudburrow, labels: { cloudburrow.dev/owned: "true" } }
spec:
  replicas: 1
  selector: { matchLabels: { app: storage } }
  template:
    metadata: { labels: { app: storage, cloudburrow.dev/owned: "true" } }
    spec:
      containers:
        - name: fake-gcs
          image: fsouza/fake-gcs-server:1.56.1
          args: ["-scheme","http","-port","4443","-backend","filesystem","-filesystem-root","/data","-public-host","storage.cloudburrow.svc.cluster.local:4443"]
          ports: [{ containerPort: 4443 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /storage/v1/b, port: 4443 }, initialDelaySeconds: 2, periodSeconds: 2 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 512Mi } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gcs-data }
---
apiVersion: v1
kind: Service
metadata: { name: storage, namespace: cloudburrow }
spec:
  selector: { app: storage }
  ports: [{ name: http, port: 4443, targetPort: 4443 }]
